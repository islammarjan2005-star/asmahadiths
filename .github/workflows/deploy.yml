name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/app-transformation-zPzSi]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ASMA-claude-build-islamic-companion-app-M9ni0
        run: npm ci

      - name: Build
        working-directory: ASMA-claude-build-islamic-companion-app-M9ni0
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ASMA-claude-build-islamic-companion-app-M9ni0/dist
