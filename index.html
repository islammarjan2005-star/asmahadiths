    // ============================================
    // INTERACTIVE ARABIC VERSE COMPONENT
    // Word-by-word display with click-to-play and highlighting
    // ============================================

    const InteractiveArabicVerse = ({
      surah,
      verse,
      arabicText,
      isPlaying = false,
      audioDuration = 0,
      currentTime = 0,
      onWordClick,
      compact = false,
      showHint = true
    }) => {
      const [words, setWords] = useState([]);
      const [loading, setLoading] = useState(true);
      const [playingWordIndex, setPlayingWordIndex] = useState(-1);
      const [activeWordIndex, setActiveWordIndex] = useState(-1);
      const [showTooltipIndex, setShowTooltipIndex] = useState(-1);

      // Fetch word-by-word data
      useEffect(() => {
        const fetchWords = async () => {
          if (!surah || !verse) {
            // If no surah/verse provided, parse Arabic text
            if (arabicText) {
              const arabicWords = arabicText.split(/\s+/).filter(w => w.trim());
              setWords(arabicWords.map((w, i) => ({
                id: i,
                position: i + 1,
                text: w,
                translation: QuranWordByWord.getBasicTranslation(w),
                charType: 'word'
              })));
            }
            setLoading(false);
            return;
          }

          setLoading(true);
          try {
            const wordData = await QuranWordByWord.getVerseWords(surah, verse);
            setWords(wordData);
          } catch (error) {
            console.error('Failed to fetch words:', error);
            // Fallback to splitting Arabic text
            if (arabicText) {
              const arabicWords = arabicText.split(/\s+/).filter(w => w.trim());
              setWords(arabicWords.map((w, i) => ({
                id: i,
                position: i + 1,
                text: w,
                translation: QuranWordByWord.getBasicTranslation(w),
                charType: 'word'
              })));
            }
          }
          setLoading(false);
        };

        fetchWords();
      }, [surah, verse, arabicText]);

      // Update active word during playback
      useEffect(() => {
        // Reset when not playing
        if (!isPlaying) {
          setActiveWordIndex(-1);
          return;
        }

        // Can't highlight without words
        if (words.length === 0) {
          return;
        }

        // Calculate active word index based on current time
        // If we don't have duration yet, keep first word highlighted
        let newIndex = 0;
        if (audioDuration > 0 && isFinite(audioDuration)) {
          const avgWordDuration = audioDuration / words.length;
          if (avgWordDuration > 0) {
            newIndex = Math.floor(currentTime / avgWordDuration);
            newIndex = Math.min(Math.max(0, newIndex), words.length - 1);
          }
        }

        // Use functional update to avoid stale state issues
        setActiveWordIndex(prevIndex => {
          if (prevIndex !== newIndex) {
            return newIndex;
          }
          return prevIndex;
        });
      }, [isPlaying, currentTime, audioDuration, words.length]);

      // Handle word click - play individual word audio
      const handleWordClick = async (word, index) => {
        haptic.light();

        // Toggle tooltip on mobile
        if (showTooltipIndex === index) {
          setShowTooltipIndex(-1);
        } else {
          setShowTooltipIndex(index);
        }

        // Play word audio if we have surah/verse info
        if (surah && verse) {
          setPlayingWordIndex(index);
          await QuranWordByWord.playWord(surah, verse, word.position, (state) => {
            if (state === 'stopped' || state === 'error') {
              setPlayingWordIndex(-1);
            }
          });
        }

        // Callback for parent component
        if (onWordClick) {
          onWordClick(word, index);
        }
      };

      // Close tooltip when clicking elsewhere
      useEffect(() => {
        const handleClickOutside = () => setShowTooltipIndex(-1);
        document.addEventListener('click', handleClickOutside);
        return () => document.removeEventListener('click', handleClickOutside);
      }, []);

      if (loading) {
        return (
          <div className="flex justify-center items-center py-4">
            <div className="w-6 h-6 border-2 border-pink-300 border-t-pink-600 rounded-full animate-spin"></div>
          </div>
        );
      }

      if (!words || words.length === 0) {
        // Fallback to regular Arabic text
        return (
          <p className={`font-arabic ${compact ? 'text-xl' : 'text-2xl'} text-pink-800 text-right leading-loose`} dir="rtl">
            {arabicText}
          </p>
        );
      }

      return (
        <div className="relative">
          <div className={`interactive-verse ${compact ? 'text-lg' : 'text-2xl'}`} onClick={(e) => e.stopPropagation()}>
            {words.map((word, index) => (
              <span
                key={word.id || index}
                className={`quran-word text-pink-800 ${
                  playingWordIndex === index ? 'word-playing' : ''
                } ${
                  activeWordIndex === index ? 'word-active' : ''
                } ${
                  showTooltipIndex === index ? 'show-tooltip' : ''
                }`}
                onClick={(e) => {
                  e.stopPropagation();
                  handleWordClick(word, index);
                }}
              >
                {word.text}

                {/* Tooltip with translation */}
                <span className="word-tooltip">
                  <span className="block font-medium">{word.translation}</span>
                  {word.transliteration && (
                    <span className="block text-xs opacity-75 mt-1">{word.transliteration}</span>
                  )}
                </span>

                {/* First word hint indicator */}
                {showHint && index === 0 && !isPlaying && playingWordIndex === -1 && (
                  <span className="tap-hint">
                    <svg className="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                  </span>
                )}
              </span>
            ))}
          </div>

          {/* Progress bar during playback */}
          {isPlaying && (
            <div className="verse-progress">
              <div
                className="verse-progress-bar"
                style={{
                  width: audioDuration > 0
                    ? `${Math.min(100, (currentTime / audioDuration) * 100)}%`
                    : '5%'
                }}
              />
            </div>
          )}
        </div>
      );
    };

    // Daily Quran Verse Carousel
    const VerseCarousel = () => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [audioState, setAudioState] = useState('stopped'); // stopped, loading, playing
      const [audioDuration, setAudioDuration] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);

      const verses = [
        { arabic: 'إِنَّ مَعَ الْعُسْرِ يُسْرًا', translation: 'Indeed, with hardship comes ease.', reference: 'Ash-Sharh 94:6', surah: 94, verse: 6 },
        { arabic: 'وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ', translation: 'Put your trust in the Ever-Living who never dies.', reference: 'Al-Furqan 25:58', surah: 25, verse: 58 },
        { arabic: 'رَبِّ اشْرَحْ لِي صَدْرِي', translation: 'My Lord, expand for me my chest.', reference: 'Ta-Ha 20:25', surah: 20, verse: 25 },
        { arabic: 'فَاذْكُرُونِي أَذْكُرْكُمْ', translation: 'Remember Me; I will remember you.', reference: 'Al-Baqarah 2:152', surah: 2, verse: 152 },
        { arabic: 'وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ', translation: 'He is with you wherever you are.', reference: 'Al-Hadid 57:4', surah: 57, verse: 4 }
      ];

      useEffect(() => {
        const timer = setInterval(() => {
          if (audioState !== 'playing') {
            setCurrentIndex(i => (i + 1) % verses.length);
          }
        }, 8000);
        return () => clearInterval(timer);
      }, [audioState]);

      // Stop audio when verse changes
      useEffect(() => {
        QuranAudio.stop();
        QuranWordByWord.stopWord();
        setAudioState('stopped');
        setAudioDuration(0);
        setCurrentTime(0);
      }, [currentIndex]);

      // Use ref to store interval ID for cleanup
      const timeUpdateRef = React.useRef(null);

      const handlePlayPause = async () => {
        if (audioState === 'playing') {
          QuranAudio.stop();
          if (timeUpdateRef.current) {
            clearInterval(timeUpdateRef.current);
            timeUpdateRef.current = null;
          }
          setAudioState('stopped');
          setCurrentTime(0);
        } else {
          haptic.light();
          const verse = verses[currentIndex];

          // Create custom audio handler to track time
          const parsed = QuranAudio.parseReference(verse.reference);
          if (parsed) {
            setAudioState('loading');
            try {
              const audioUrl = await QuranAudio.getAyahAudio(parsed.surah, parsed.ayahStart);
              if (audioUrl) {
                QuranAudio.currentAudio = new Audio(audioUrl);
                QuranAudio.currentAudio.preload = 'auto';

                // Wait for audio to be ready with duration before playing
                await new Promise((resolve, reject) => {
                  const audio = QuranAudio.currentAudio;

                  const onReady = () => {
                    // Get duration - it should be available now
                    if (audio.duration && isFinite(audio.duration) && audio.duration > 0) {
                      setAudioDuration(audio.duration);
                    }
                    cleanup();
                    resolve();
                  };

                  const onError = () => {
                    cleanup();
                    reject(new Error('Audio load failed'));
                  };

                  const cleanup = () => {
                    audio.removeEventListener('canplaythrough', onReady);
                    audio.removeEventListener('loadeddata', onReady);
                    audio.removeEventListener('error', onError);
                  };

                  audio.addEventListener('canplaythrough', onReady);
                  audio.addEventListener('loadeddata', onReady);
                  audio.addEventListener('error', onError);

                  // Start loading
                  audio.load();

                  // Timeout fallback after 5 seconds
                  setTimeout(() => {
                    if (audio.readyState >= 2) {
                      onReady();
                    }
                  }, 5000);
                });

                QuranAudio.currentAudio.onended = () => {
                  QuranAudio.isPlaying = false;
                  if (timeUpdateRef.current) {
                    clearInterval(timeUpdateRef.current);
                    timeUpdateRef.current = null;
                  }
                  setAudioState('stopped');
                  setCurrentTime(0);
                };

                QuranAudio.currentAudio.onerror = () => {
                  if (timeUpdateRef.current) {
                    clearInterval(timeUpdateRef.current);
                    timeUpdateRef.current = null;
                  }
                  setAudioState('error');
                };

                await QuranAudio.currentAudio.play();
                QuranAudio.isPlaying = true;
                setAudioState('playing');

                // Double-check duration after play starts (some browsers only have it then)
                if (!audioDuration || audioDuration <= 0) {
                  const dur = QuranAudio.currentAudio.duration;
                  if (dur && isFinite(dur) && dur > 0) {
                    setAudioDuration(dur);
                  }
                }

                // Use faster polling for smoother word highlighting (every 50ms for better sync)
                timeUpdateRef.current = setInterval(() => {
                  if (QuranAudio.currentAudio && !QuranAudio.currentAudio.paused) {
                    setCurrentTime(QuranAudio.currentAudio.currentTime);
                    // Also update duration if it wasn't available before
                    const dur = QuranAudio.currentAudio.duration;
                    if (dur && isFinite(dur) && dur > 0) {
                      setAudioDuration(prev => prev > 0 ? prev : dur);
                    }
                  }
                }, 50);
              }
            } catch (err) {
              console.error('Playback error:', err);
              setAudioState('error');
            }
          }
        }
      };

      // Cleanup interval on unmount
      useEffect(() => {
        return () => {
          if (timeUpdateRef.current) {
            clearInterval(timeUpdateRef.current);
          }
        };
      }, []);

      return (

        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX || e.touches?.[0]?.clientX;
        const y = e.clientY || e.touches?.[0]?.clientY;
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const rotateX = (y - centerY) / 20;
        const rotateY = (centerX - x) / 20;
        setTransform(`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`);
      }, []);

      const handleLeave = useCallback(() => {
        setTransform('');
      }, []);

      return (
        <div
          ref={cardRef}
          className={`tilt-card ${className}`}
          onMouseMove={handleMove}
          onMouseLeave={handleLeave}

        const timer = setInterval(() => {

      const reminder = reminders[currentReminder];

      const [streak, setStreak] = useState(0);
      const [activities, setActivities] = useState({ dua: false, dhikr: false, reflection: false });

      useEffect(() => {
        const stored = localStorage.getItem('asma_streak');
        const lastVisit = localStorage.getItem('asma_last_visit');
        const today = new Date().toDateString();
        const todayActivities = JSON.parse(localStorage.getItem('asma_activities_' + today) || '{}');

        setActivities(todayActivities);

        if (lastVisit === today) {
          setStreak(parseInt(stored) || 1);
        } else {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          if (lastVisit === yesterday.toDateString()) {
            const newStreak = (parseInt(stored) || 0) + 1;
            setStreak(newStreak);
            localStorage.setItem('asma_streak', newStreak);
          } else {
            setStreak(1);
            localStorage.setItem('asma_streak', 1);
          }
          localStorage.setItem('asma_last_visit', today);
        }
      }, []);

      const completedCount = Object.values(activities).filter(Boolean).length;
      const fillPercent = (completedCount / 3) * 100;

      return (
        <div className="flex items-center gap-3 px-4 py-2 rounded-2xl bg-gradient-to-r from-amber-50 to-pink-50 border border-amber-200/50">

      const [swipeOffset, setSwipeOffset] = useState(0);

          type: 'safety',
          icon: 'shield',

          content: "Everything stays on your device — we don't collect anything. There's even a panic button that shows a calculator if you ever need privacy quickly.",
          reassurance: "This is your safe space. No judgment, just love.",
        },

          type: 'ready',
          icon: 'sparkle',
          title: `You're all set, ${name || 'sister'}!`,
          titleArabic: 'ما شاء الله',

          content: "Remember: you can always come back here whenever you need a moment of peace, a reminder, or just some comfort.",

        setTouchEnd(null);
        setTouchStart(e.targetTouches[0].clientX);
        setSwiping(true);

        if (!touchStart) return;
        const currentTouch = e.targetTouches[0].clientX;
        setTouchEnd(currentTouch);
        const diff = currentTouch - touchStart;
        setSwipeOffset(Math.max(-100, Math.min(100, diff * 0.3)));
      };

      const onTouchEnd = () => {
        setSwiping(false);
        setSwipeOffset(0);
        if (!touchStart || !touchEnd) return;
        const distance = touchStart - touchEnd;
        const isLeftSwipe = distance > minSwipeDistance;
        const isRightSwipe = distance < -minSwipeDistance;

        if (isLeftSwipe && step < steps.length - 1) {
          goNext();
        } else if (isRightSwipe && step > 0) {
          goPrev();
        }
      };

      const goNext = () => {
        haptic.medium();
        SoundEffects.slide();
        if (step < steps.length - 1) {
          setStep(s => s + 1);
        } else {
          handleComplete();
        }
      };

      const goPrev = () => {
        haptic.light();
        SoundEffects.slide();
        if (step > 0) {
          setStep(s => s - 1);
        }
      };

        haptic.success();
        SoundEffects.success();
        setShowConfetti(true);

            onboardingComplete: true,

            <div className="absolute top-1/3 right-1/4 w-32 h-32 bg-amber-200/20 rounded-full blur-3xl animate-pulse" style={{animationDelay: '1.5s'}}></div>

            {/* Floating SVG decorations */}
            <div className="absolute top-20 right-16 w-8 h-8 floating-heart" style={{animationDelay: '0s'}}>
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 21C12 21 4 14 4 8.5C4 5.5 6.5 3 9 3C10.5 3 12 4 12 4C12 4 13.5 3 15 3C17.5 3 20 5.5 20 8.5C20 14 12 21 12 21Z" fill="#fbcfe8" stroke="#f9a8d4" strokeWidth="1"/>
              </svg>
            </div>
            <div className="absolute top-40 left-12 w-7 h-7 floating-heart" style={{animationDelay: '0.5s'}}>
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 21C12 21 4 14 4 8.5C4 5.5 6.5 3 9 3C10.5 3 12 4 12 4C12 4 13.5 3 15 3C17.5 3 20 5.5 20 8.5C20 14 12 21 12 21Z" fill="#f9a8d4" stroke="#f472b6" strokeWidth="1"/>
                <path d="M12 19C12 19 6 13 6 8.5C6 6.5 7.5 5 9 5" stroke="white" strokeWidth="1" opacity="0.5" strokeLinecap="round" fill="none"/>
              </svg>

                <ellipse cx="12" cy="6" rx="3" ry="4" fill="#f9a8d4"/>
                <ellipse cx="12" cy="18" rx="3" ry="4" fill="#f9a8d4"/>

    const HadithView = () => {

      const [selected, setSelected] = useState(null);
      const [filter, setFilter] = useState('all');
      const [activeTab, setActiveTab] = useState('curated'); // 'curated' or 'explore'
      const [apiHadiths, setApiHadiths] = useState([]);
      const [loadingApi, setLoadingApi] = useState(false);
      const [selectedCollection, setSelectedCollection] = useState('bukhari');
      const [selectedTopic, setSelectedTopic] = useState('all');
      const [apiPage, setApiPage] = useState(1);

      const topics = ['all', ...new Set(hadithData.map(h => h.topic))];
      const filtered = filter === 'all' ? hadithData : hadithData.filter(h => h.topic === filter);

      // Load hadiths from API (with topic filtering)
      const loadApiHadiths = async (reset = false) => {
        setLoadingApi(true);
        try {
          const cacheKey = `${selectedCollection}_${selectedTopic}_${apiPage}`;
          const cached = HadithAPI.getCachedHadiths(cacheKey);
          if (cached && !reset) {
            setApiHadiths(prev => reset ? cached : [...prev, ...cached]);
          } else {
            // Use curated hadiths if a topic is selected (hand-picked, not keyword matching)
            const newHadiths = selectedTopic !== 'all'
              ? await HadithAPI.getCuratedHadiths(selectedTopic, selectedCollection, 15)
              : await HadithAPI.getRandomHadiths(10, selectedCollection);

            const formatted = newHadiths.map((h, idx) => {
              // Handle both raw API response and already formatted hadiths
              const hadithData = h?.hadiths?.[0] || h;
              return {
                id: `api_${selectedCollection}_${Date.now()}_${idx}`,
                text: hadithData?.text || 'Hadith text not available',
                arabic: hadithData?.arabicText || '',
                source: `${HadithAPI.collections[selectedCollection]?.name || selectedCollection} ${hadithData?.hadithNumber || ''}`,
                grades: hadithData?.grades || [],
                topic: selectedTopic,
                isApi: true,
              };
            }).filter(h => h.text && h.text !== 'Hadith text not available');
            setApiHadiths(prev => reset ? formatted : [...prev, ...formatted]);
            HadithAPI.cacheHadiths(cacheKey, formatted);
          }
        } catch (err) {
          console.error('Failed to load hadiths:', err);
        }
        setLoadingApi(false);
      };

    const DuasView = () => {
      const { updateState, toggleSave, isSaved } = useApp();
      const [expanded, setExpanded] = useState(null);
      const [playingDua, setPlayingDua] = useState(null);
      const [audioState, setAudioState] = useState('stopped');

      const handlePlayDua = async (dua, e) => {
        e.stopPropagation();

      const prayers = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              fetch(`https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=2`)
                .then(res => res.json())
                .then(data => {
                  setTimes(data.data.timings);
                  setLoading(false);
                })
                .catch(() => {
                  setError('Unable to fetch prayer times');
                  setLoading(false);
                });
            },
            () => {
              setError('Please enable location access');
              setLoading(false);
            }
          );
        } else {
          setError('Location not supported');
          setLoading(false);
        }
      }, []);

      // Determine current/next prayer
      const getCurrentPrayer = () => {
        if (!times) return null;
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        for (let i = prayers.length - 1; i >= 0; i--) {
          const [h, m] = times[prayers[i]].split(':').map(Number);
          if (currentMinutes >= h * 60 + m) return prayers[i];
        }
        return prayers[prayers.length - 1];
      };

      const containerRef = useRef(null);

      const beadsRef = useRef([]);
      const animatingRef = useRef(false);
      const [isLoaded, setIsLoaded] = useState(false);

      // Beautiful SVG Fallback Tasbeeh with Fluid Animations
      const SVGTasbeeh = ({ count, target }) => {
        const beadCount = 33;
        const radius = 85;
        const centerX = 120;
        const centerY = 110;
        const currentCount = count % 33 || (count > 0 && count % 33 === 0 ? 33 : 0);

        return (
          <svg viewBox="0 0 240 280" className="w-full h-full tasbeeh-float">
            <defs>
              {/* Pearl gradient with animation */}
              <radialGradient id="pearlGrad" cx="30%" cy="30%">
                <stop offset="0%" stopColor="#ffffff"/>
                <stop offset="50%" stopColor="#fdf2f8"/>
                <stop offset="100%" stopColor="#f9a8d4"/>
              </radialGradient>
              {/* Counted bead gradient */}
              <radialGradient id="countedGrad" cx="30%" cy="30%">
                <stop offset="0%" stopColor="#f9a8d4"/>
                <stop offset="50%" stopColor="#ec4899"/>
                <stop offset="100%" stopColor="#db2777"/>
              </radialGradient>
              {/* Gold gradient */}
              <radialGradient id="goldGrad" cx="30%" cy="30%">
                <stop offset="0%" stopColor="#fef3c7"/>
                <stop offset="50%" stopColor="#fbbf24"/>
                <stop offset="100%" stopColor="#d97706"/>
              </radialGradient>
              {/* Animated shimmer gradient */}
              <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="white" stopOpacity="0">
                  <animate attributeName="offset" values="-0.5;1.5" dur="3s" repeatCount="indefinite"/>
                </stop>
                <stop offset="50%" stopColor="white" stopOpacity="0.6">
                  <animate attributeName="offset" values="0;2" dur="3s" repeatCount="indefinite"/>
                </stop>
                <stop offset="100%" stopColor="white" stopOpacity="0">
                  <animate attributeName="offset" values="0.5;2.5" dur="3s" repeatCount="indefinite"/>
                </stop>
              </linearGradient>
              {/* Glow filter */}
              <filter id="beadGlow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              {/* Soft shadow */}
              <filter id="tasbeehShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#f9a8d4" floodOpacity="0.4"/>
              </filter>
              {/* Pulse glow for active bead */}
              <filter id="activeGlow" x="-150%" y="-150%" width="400%" height="400%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feFlood floodColor="#ec4899" floodOpacity="0.8"/>
                <feComposite in2="blur" operator="in"/>
                <feMerge>
                  <feMergeNode/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            {/* Animated background glow */}
            <circle cx={centerX} cy={centerY} r={radius + 25} fill="url(#countedGrad)" opacity="0.08">
              <animate attributeName="r" values={`${radius + 20};${radius + 30};${radius + 20}`} dur="4s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.08;0.15;0.08" dur="4s" repeatCount="indefinite"/>
            </circle>

            {/* Rotating sparkle ring */}
            <g style={{transformOrigin: `${centerX}px ${centerY}px`}} className="sparkle-rotate">
              {[0, 60, 120, 180, 240, 300].map((deg, i) => {
                const sparkleAngle = (deg * Math.PI) / 180;
                const sx = centerX + Math.cos(sparkleAngle) * (radius + 15);
                const sy = centerY + Math.sin(sparkleAngle) * (radius + 15);
                return (
                  <circle key={i} cx={sx} cy={sy} r="2" fill="white" opacity="0.4">
                    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin={`${i * 0.3}s`} repeatCount="indefinite"/>
                    <animate attributeName="r" values="1;3;1" dur="2s" begin={`${i * 0.3}s`} repeatCount="indefinite"/>
                  </circle>
                );
              })}
            </g>

            {/* String with shimmer */}
            <circle cx={centerX} cy={centerY} r={radius} fill="none" stroke="url(#goldGrad)" strokeWidth="3" filter="url(#tasbeehShadow)"/>
            <circle cx={centerX} cy={centerY} r={radius} fill="none" stroke="url(#shimmerGrad)" strokeWidth="4" opacity="0.5"/>

            {/* Beads with staggered animations */}
            {[...Array(beadCount)].map((_, i) => {
              const angle = (i / beadCount) * Math.PI * 2 - Math.PI / 2;
              const x = centerX + Math.cos(angle) * radius;
              const y = centerY + Math.sin(angle) * radius;
              const isCounted = i < currentCount;
              const isActive = i === currentCount - 1 && currentCount > 0;
              const isGold = i % 11 === 10;
              const baseRadius = 8;
              const delay = i * 0.05;

              return (
                <g key={i} className="bead-group" style={{animationDelay: `${delay}s`}}>
                  {/* Bead shadow */}
                  <circle cx={x + 1} cy={y + 2} r={baseRadius} fill="#00000010"/>

                  {/* Main bead */}
                  <circle
                    cx={x}
                    cy={y}
                    r={baseRadius}
                    fill={isGold ? "url(#goldGrad)" : isCounted ? "url(#countedGrad)" : "url(#pearlGrad)"}
                    filter={isActive ? "url(#activeGlow)" : isCounted ? "url(#beadGlow)" : undefined}
                  >
                    {isCounted && (
                      <animate attributeName="r" values={`${baseRadius};${baseRadius + 2};${baseRadius}`} dur="0.6s" repeatCount={isActive ? "indefinite" : "1"}/>
                    )}
                  </circle>

                  {/* Highlight */}
                  <circle cx={x - 2} cy={y - 2} r={baseRadius * 0.35} fill="white" opacity={isCounted ? "0.8" : "0.5"}>
                    {isCounted && (
                      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.5s" repeatCount="indefinite"/>
                    )}
                  </circle>

                  {/* Secondary highlight for depth */}
                  <circle cx={x + 1} cy={y + 2} r={baseRadius * 0.2} fill="white" opacity="0.2"/>
                </g>
              );
            })}

            {/* Tassel group with sway animation */}
            <g className="tassel-sway">
              {/* Tassel cap */}
              <ellipse cx={centerX} cy={centerY + radius + 12} rx="12" ry="8" fill="url(#goldGrad)"/>
              <rect x={centerX - 10} y={centerY + radius + 8} width="20" height="12" fill="url(#goldGrad)" rx="2"/>

              {/* Cap highlight */}
              <ellipse cx={centerX - 3} cy={centerY + radius + 10} rx="4" ry="2" fill="white" opacity="0.4"/>

              {/* Tassel threads with individual sway */}
              {[...Array(8)].map((_, i) => {
                const baseSpread = (i - 3.5) * 3;
                const swayOffset = (i % 2 === 0) ? 1 : -1;
                return (
                  <g key={i}>
                    <line
                      x1={centerX + baseSpread * 0.3}
                      y1={centerY + radius + 18}
                      x2={centerX + baseSpread}
                      y2={centerY + radius + 55}
                      stroke="url(#countedGrad)"
                      strokeWidth="2.5"
                      strokeLinecap="round"
                      opacity={0.7 + (i % 3) * 0.1}
                    >
                      <animate
                        attributeName="x2"
                        values={`${centerX + baseSpread - swayOffset * 2};${centerX + baseSpread + swayOffset * 2};${centerX + baseSpread - swayOffset * 2}`}
                        dur={`${1.5 + i * 0.1}s`}
                        repeatCount="indefinite"
                      />
                    </line>
                    {/* Thread end bead */}
                    <circle
                      cx={centerX + baseSpread}
                      cy={centerY + radius + 57}
                      r="3.5"
                      fill="url(#countedGrad)"
                    >
                      <animate
                        attributeName="cx"
                        values={`${centerX + baseSpread - swayOffset * 2};${centerX + baseSpread + swayOffset * 2};${centerX + baseSpread - swayOffset * 2}`}
                        dur={`${1.5 + i * 0.1}s`}
                        repeatCount="indefinite"
                      />
                    </circle>
                    {/* End bead highlight */}
                    <circle
                      cx={centerX + baseSpread - 1}
                      cy={centerY + radius + 56}
                      r="1"
                      fill="white"
                      opacity="0.6"
                    >
                      <animate
                        attributeName="cx"
                        values={`${centerX + baseSpread - 1 - swayOffset * 2};${centerX + baseSpread - 1 + swayOffset * 2};${centerX + baseSpread - 1 - swayOffset * 2}`}
                        dur={`${1.5 + i * 0.1}s`}
                        repeatCount="indefinite"
                      />
                    </circle>
                  </g>
                );
              })}
            </g>

            {/* Floating particles */}
            {[...Array(5)].map((_, i) => {
              const px = 40 + i * 40;
              const py = 30 + (i % 3) * 20;
              return (
                <circle key={i} cx={px} cy={py} r="1.5" fill="#f9a8d4" opacity="0.4">
                  <animate attributeName="cy" values={`${py};${py - 15};${py}`} dur={`${3 + i * 0.5}s`} repeatCount="indefinite"/>
                  <animate attributeName="opacity" values="0.2;0.6;0.2" dur={`${3 + i * 0.5}s`} repeatCount="indefinite"/>
                </circle>
              );
            })}
          </svg>
        );
      };

      useEffect(() => {
        if (!containerRef.current || sceneRef.current) return;

        const container = containerRef.current;
        const width = container.clientWidth;
        const height = container.clientHeight;

        // Scene setup
        const scene = new THREE.Scene();
        sceneRef.current = { scene };

        // Camera
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 12);

        // Renderer with better quality
        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: "high-performance"
        });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);
        sceneRef.current.renderer = renderer;
        sceneRef.current.camera = camera;

        // Lighting - beautiful pink-tinted lighting
        const ambientLight = new THREE.AmbientLight(0xfce7f3, 0.4);
        scene.add(ambientLight);

        // Main light
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        // Pink accent light
        const pinkLight = new THREE.PointLight(0xec4899, 0.8, 20);
        pinkLight.position.set(-5, 3, 5);
        scene.add(pinkLight);

        // Rim light for glow effect
        const rimLight = new THREE.PointLight(0xfbbf24, 0.5, 15);
        rimLight.position.set(0, -5, 3);
        scene.add(rimLight);

        // Create beads
        const beadCount = 33;
        const radius = 3.5;
        const beadGeometry = new THREE.SphereGeometry(0.35, 32, 32);

        // Beautiful pearl-like material
        const beadMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xfdf2f8,
          metalness: 0.1,
          roughness: 0.2,
          clearcoat: 1.0,
          clearcoatRoughness: 0.1,
          reflectivity: 0.9,
          envMapIntensity: 1,
        });

        // Accent bead material (gold)
        const accentMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xd4af37,
          metalness: 0.8,
          roughness: 0.2,
          clearcoat: 0.5,
          reflectivity: 1,
        });

        // Counted bead material (pink)
        const countedMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xec4899,
          metalness: 0.3,
          roughness: 0.15,
          clearcoat: 1.0,
          clearcoatRoughness: 0.1,
          reflectivity: 0.9,
          emissive: 0xec4899,
          emissiveIntensity: 0.1,
        });

        const beads = [];
        for (let i = 0; i < beadCount; i++) {
          const angle = (i / beadCount) * Math.PI * 2 - Math.PI / 2;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;

          // Every 11th bead is gold accent
          const material = (i % 11 === 10) ? accentMaterial.clone() : beadMaterial.clone();
          const bead = new THREE.Mesh(beadGeometry, material);
          bead.position.set(x, y, 0);
          bead.castShadow = true;
          bead.receiveShadow = true;
          bead.userData = { index: i, originalMaterial: material, angle };
          scene.add(bead);
          beads.push(bead);
        }
        beadsRef.current = beads;
        sceneRef.current.countedMaterial = countedMaterial;

        // String/thread connecting beads
        const stringGeometry = new THREE.TorusGeometry(radius, 0.03, 8, 64);
        const stringMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xd4af37,
          metalness: 0.9,
          roughness: 0.3,
        });
        const string = new THREE.Mesh(stringGeometry, stringMaterial);
        scene.add(string);

        // Tassel at bottom
        const tasselGroup = new THREE.Group();
        const tasselCapGeometry = new THREE.CylinderGeometry(0.25, 0.35, 0.4, 16);
        const tasselCapMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xd4af37,
          metalness: 0.8,
          roughness: 0.2,
        });
        const tasselCap = new THREE.Mesh(tasselCapGeometry, tasselCapMaterial);
        tasselCap.position.set(0, -radius - 0.5, 0);
        tasselGroup.add(tasselCap);

        // Tassel threads
        for (let i = 0; i < 12; i++) {
          const threadGeometry = new THREE.CylinderGeometry(0.02, 0.015, 1.2, 8);
          const threadMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xec4899,
            roughness: 0.6,
          });
          const thread = new THREE.Mesh(threadGeometry, threadMaterial);
          const angle = (i / 12) * Math.PI * 2;
          const spread = 0.15;
          thread.position.set(
            Math.cos(angle) * spread,
            -radius - 1.3,
            Math.sin(angle) * spread
          );
          thread.rotation.x = Math.cos(angle) * 0.1;
          thread.rotation.z = Math.sin(angle) * 0.1;
          tasselGroup.add(thread);
        }
        scene.add(tasselGroup);
        sceneRef.current.tasselGroup = tasselGroup;

        // Enhanced Fluid Animation System
        let rotationY = 0;
        let targetRotation = 0;
        let swingAngle = 0;
        let swingVelocity = 0;
        let breathScale = 1;

        // Store original bead positions for animation
        beads.forEach((bead, i) => {
          bead.userData.originalY = bead.position.y;
          bead.userData.originalX = bead.position.x;
          bead.userData.phase = i * 0.2; // Staggered phase for wave effect
        });

        const animate = () => {
          requestAnimationFrame(animate);
          const time = Date.now() * 0.001;

          // Smooth rotation with momentum
          rotationY += (targetRotation - rotationY) * 0.06;

          // Gentle pendulum swing
          swingVelocity += (-swingAngle * 0.02); // Spring force
          swingVelocity *= 0.98; // Damping
          swingAngle += swingVelocity;
          swingAngle += Math.sin(time * 0.3) * 0.002; // Subtle continuous motion

          scene.rotation.y = rotationY + swingAngle;
          scene.rotation.z = Math.sin(time * 0.4) * 0.03; // Gentle tilt

          // Breathing/pulsing effect
          breathScale = 1 + Math.sin(time * 0.8) * 0.02;
          scene.scale.setScalar(breathScale);

          // Floating with figure-8 motion
          scene.position.y = Math.sin(time * 0.5) * 0.15;
          scene.position.x = Math.sin(time * 0.3) * 0.05;

          // Individual bead animations - wave ripple effect
          beads.forEach((bead, i) => {
            const phase = bead.userData.phase;

            // Subtle bobbing with wave propagation
            const bobAmount = Math.sin(time * 1.5 + phase) * 0.03;
            const waveX = Math.cos(time * 0.8 + phase) * 0.02;

            bead.position.y = bead.userData.originalY + bobAmount;
            bead.position.x = bead.userData.originalX + waveX;

            // Subtle individual rotation
            bead.rotation.x = Math.sin(time * 2 + phase) * 0.1;
            bead.rotation.y = time * 0.5 + phase;

            // Pulsing scale for counted beads
            if (bead.material.emissive && bead.material.emissiveIntensity > 0) {
              const pulse = 1 + Math.sin(time * 3 + phase) * 0.08;
              bead.scale.setScalar(pulse * 1.15);
              bead.material.emissiveIntensity = 0.1 + Math.sin(time * 2) * 0.05;
            }
          });

          // Dynamic tassel physics
          tasselGroup.children.forEach((child, i) => {
            if (i === 0) {
              // Cap follows main swing
              child.rotation.z = swingAngle * 0.5;
            } else {
              // Threads have individual pendulum motion
              const threadPhase = i * 0.5;
              const swayAmount = 0.15 + Math.sin(time * 0.5) * 0.05;

              // Pendulum swing influenced by main rotation
              child.rotation.x = Math.sin(time * 2.5 + threadPhase) * swayAmount + swingAngle * 2;
              child.rotation.z = Math.cos(time * 2 + threadPhase) * swayAmount * 0.7;

              // Slight position sway
              const originalX = Math.cos((i - 1) / 11 * Math.PI * 2) * 0.15;
              const originalZ = Math.sin((i - 1) / 11 * Math.PI * 2) * 0.15;
              child.position.x = originalX + Math.sin(time * 2 + threadPhase) * 0.03;
              child.position.z = originalZ + Math.cos(time * 1.5 + threadPhase) * 0.02;
            }
          });

          // Animate lights for shimmer effect
          pinkLight.intensity = 0.8 + Math.sin(time * 1.5) * 0.2;
          pinkLight.position.x = -5 + Math.sin(time * 0.7) * 1;
          rimLight.intensity = 0.5 + Math.cos(time * 1.2) * 0.15;

          renderer.render(scene, camera);
        };
        animate();

        // Add interaction response
        sceneRef.current.addSwing = (amount) => {
          swingVelocity += amount;
        };

        sceneRef.current.setTargetRotation = (r) => { targetRotation = r; };

        // Mark as loaded after a small delay to ensure smooth transition
        setTimeout(() => setIsLoaded(true), 100);

        // Handle resize
        const handleResize = () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          container.removeChild(renderer.domElement);
          renderer.dispose();
        };
      }, []);

      // Update beads based on count
      useEffect(() => {
        if (!sceneRef.current) return;
        const { countedMaterial } = sceneRef.current;

        beadsRef.current.forEach((bead, i) => {
          if (i < count) {
            bead.material = countedMaterial.clone();
            bead.scale.setScalar(1.15);
          } else {
            bead.material = bead.userData.originalMaterial;
            bead.scale.setScalar(1);
          }
        });

        // Rotate to show progress
        if (sceneRef.current.setTargetRotation) {
          const progress = count / target;
          sceneRef.current.setTargetRotation(progress * Math.PI * 2);
        }
      }, [count, target]);

      const handleClick = (e) => {
        if (animatingRef.current) return;
        animatingRef.current = true;

        // Add swing momentum based on tap position
        if (sceneRef.current?.addSwing) {
          const rect = e?.currentTarget?.getBoundingClientRect();
          if (rect && e) {
            const tapX = (e.clientX - rect.left) / rect.width - 0.5;
            sceneRef.current.addSwing(tapX * 0.15);
          } else {
            sceneRef.current.addSwing((Math.random() - 0.5) * 0.1);
          }
        }

        // Pulse animation on current bead with ripple effect
        if (count < beadsRef.current.length) {
          const currentBead = beadsRef.current[count];

          // Main bead pop
          currentBead.scale.setScalar(1.6);
          if (currentBead.material.emissive) {
            currentBead.material.emissiveIntensity = 0.4;
          }

          // Ripple to nearby beads
          beadsRef.current.forEach((bead, i) => {
            const distance = Math.abs(i - count);
            if (distance > 0 && distance <= 3) {
              const delay = distance * 50;
              const rippleScale = 1.2 - distance * 0.05;
              setTimeout(() => {
                bead.scale.setScalar(rippleScale);
                setTimeout(() => bead.scale.setScalar(1), 100);
              }, delay);
            }
          });

          setTimeout(() => {
            currentBead.scale.setScalar(1.15);
            if (currentBead.material.emissive) {
              currentBead.material.emissiveIntensity = 0.1;
            }
            animatingRef.current = false;
          }, 200);
        } else {
          animatingRef.current = false;
        }

        onTap();
      };

      return (
        <div
          className="w-full h-72 cursor-pointer rounded-3xl overflow-hidden relative"
          style={{ touchAction: 'manipulation' }}
          onClick={handleClick}
        >
          {/* SVG Fallback - shows immediately */}
          <div
            className={`absolute inset-0 flex items-center justify-center transition-opacity duration-700 ${
              isLoaded ? 'opacity-0 pointer-events-none' : 'opacity-100'
            }`}
          >
            <div className="w-full h-full p-4">
              <SVGTasbeeh count={count} target={target} />
            </div>
            {/* Loading shimmer */}
            {!isLoaded && (
              <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent animate-shimmer" />
            )}
          </div>

          {/* 3D Canvas - fades in when ready */}
          <div
            ref={containerRef}
            className={`absolute inset-0 transition-opacity duration-700 ${
              isLoaded ? 'opacity-100' : 'opacity-0'
            }`}
          />
        </div>
      );
    };

    const DhikrView = () => {
      const { state, updateState } = useApp();
      const [currentDhikr, setCurrentDhikr] = useState(0);
      const [count, setCount] = useState(0);
      const [showComplete, setShowComplete] = useState(false);
      const [showRoundComplete, setShowRoundComplete] = useState(false);

      const dhikr = dhikrList[currentDhikr];

      const handleTap = () => {
        haptic.light();
        if (count < dhikr.target) {
          const newCount = count + 1;
          setCount(newCount);

          // Check for round completion (every 33)
          if (newCount % 33 === 0 && newCount < dhikr.target) {
            haptic.medium();
            setShowRoundComplete(true);
            setTimeout(() => setShowRoundComplete(false), 1000);
          }
        }
        if (count + 1 >= dhikr.target) {
          haptic.success();
          setShowComplete(true);
          setTimeout(() => setShowComplete(false), 2000);
        }
      };

      const handleNext = () => {
        haptic.medium();
        setCurrentDhikr((c) => (c + 1) % dhikrList.length);
        setCount(0);
      };

      const handleReset = () => {
        haptic.light();
        setCount(0);
      };

      return (
        <PageWrapper className="flex flex-col">
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top flex-1 flex flex-col">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-4 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Dhikr Counter</h1>
              <p className="font-ruqaa text-2xl text-pink-400">التسبيح</p>
            </div>

            {/* Dhikr Selector */}
            <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-4 mb-4">
              {dhikrList.map((d, i) => (
                <button
                  key={i}
                  onClick={() => { haptic.light(); setCurrentDhikr(i); setCount(0); }}
                  className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all ${
                    currentDhikr === i
                      ? 'bg-pink-500 text-white shadow-lg shadow-pink-200'
                      : 'bg-white/70 text-pink-600'
                  }`}
                >
                  {d.transliteration}
                </button>
              ))}
            </div>

            {/* Arabic text */}
            <div className="text-center mb-4">
              <p className="font-arabic text-2xl text-pink-700 animate-fade-in">{dhikr.arabic}</p>
              <p className="text-pink-500 text-sm">{dhikr.meaning}</p>
            </div>

            {/* 3D Tasbeeh */}
            <div className="relative flex-1 flex flex-col items-center justify-center">
              {/* Glow effect behind tasbeeh */}
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div className="w-64 h-64 bg-pink-400/20 rounded-full blur-3xl animate-pulse"></div>
              </div>

              <div className="relative w-full max-w-sm">
                <Tasbeeh3D
                  count={count % 33 || (count > 0 && count % 33 === 0 ? 33 : 0)}
                  target={33}
                  onTap={handleTap}
                />

                {/* Count overlay */}
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <div className="text-center">
                    <span className="text-5xl font-bold gradient-text drop-shadow-lg">{count}</span>
                    <span className="text-pink-400 text-lg block">/ {dhikr.target}</span>
                  </div>
                </div>
              </div>

              {/* Round indicator for targets > 33 */}
              {dhikr.target > 33 && (
                <div className="flex items-center justify-center gap-3 mt-4">
                  <div className="flex items-center gap-2 px-4 py-2 rounded-full bg-white/70 backdrop-blur-sm shadow-md">
                    <span className="text-pink-500 text-sm font-medium">Round</span>
                    <span className="text-pink-700 font-bold">{Math.floor(count / 33) + (count % 33 === 0 && count > 0 ? 0 : 1)}</span>
                    <span className="text-pink-400 text-sm">of {Math.ceil(dhikr.target / 33)}</span>
                  </div>
                </div>
              )}

              <p className="text-pink-400 text-sm mt-3 animate-pulse">Tap the tasbeeh to count</p>
            </div>

            {/* Controls */}
            <div className="flex gap-4 justify-center pb-4">
              <button
                onClick={handleReset}
                className="w-14 h-14 rounded-full bg-white/80 backdrop-blur-sm flex items-center justify-center text-pink-500 active:scale-90 transition-transform shadow-lg shadow-pink-200/50"
              >
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </button>
              <button
                onClick={handleNext}
                className="px-8 py-4 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-semibold active:scale-95 transition-transform shadow-xl shadow-pink-300/50"
              >
                Next Dhikr
              </button>
            </div>

            {/* Completion Toast */}
            <Toast message="Completed! MashaAllah!" show={showComplete} />
            <Toast message="Round complete! Keep going..." show={showRoundComplete} />
          </div>
        </PageWrapper>
      );
    };

    // ============================================
    // SAVED VIEW
    // ============================================

    const SavedView = () => {
      const { state, updateState, toggleSave } = useApp();

      return (
        <PageWrapper>
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-8 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Saved Items</h1>
              <p className="font-ruqaa text-2xl text-pink-400">المحفوظات</p>

    const QiblaView = () => {
      const { updateState } = useApp();
      const [qiblaDirection, setQiblaDirection] = useState(null);
      const [deviceHeading, setDeviceHeading] = useState(0);
      const [userLocation, setUserLocation] = useState(null);
      const [error, setError] = useState(null);
      const [permissionState, setPermissionState] = useState('prompt');
      const [distance, setDistance] = useState(null);

      // Kaaba coordinates
      const KAABA_LAT = 21.4225;
      const KAABA_LNG = 39.8262;

      // Calculate bearing to Qibla from user's location
      const calculateQiblaDirection = (lat, lng) => {
        const lat1 = lat * Math.PI / 180;
        const lat2 = KAABA_LAT * Math.PI / 180;
        const deltaLng = (KAABA_LNG - lng) * Math.PI / 180;

        const y = Math.sin(deltaLng) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLng);
        let bearing = Math.atan2(y, x) * 180 / Math.PI;
        bearing = (bearing + 360) % 360;
        return bearing;
      };

      // Calculate distance to Kaaba
      const calculateDistance = (lat, lng) => {
        const R = 6371; // Earth's radius in km
        const lat1 = lat * Math.PI / 180;
        const lat2 = KAABA_LAT * Math.PI / 180;
        const deltaLat = (KAABA_LAT - lat) * Math.PI / 180;
        const deltaLng = (KAABA_LNG - lng) * Math.PI / 180;

        const a = Math.sin(deltaLat/2) * Math.sin(deltaLat/2) +
                  Math.cos(lat1) * Math.cos(lat2) *
                  Math.sin(deltaLng/2) * Math.sin(deltaLng/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return Math.round(R * c);
      };

      // Get user location
      useEffect(() => {
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude } = position.coords;
              setUserLocation({ lat: latitude, lng: longitude });
              setQiblaDirection(calculateQiblaDirection(latitude, longitude));
              setDistance(calculateDistance(latitude, longitude));
            },
            (err) => {
              console.error('Geolocation error:', err);
              // Default to a location for demo purposes
              setUserLocation({ lat: 40.7128, lng: -74.0060 }); // New York
              setQiblaDirection(calculateQiblaDirection(40.7128, -74.0060));
              setDistance(calculateDistance(40.7128, -74.0060));
              setError('Location access needed for accurate Qibla direction');
            }
          );
        } else {
          setError('Geolocation not supported');
        }
      }, []);

      // Handle device orientation
      useEffect(() => {
        const handleOrientation = (event) => {
          let heading;
          if (event.webkitCompassHeading !== undefined) {
            // iOS
            heading = event.webkitCompassHeading;
          } else if (event.alpha !== null) {
            // Android - alpha is compass heading when device is flat
            heading = 360 - event.alpha;
          }
          if (heading !== undefined) {
            setDeviceHeading(heading);
          }
        };

        const requestPermission = async () => {
          if (typeof DeviceOrientationEvent !== 'undefined' &&
              typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
              const response = await DeviceOrientationEvent.requestPermission();
              setPermissionState(response);
              if (response === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, true);
              }
            } catch (err) {
              console.error('Permission error:', err);
            }
          } else {
            // Non-iOS or older devices
            window.addEventListener('deviceorientation', handleOrientation, true);
            setPermissionState('granted');
          }
        };

        requestPermission();

        return () => {
          window.removeEventListener('deviceorientation', handleOrientation, true);
        };
      }, []);

      const needleRotation = qiblaDirection !== null ? qiblaDirection - deviceHeading : 0;

      return (
        <PageWrapper>
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top min-h-screen flex flex-col">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-6 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Qibla Compass</h1>
              <p className="font-ruqaa text-2xl text-pink-400">القِبلة</p>
            </div>

            {/* Main Compass Container */}
            <div className="flex-1 flex flex-col items-center justify-center animate-fade-in-up">
              {/* Compass Outer Ring */}
              <div className="relative">
                {/* Decorative glow */}
                <div className="absolute inset-0 bg-gradient-to-br from-pink-400/30 to-rose-400/30 rounded-full blur-3xl scale-110"></div>

                {/* Compass Background */}
                <div className="relative w-72 h-72 rounded-full bg-gradient-to-br from-white/90 to-pink-50/90 backdrop-blur-xl shadow-2xl shadow-pink-300/50 border-4 border-white/50">
                  {/* Compass Rose - Cardinal Directions */}
                  <div className="absolute inset-4 rounded-full border-2 border-pink-200/50">
                    {/* Cardinal direction markers */}
                    {['N', 'E', 'S', 'W'].map((dir, i) => (
                      <div
                        key={dir}
                        className="absolute w-8 h-8 flex items-center justify-center font-bold text-pink-400"
                        style={{
                          top: i === 0 ? '4px' : i === 2 ? 'auto' : '50%',
                          bottom: i === 2 ? '4px' : 'auto',
                          left: i === 3 ? '4px' : i === 1 ? 'auto' : '50%',
                          right: i === 1 ? '4px' : 'auto',
                          transform: i % 2 === 0 ? 'translateX(-50%)' : 'translateY(-50%)',
                        }}
                      >
                        {dir}
                      </div>
                    ))}

                    {/* Degree markers */}
                    {[...Array(72)].map((_, i) => (
                      <div
                        key={i}
                        className="absolute top-1/2 left-1/2 origin-center"
                        style={{
                          transform: `translate(-50%, -50%) rotate(${i * 5}deg)`,
                          width: '100%',
                          height: '100%'
                        }}
                      >
                        <div
                          className={`absolute top-0 left-1/2 -translate-x-1/2 ${
                            i % 18 === 0 ? 'w-0.5 h-4 bg-pink-400' :
                            i % 6 === 0 ? 'w-0.5 h-3 bg-pink-300' :
                            'w-px h-2 bg-pink-200'
                          }`}
                        />
                      </div>
                    ))}

                    {/* Compass Needle - Points to Qibla */}
                    <div
                      className="absolute inset-0 flex items-center justify-center transition-transform duration-300 ease-out"
                      style={{ transform: `rotate(${needleRotation}deg)` }}
                    >
                      {/* Needle */}
                      <svg className="w-full h-full" viewBox="0 0 200 200">
                        <defs>
                          <linearGradient id="needleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stopColor="#ec4899"/>
                            <stop offset="50%" stopColor="#db2777"/>
                            <stop offset="100%" stopColor="#be185d"/>
                          </linearGradient>
                          <linearGradient id="needleShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stopColor="#fce7f3"/>
                            <stop offset="100%" stopColor="#fbcfe8"/>
                          </linearGradient>
                          <filter id="needleGlow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                              <feMergeNode in="coloredBlur"/>
                              <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                          </filter>
                        </defs>
                        {/* North (Qibla) pointing needle */}
                        <path
                          d="M100 20 L108 100 L100 115 L92 100 Z"
                          fill="url(#needleGradient)"
                          filter="url(#needleGlow)"
                        />
                        {/* South needle */}
                        <path
                          d="M100 180 L108 100 L100 85 L92 100 Z"
                          fill="url(#needleShadow)"
                        />
                        {/* Center circle */}
                        <circle cx="100" cy="100" r="12" fill="url(#needleGradient)" stroke="white" strokeWidth="2"/>
                        {/* Kaaba symbol at tip */}
                        <rect x="94" y="24" width="12" height="12" rx="1" fill="#1f2937"/>
                        <ellipse cx="100" cy="30" rx="3" ry="4" fill="none" stroke="#ffd700" strokeWidth="1"/>
                      </svg>
                    </div>
                  </div>

                  {/* Center overlay */}
                  <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div className="w-6 h-6 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 shadow-lg"></div>
                  </div>
                </div>
              </div>

              {/* Qibla Direction Info */}
              <div className="mt-8 text-center space-y-4 animate-fade-in" style={{ animationDelay: '0.3s' }}>
                <div className="glass-card px-6 py-4 rounded-2xl inline-block">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center">
                      <Icon name="kaaba" className="w-6 h-6 text-white" />

                    <div className="text-left">
                      <p className="text-xs text-pink-500 font-medium">Direction to Kaaba</p>
                      <p className="text-2xl font-bold gradient-text">
                        {qiblaDirection !== null ? `${Math.round(qiblaDirection)}°` : '---°'}
                      </p>
                    </div>
                  </div>
                </div>

                {distance && (
                  <div className="glass-card px-6 py-3 rounded-xl">
                    <p className="text-sm text-pink-600">
                      <span className="font-bold">{distance.toLocaleString()}</span> km to Makkah
                    </p>
                  </div>
                )}

                {error && (
                  <div className="px-4 py-2 bg-amber-50 border border-amber-200 rounded-xl">
                    <p className="text-sm text-amber-700">{error}</p>
                  </div>
                )}

                {permissionState === 'prompt' && (
                  <button
                    onClick={() => {
                      if (typeof DeviceOrientationEvent !== 'undefined' &&

                        DeviceOrientationEvent.requestPermission();

              </div>

              {/* Instructions */}
              <div className="mt-6 text-center text-pink-400 text-sm animate-fade-in" style={{ animationDelay: '0.5s' }}>
                <p>Hold your device flat and rotate</p>
                <p>The needle points to the Qibla</p>
              </div>
            </div>

            {/* Beautiful Kaaba illustration at bottom */}
            <div className="mt-8 text-center animate-fade-in" style={{ animationDelay: '0.6s' }}>

        </PageWrapper>

    };

        { number: 91, name: 'Ash-Shams', arabicName: 'الشمس', verses: 15 },
        { number: 92, name: 'Al-Layl', arabicName: 'الليل', verses: 21 },
        { number: 93, name: 'Ad-Duha', arabicName: 'الضحى', verses: 11 },
        { number: 94, name: 'Ash-Sharh', arabicName: 'الشرح', verses: 8 },
        { number: 95, name: 'At-Tin', arabicName: 'التين', verses: 8 },
        { number: 96, name: 'Al-Alaq', arabicName: 'العلق', verses: 19 },
