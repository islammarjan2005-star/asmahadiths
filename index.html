        { number: 98, name: 'Al-Bayyinah', arabicName: 'البينة', verses: 8 },
        { number: 99, name: 'Az-Zalzalah', arabicName: 'الزلزلة', verses: 8 },
        { number: 100, name: 'Al-Adiyat', arabicName: 'العاديات', verses: 11 },
        { number: 101, name: 'Al-Qariah', arabicName: 'القارعة', verses: 11 },
        { number: 102, name: 'At-Takathur', arabicName: 'التكاثر', verses: 8 },
        { number: 103, name: 'Al-Asr', arabicName: 'العصر', verses: 3 },
        { number: 104, name: 'Al-Humazah', arabicName: 'الهمزة', verses: 9 },
        { number: 105, name: 'Al-Fil', arabicName: 'الفيل', verses: 5 },
        { number: 106, name: 'Quraysh', arabicName: 'قريش', verses: 4 },
        { number: 107, name: 'Al-Maun', arabicName: 'الماعون', verses: 7 },
        { number: 108, name: 'Al-Kawthar', arabicName: 'الكوثر', verses: 3 },
        { number: 109, name: 'Al-Kafirun', arabicName: 'الكافرون', verses: 6 },
        { number: 110, name: 'An-Nasr', arabicName: 'النصر', verses: 3 },
        { number: 111, name: 'Al-Masad', arabicName: 'المسد', verses: 5 },
        { number: 112, name: 'Al-Ikhlas', arabicName: 'الإخلاص', verses: 4 },
        { number: 113, name: 'Al-Falaq', arabicName: 'الفلق', verses: 5 },
        { number: 114, name: 'An-Nas', arabicName: 'الناس', verses: 6 },
      ];

      // Search Quran verses using API
      const searchQuran = async (query) => {
        if (!query.trim()) {
          setSearchResults([]);
          return;
        }

        setIsSearching(true);
        try {
          // Check if it's a surah:verse format (e.g., "2:255" or "2:255-256")
          const verseMatch = query.match(/^(\d+):(\d+)(?:-(\d+))?$/);

          if (verseMatch) {
            const surahNum = parseInt(verseMatch[1]);
            const verseStart = parseInt(verseMatch[2]);
            const verseEnd = verseMatch[3] ? parseInt(verseMatch[3]) : verseStart;

            // Fetch specific verses
            const results = [];
            for (let v = verseStart; v <= Math.min(verseEnd, verseStart + 10); v++) {
              try {
                const response = await fetch(`https://api.alquran.cloud/v1/ayah/${surahNum}:${v}/editions/quran-uthmani,en.sahih`);
                const data = await response.json();
                if (data.code === 200) {
                  const arabicData = data.data[0];
                  const englishData = data.data[1];
                  results.push({
                    id: `${surahNum}:${v}`,
                    surah: arabicData.surah.number,
                    surahName: arabicData.surah.englishName,
                    surahArabicName: arabicData.surah.name,
                    verse: v,
                    arabic: arabicData.text,
                    english: englishData.text,
                    juz: arabicData.juz,
                  });
                }
              } catch (e) {
                console.error('Error fetching verse:', e);
              }
            }
            setSearchResults(results);
          } else {
            // Keyword search
            const response = await fetch(`https://api.alquran.cloud/v1/search/${encodeURIComponent(query)}/all/en.sahih`);
            const data = await response.json();

            if (data.code === 200 && data.data.matches) {
              const results = await Promise.all(
                data.data.matches.slice(0, 15).map(async (match) => {
                  try {
                    const arabicResponse = await fetch(`https://api.alquran.cloud/v1/ayah/${match.surah.number}:${match.numberInSurah}/quran-uthmani`);
                    const arabicData = await arabicResponse.json();
                    return {
                      id: `${match.surah.number}:${match.numberInSurah}`,
                      surah: match.surah.number,
                      surahName: match.surah.englishName,
                      surahArabicName: match.surah.name,
                      verse: match.numberInSurah,
                      arabic: arabicData.code === 200 ? arabicData.data.text : '',
                      english: match.text,
                      juz: match.juz,
                    };
                  } catch (e) {
                    return {
                      id: `${match.surah.number}:${match.numberInSurah}`,
                      surah: match.surah.number,
                      surahName: match.surah.englishName,
                      surahArabicName: match.surah.name,
                      verse: match.numberInSurah,
                      arabic: '',
                      english: match.text,
                      juz: match.juz,
                    };
                  }
                })
              );
              setSearchResults(results);
            } else {
              setSearchResults([]);
            }
          }
        } catch (error) {
          console.error('Search error:', error);
          setSearchResults([]);
        }
        setIsSearching(false);
      };

      // Load a full surah
      const loadSurah = async (surahNumber) => {
        setIsSearching(true);
        setShowSurahBrowser(false);
        setSearchQuery(''); // Clear search query when loading surah
        try {
          const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,en.sahih`);
          const data = await response.json();

          if (data.code === 200) {
            const arabicSurah = data.data[0];
            const englishSurah = data.data[1];

            // Set current surah info for header display
            setCurrentSurah({
              number: surahNumber,
              name: arabicSurah.englishName,
              arabicName: arabicSurah.name,
              totalVerses: arabicSurah.numberOfAyahs,
              revelationType: arabicSurah.revelationType
            });

            const results = arabicSurah.ayahs.map((ayah, idx) => ({
              id: `${surahNumber}:${ayah.numberInSurah}`,
              surah: surahNumber,
              surahName: arabicSurah.englishName,
              surahArabicName: arabicSurah.name,
              verse: ayah.numberInSurah,
              arabic: ayah.text,
              english: englishSurah.ayahs[idx]?.text || '',
              juz: ayah.juz,
            }));
            setSearchResults(results);
          }
        } catch (error) {
          console.error('Error loading surah:', error);
        }
        setIsSearching(false);
      };

      // Go back to Surah list from viewing a surah
      const closeSurahView = () => {
        // Stop any playing audio
        QuranAudio.stop();
        setAudioState('stopped');
        setPlayingVerse(null);

        setCurrentSurah(null);
        setSearchResults([]);
        setSearchQuery('');
      };

      // Play verse audio with auto-play to next verse
      const playVerseAudio = async (surah, verse, totalVerses = null) => {
        // If clicking the same verse that's playing, stop it
        if (audioState === 'playing' && playingVerse && playingVerse.surah === surah && playingVerse.verse === verse) {
          QuranAudio.stop();
          setAudioState('stopped');
          setPlayingVerse(null);
          return;
        }

        // Stop any currently playing audio
        QuranAudio.stop();

        setPlayingVerse({ surah, verse });
        setAudioState('loading');

        try {
          await QuranAudio.playFromReference(`Quran ${surah}:${verse}`, (state) => {
            setAudioState(state);

            // Auto-play next verse when current one ends
            if (state === 'stopped' && totalVerses) {
              const nextVerse = verse + 1;
              if (nextVerse <= totalVerses) {
                // Small delay before playing next verse
                setTimeout(() => {
                  playVerseAudio(surah, nextVerse, totalVerses);
                }, 300);
              } else {
                // End of surah
                setPlayingVerse(null);
              }
            } else if (state === 'stopped') {
              setPlayingVerse(null);
            }
          });
        } catch (error) {
          console.error('Audio error:', error);
          setAudioState('stopped');
          setPlayingVerse(null);
        }
      };

      // Stop all audio playback
      const stopAudio = () => {
        QuranAudio.stop();
        setAudioState('stopped');
        setPlayingVerse(null);
      };

      // Load tafsir for a verse
      const loadTafsir = async (surah, verse, surahName) => {
        setTafsirVerse({ surah, verse, surahName });
        setShowTafsir(true);
        setTafsirLoading(true);
        setTafsirData(null);

        try {
          const data = await TafsirService.getTafsir(surah, verse, selectedTafsirId);
          setTafsirData(data);
        } catch (error) {
          console.error('Tafsir error:', error);
        }
        setTafsirLoading(false);
      };

      // Change tafsir source
      const changeTafsir = async (newTafsirId) => {
        setSelectedTafsirId(newTafsirId);
        if (tafsirVerse) {
          setTafsirLoading(true);
          try {
            const data = await TafsirService.getTafsir(tafsirVerse.surah, tafsirVerse.verse, newTafsirId);
            setTafsirData(data);
          } catch (error) {
            console.error('Tafsir error:', error);
          }
          setTafsirLoading(false);
        }
      };

      // Debounced search
      useEffect(() => {
        const timer = setTimeout(() => {
          if (searchQuery) {
            searchQuran(searchQuery);
          }
        }, 500);
        return () => clearTimeout(timer);
      }, [searchQuery]);

      return (
        <PageWrapper>
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-6 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Search Quran</h1>
              <p className="font-ruqaa text-2xl text-pink-400">البحث في القرآن</p>
            </div>

            {/* Search Input */}
            <div className="mb-6">
              <div className="relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search verses or type 2:255 for Ayatul Kursi..."
                  className="w-full px-5 py-4 pl-12 rounded-2xl glass-card text-pink-700 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all"
                />
                <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-pink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                {isSearching && (
                  <div className="absolute right-4 top-1/2 -translate-y-1/2">
                    <div className="w-5 h-5 border-2 border-pink-300 border-t-pink-600 rounded-full animate-spin"></div>
                  </div>
                )}
              </div>
              <p className="text-xs text-pink-400 mt-2 text-center">
                Try: "mercy", "patience", "2:255", "36:1-10"
              </p>
            </div>

            {/* Surah Browser Modal */}
            {showSurahBrowser && (
              <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center animate-fade-in" onClick={() => setShowSurahBrowser(false)}>
                <div className="bg-white dark:bg-slate-800 w-full max-w-lg rounded-t-3xl max-h-[80vh] overflow-hidden animate-slide-up" onClick={(e) => e.stopPropagation()}>
                  <div className="sticky top-0 bg-white dark:bg-slate-800 p-4 border-b border-pink-100 dark:border-slate-700">
                    <div className="flex items-center justify-between mb-2">
                      <h3 className="text-lg font-bold text-pink-700 dark:text-pink-300">Browse All Surahs</h3>
                      <button onClick={() => setShowSurahBrowser(false)} className="w-8 h-8 rounded-full bg-pink-100 dark:bg-slate-700 flex items-center justify-center">
                        <svg className="w-5 h-5 text-pink-600 dark:text-pink-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                        </svg>
                      </button>
                    </div>
                    <p className="text-xs text-pink-500 dark:text-pink-400">114 Surahs of the Holy Quran</p>
                  </div>
                  <div className="overflow-y-auto max-h-[calc(80vh-80px)] p-4">
                    <div className="grid grid-cols-2 gap-2">
                      {allSurahs.map((surah) => (
                        <button
                          key={surah.number}
                          onClick={() => { haptic.light(); loadSurah(surah.number); }}
                          className="glass-card rounded-xl p-3 text-left active:scale-95 transition-transform"
                        >
                          <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-400 to-pink-600 flex items-center justify-center text-white font-bold text-xs flex-shrink-0">
                              {surah.number}
                            </div>
                            <div className="min-w-0">
                              <p className="font-medium text-pink-700 dark:text-pink-300 text-xs truncate">{surah.name}</p>
                              <p className="font-arabic text-pink-500 dark:text-pink-400 text-[10px]">{surah.arabicName}</p>
                            </div>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Tafsir Modal - Centered */}
            {showTafsir && (
              <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 animate-fade-in" onClick={() => setShowTafsir(false)}>
                <div className="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl max-h-[80vh] overflow-hidden shadow-2xl animate-scale-in" onClick={(e) => e.stopPropagation()}>
                  {/* Header */}
                  <div className="sticky top-0 bg-gradient-to-r from-pink-500 to-pink-600 p-4 text-white">
                    <div className="flex items-center justify-between mb-3">
                      <div>
                        <h3 className="text-lg font-bold">Tafsir</h3>
                        {tafsirVerse && (
                          <p className="text-pink-100 text-sm">{tafsirVerse.surahName} - Verse {tafsirVerse.verse}</p>
                        )}
                      </div>
                      <button onClick={() => setShowTafsir(false)} className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition-colors">
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                        </svg>
                      </button>
                    </div>
                    {/* Tafsir Selector */}
                    <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
                      {TafsirService.getAvailableTafsirs().map((tafsir) => (
                        <button
                          key={tafsir.id}
                          onClick={() => changeTafsir(tafsir.id)}
                          className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${
                            selectedTafsirId === tafsir.id
                              ? 'bg-white text-pink-600'
                              : 'bg-white/20 text-white hover:bg-white/30'
                          }`}
                        >
                          {tafsir.name}
                        </button>
                      ))}
                    </div>
                  </div>
                  {/* Content */}
                  <div className="overflow-y-auto max-h-[calc(80vh-130px)] p-5">
                    {tafsirLoading ? (
                      <div className="flex flex-col items-center justify-center py-12">
                        <div className="w-10 h-10 border-3 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-4"></div>
                        <p className="text-pink-500 text-sm">Loading tafsir...</p>
                      </div>
                    ) : tafsirData ? (
                      <div>
                        <div className="inline-block px-3 py-1 rounded-full bg-pink-100 text-pink-600 text-xs font-medium mb-4">
                          {tafsirData.resourceName}
                        </div>
                        <div
                          className="text-gray-700 dark:text-gray-200 leading-relaxed text-base tafsir-content"
                          style={{ lineHeight: '1.8' }}
                          dangerouslySetInnerHTML={{ __html: tafsirData.text }}
                        />
                      </div>
                    ) : (
                      <div className="text-center py-12">
                        <div className="w-16 h-16 mx-auto mb-4 rounded-full bg-pink-100 flex items-center justify-center">
                          <svg className="w-8 h-8 text-pink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                        </div>
                        <p className="text-pink-600 font-medium">Tafsir not available</p>
                        <p className="text-pink-400 text-sm mt-1">Try selecting a different tafsir source</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Current Surah Header - shown when viewing a surah */}
            {currentSurah && (
              <div className="glass-card rounded-2xl p-4 mb-4 animate-fade-in">
                <div className="flex items-center justify-between">
                  <button onClick={closeSurahView} className="flex items-center gap-2 text-pink-600 hover:text-pink-700">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                    </svg>
                    <span className="text-sm font-medium">All Surahs</span>
                  </button>
                  <div className="flex items-center gap-2">
                    {currentSurah.number > 1 && (
                      <button onClick={() => loadSurah(currentSurah.number - 1)} className="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center text-pink-600">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                        </svg>
                      </button>
                    )}
                    {currentSurah.number < 114 && (
                      <button onClick={() => loadSurah(currentSurah.number + 1)} className="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center text-pink-600">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                        </svg>
                      </button>
                    )}
                  </div>
                </div>
                <div className="text-center mt-3">
                  <div className="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-pink-400 to-pink-600 flex items-center justify-center text-white font-bold text-xl mb-2">
                    {currentSurah.number}
                  </div>
                  <h2 className="text-xl font-bold text-pink-700">{currentSurah.name}</h2>
                  <p className="font-arabic text-2xl text-pink-500">{currentSurah.arabicName}</p>
                  <p className="text-xs text-pink-400 mt-1">{currentSurah.totalVerses} verses • {currentSurah.revelationType}</p>

                  {/* Now Playing Indicator */}
                  {playingVerse && audioState === 'playing' && (
                    <div className="mt-3 flex items-center justify-center gap-2">
                      <div className="flex items-center gap-2 px-4 py-2 rounded-full bg-pink-500 text-white text-sm">
                        <div className="flex gap-0.5">
                          <span className="w-1 h-3 bg-white rounded-full animate-pulse"></span>
                          <span className="w-1 h-4 bg-white rounded-full animate-pulse" style={{ animationDelay: '0.1s' }}></span>
                          <span className="w-1 h-2 bg-white rounded-full animate-pulse" style={{ animationDelay: '0.2s' }}></span>
                        </div>
                        <span>Playing verse {playingVerse.verse}</span>
                        <button
                          onClick={stopAudio}
                          className="ml-1 w-5 h-5 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30"
                        >
                          <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
                            <rect x="6" y="6" width="12" height="12" rx="1"/>
                          </svg>
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Popular Surahs & Browse Button - shown when not viewing a surah */}
            {!searchQuery && !currentSurah && searchResults.length === 0 && (
              <div className="mb-6 animate-fade-in">
                {/* Browse All Button */}
                <button
                  onClick={() => { haptic.light(); setShowSurahBrowser(true); }}
                  className="w-full glass-card rounded-2xl p-4 mb-4 flex items-center justify-between active:scale-[0.98] transition-transform"
                >
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center">
                      <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                      </svg>
                    </div>
                    <div className="text-left">
                      <p className="font-semibold text-pink-700">Browse All 114 Surahs</p>
                      <p className="text-xs text-pink-500">Navigate the complete Quran</p>
                    </div>
                  </div>
                  <svg className="w-5 h-5 text-pink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                  </svg>
                </button>

                <h3 className="text-sm font-semibold text-pink-600 mb-3 uppercase tracking-wide">Popular Surahs</h3>
                <div className="grid grid-cols-2 gap-3">
                  {popularSurahs.map((surah) => (
                    <button
                      key={surah.number}
                      onClick={() => { haptic.light(); loadSurah(surah.number); }}
                      className="glass-card rounded-2xl p-4 text-left active:scale-95 transition-transform"
                    >
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-400 to-pink-600 flex items-center justify-center text-white font-bold text-sm">
                          {surah.number}
                        </div>
                        <div>
                          <p className="font-semibold text-pink-700 text-sm">{surah.name}</p>
                          <p className="font-arabic text-pink-500 text-xs">{surah.arabicName}</p>
                        </div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Search Results */}
            {searchResults.length > 0 && (
              <div className="space-y-4">
                {!currentSurah && <p className="text-sm text-pink-500 mb-2">{searchResults.length} verse(s) found</p>}
                {searchResults.map((result, idx) => (
                  <div
                    key={result.id}
                    className="glass-card rounded-2xl p-5 animate-fade-in-up"
                    style={{ animationDelay: `${idx * 0.05}s` }}
                  >
                    {/* Header */}
                    <div className="flex items-center justify-between mb-4">
                      <div className="flex items-center gap-2">
                        <span className="px-3 py-1 rounded-full bg-pink-100 text-pink-600 text-xs font-medium">

        setConversations(prev => [...prev, userMessage]);
        setQuestion('');

        // Simulate AI thinking
        await new Promise(resolve => setTimeout(resolve, 1500));

        let response = "Thank you for your question, sister. This is a placeholder response. In a full implementation, this would connect to an Islamic knowledge base or AI service that provides accurate, scholarly answers based on Quran and Sunnah.";

                          <div className={`absolute top-0.5 w-6 h-6 rounded-full bg-white shadow-md transition-all ${
                            settings[setting.key] ? 'left-5' : 'left-0.5'
                          }`}></div>
                        </button>
                      ) : (
                        <select
                          value={settings[setting.key]}
                          onChange={(e) => updateSetting(setting.key, e.target.value)}
                          className="px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:ring-2"
                          style={{
                            backgroundColor: 'var(--theme-50)',
                            color: 'var(--theme-600)',
                            borderColor: 'var(--theme-200)',
                            borderWidth: '1px',
                          }}
                        >
                          {setting.options.map(opt => (
                            <option key={opt} value={opt}>{opt.charAt(0).toUpperCase() + opt.slice(1)}</option>
                          ))}
                        </select>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            ))}

            {/* Additional Options */}
            <div className="space-y-3 animate-fade-in" style={{ animationDelay: '0.4s' }}>
              <button
                onClick={() => {
                  haptic.light();
                  // Export data functionality
                  const data = {
                    settings: settings,
                    appState: state,
                    exportedAt: new Date().toISOString()
                  };
                  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = 'asma-backup.json';
                  a.click();
                  URL.revokeObjectURL(url);
                }}
                className="w-full glass-card rounded-2xl p-4 flex items-center justify-between active:scale-98 transition-transform"
              >
                <div className="flex items-center gap-3">
                  <span className="text-xl">📤</span>
                  <span className="text-sm" style={{ color: 'var(--theme-700)' }}>Export Data</span>
                </div>
                <svg className="w-5 h-5" style={{ color: 'var(--theme-400)' }} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                </svg>
              </button>

              <button className="w-full glass-card rounded-2xl p-4 flex items-center justify-between active:scale-98 transition-transform opacity-50 cursor-not-allowed">
                <div className="flex items-center gap-3">
                  <span className="text-xl">🔄</span>
                  <span className="text-sm" style={{ color: 'var(--theme-700)' }}>Sync with Cloud (Coming Soon)</span>
                </div>
                <svg className="w-5 h-5" style={{ color: 'var(--theme-400)' }} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                </svg>
              </button>

              <button className="w-full glass-card rounded-2xl p-4 flex items-center justify-between active:scale-98 transition-transform opacity-50 cursor-not-allowed">
                <div className="flex items-center gap-3">
                  <span className="text-xl">❓</span>
                  <span className="text-sm" style={{ color: 'var(--theme-700)' }}>Help & Support (Coming Soon)</span>
                </div>
                <svg className="w-5 h-5" style={{ color: 'var(--theme-400)' }} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                </svg>
              </button>

              <button className="w-full glass-card rounded-2xl p-4 flex items-center justify-between active:scale-98 transition-transform opacity-50 cursor-not-allowed">
                <div className="flex items-center gap-3">
                  <span className="text-xl">📜</span>
                  <span className="text-sm" style={{ color: 'var(--theme-700)' }}>Privacy Policy (Coming Soon)</span>
                </div>
                <svg className="w-5 h-5" style={{ color: 'var(--theme-400)' }} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                </svg>
              </button>

              <button
                onClick={() => {
                  haptic.medium();
                  if (confirm('Are you sure you want to reset the app? This will delete all your saved data and settings.')) {
                    localStorage.clear();
                    window.location.reload();
                  }
                }}
                className="w-full rounded-2xl p-4 flex items-center justify-center gap-2 bg-red-50 text-red-500 active:scale-98 transition-transform"
              >
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span className="text-sm font-medium">Reset App</span>
              </button>
            </div>

            {/* Version */}
            <div className="mt-8 text-center animate-fade-in" style={{ animationDelay: '0.5s' }}>
              <p className="text-xs" style={{ color: 'var(--theme-400)' }}>Asma v1.0.0</p>
              <p className="text-xs mt-1" style={{ color: 'var(--theme-300)' }}>Made with love for Muslim women</p>
            </div>
          </div>
        </PageWrapper>
      );
    };

    // ============================================
    // BOTTOM NAVIGATION
    // ============================================

    const BottomNav = () => {
      const { state, updateState } = useApp();

      const navItems = [
        { id: 'home', icon: 'home', label: 'Home' },
        { id: 'hadith', icon: 'book', label: 'Hadith' },
        { id: 'dhikr', icon: 'beads', label: 'Dhikr' },
        { id: 'duas', icon: 'hands', label: 'Duas' },
        { id: 'saved', icon: 'heart', label: 'Saved' },
      ];

      return (
        <nav className="bottom-nav">
          <div className="max-w-lg mx-auto flex items-center justify-around py-2">
            {navItems.map((item) => (
              <button
                key={item.id}
                onClick={() => { haptic.light(); updateState({ view: item.id }); }}
                className={`nav-item ${state.view === item.id ? 'active' : ''}`}
              >
                <span className={`nav-icon ${state.view === item.id ? 'scale-110' : ''} transition-transform`}>
                  <Icon name={item.icon} className="w-6 h-6" />
                </span>
                <span className="nav-label">{item.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };

    // ============================================
    // MAIN APP
    // ============================================

    const App = () => {
      const { state } = useApp();
      const [showSplash, setShowSplash] = useState(true);

      // Preload TTS voices on app start for better performance
      React.useEffect(() => {
        if (TextToSpeech.isSupported()) {
          TextToSpeech.loadVoices().then(voices => {
            console.log('TTS voices loaded:', voices.length, 'voices available');
          });
        }
      }, []);

      // Show splash screen on first load only
      if (showSplash && !state.onboardingComplete) {
        return <SplashScreen onComplete={() => setShowSplash(false)} />;
      }

      if (!state.onboardingComplete) {
        return <Onboarding />;
      }

      const renderView = () => {
        switch(state.view) {
          case 'hadith': return <HadithView />;
          case 'duas': return <DuasView />;
          case 'prayer': return <PrayerView />;
          case 'sahabiyat': return <SahabiyatView />;
          case 'dhikr': return <DhikrView />;
          case 'saved': return <SavedView />;
          case 'qibla': return <QiblaView />;
          case 'search': return <QuranSearchView />;
          case 'notifications': return <NotificationsView />;
          case 'ask': return <AskView />;
          case 'settings': return <SettingsView />;
          default: return <HomeScreen />;
        }
      };

      return (
        <>
          {renderView()}
          <BottomNavPremium />
        </>
      );
    };

    // ============================================
    // RENDER
    // ============================================

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
