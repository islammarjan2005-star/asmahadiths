<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ec4899">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asma">
  <meta name="description" content="Your peaceful Islamic companion - daily verses, duas, dhikr, prayer times and more">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ec4899' width='100' height='100' rx='20'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>🌙</text></svg>">
  <title>Asma أسماء - Your Islamic Companion</title>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Three.js for 3D Tasbeeh -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Beautiful Islamic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&family=Lateef:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Default pink theme - darker shades for better contrast with cards */
      --theme-50: #fce7f3;
      --theme-100: #fbcfe8;
      --theme-200: #f9a8d4;
      --theme-300: #f472b6;
      --theme-400: #ec4899;
      --theme-500: #db2777;
      --theme-600: #be185d;
      --theme-700: #9d174d;
      --theme-800: #831843;
      --theme-900: #6b1039;

      /* Static pink for backwards compatibility - also darker */
      --pink-50: #fce7f3;
      --pink-100: #fbcfe8;
      --pink-200: #f9a8d4;
      --pink-300: #f472b6;
      --pink-400: #ec4899;
      --pink-500: #db2777;
      --pink-600: #be185d;
      --pink-700: #9d174d;
      --pink-800: #831843;
      --pink-900: #6b1039;
      --gold: #d4af37;
      --gold-light: #f4e4ba;

      /* Font settings */
      --base-font-size: 16px;
      --arabic-font: 'Scheherazade New', serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      font-size: var(--base-font-size);
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--theme-50) 0%, var(--theme-100) 25%, var(--theme-200) 50%, var(--theme-50) 75%, var(--theme-50) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      color: var(--theme-900);
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Dark Mode */
    body.dark-mode {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #1a1a2e 75%, #1a1a2e 100%);
      color: #f8fafc;
    }

    body.dark-mode .glass-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(71, 85, 105, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    body.dark-mode .glass-card-pink {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(51, 65, 85, 0.8) 100%);
      border: 1px solid rgba(71, 85, 105, 0.5);
    }

    body.dark-mode .feature-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.9) 0%, rgba(51, 65, 85, 0.8) 100%);
      border: 1px solid rgba(71, 85, 105, 0.5);
    }

    body.dark-mode .bottom-nav {
      background: rgba(30, 41, 59, 0.95);
      border-top: 1px solid rgba(71, 85, 105, 0.5);
    }

    body.dark-mode .gradient-text {
      background: linear-gradient(135deg, var(--theme-300), var(--theme-400), var(--theme-500));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.dark-mode input,
    body.dark-mode select,
    body.dark-mode textarea {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(71, 85, 105, 0.5);
      color: #f8fafc;
    }

    body.dark-mode .text-pink-50 { color: var(--theme-300) !important; }
    body.dark-mode .text-pink-100 { color: var(--theme-300) !important; }
    body.dark-mode .text-pink-200 { color: var(--theme-300) !important; }
    body.dark-mode .text-pink-300 { color: var(--theme-400) !important; }
    body.dark-mode .text-pink-400 { color: var(--theme-400) !important; }
    body.dark-mode .text-pink-500 { color: var(--theme-400) !important; }
    body.dark-mode .text-pink-600 { color: var(--theme-400) !important; }
    body.dark-mode .text-pink-700 { color: var(--theme-300) !important; }
    body.dark-mode .text-pink-800 { color: var(--theme-200) !important; }
    body.dark-mode .text-pink-900 { color: var(--theme-100) !important; }

    body.dark-mode .bg-pink-50 { background-color: rgba(51, 65, 85, 0.5) !important; }
    body.dark-mode .bg-pink-100 { background-color: rgba(51, 65, 85, 0.6) !important; }
    body.dark-mode .bg-pink-200 { background-color: rgba(51, 65, 85, 0.7) !important; }

    body.dark-mode .border-pink-100 { border-color: rgba(71, 85, 105, 0.5) !important; }
    body.dark-mode .border-pink-200 { border-color: rgba(71, 85, 105, 0.6) !important; }

    /* Islamic Fonts - dynamic */
    .font-arabic { font-family: var(--arabic-font); }
    .font-ruqaa { font-family: 'Aref Ruqaa', serif; }
    .font-amiri { font-family: 'Amiri', serif; }
    .font-lateef { font-family: 'Lateef', serif; }

    /* Animated Gradient Background */
    .gradient-bg {
      background: linear-gradient(-45deg, #fdf2f8, #fce7f3, #fbcfe8, #fdf2f8, #fff1f2);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 8px 32px rgba(219, 39, 119, 0.1),
        0 2px 8px rgba(219, 39, 119, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .glass-card-pink {
      background: linear-gradient(135deg, rgba(253, 242, 248, 0.9) 0%, rgba(252, 231, 243, 0.8) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow:
        0 8px 32px rgba(219, 39, 119, 0.15),
        0 2px 8px rgba(219, 39, 119, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Feature Cards with Gradient */
    .feature-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(253,242,248,0.8) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 114, 182, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .feature-card:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.2);
    }

    /* Islamic Geometric Pattern Background */
    .islamic-pattern {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23be185d' fill-opacity='1'%3E%3Cpath d='M30 0l30 30-30 30L0 30 30 0zm0 10L10 30l20 20 20-20-20-20z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* Floating Islamic Stars */
    .floating-star {
      position: fixed;
      pointer-events: none;
      opacity: 0.15;
      animation: floatStar 20s ease-in-out infinite;
    }

    @keyframes floatStar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-20px) rotate(90deg); }
      50% { transform: translateY(0) rotate(180deg); }
      75% { transform: translateY(20px) rotate(270deg); }
    }

    /* Crescent Moon */
    .crescent {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      opacity: 0.1;
      pointer-events: none;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(219, 39, 119, 0.3); }
      50% { box-shadow: 0 0 40px rgba(219, 39, 119, 0.5); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out; }
    .animate-scale-in { animation: scaleIn 0.4s ease-out; }
    .animate-slide-in { animation: slideInRight 0.5s ease-out; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-glow { animation: glow 2s ease-in-out infinite; }
    .animate-pulse { animation: pulse 2s ease-in-out infinite; }
    .animate-shimmer { animation: shimmer 2s ease-in-out infinite; }

    /* Staggered animations */
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }

    /* Shimmer effect */
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    /* Touch ripple effect */
    .ripple {
      position: relative;
      overflow: hidden;
    }

    .ripple::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(219, 39, 119, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .ripple:active::after {
      width: 300px;
      height: 300px;
    }

    /* Tafsir content styling */
    .tafsir-content {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .tafsir-content p {
      margin-bottom: 1rem;
    }
    .tafsir-content h1, .tafsir-content h2, .tafsir-content h3, .tafsir-content h4 {
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: #be185d;
    }
    .tafsir-content sup {
      color: #ec4899;
      font-size: 0.7em;
    }
    .tafsir-content a {
      color: #db2777;
      text-decoration: underline;
    }

    /* Button styles */
    .btn-primary {
      background: linear-gradient(135deg, var(--pink-500) 0%, var(--pink-600) 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.4);
    }

    /* Icon containers */
    .icon-container {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: transform 0.3s ease;
    }

    .icon-container:active {
      transform: scale(0.9);
    }

    /* Pink gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--pink-600) 0%, var(--pink-800) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Gold accent text */
    .gold-text {
      color: var(--gold);
      text-shadow: 0 1px 2px rgba(212, 175, 55, 0.3);
    }

    /* Decorative borders */
    .ornate-border {
      border: 2px solid transparent;
      background: linear-gradient(white, white) padding-box,
                  linear-gradient(135deg, var(--pink-300), var(--gold-light), var(--pink-300)) border-box;
    }

    /* Dhikr counter special styles */
    .dhikr-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-100) 0%, var(--pink-200) 100%);
      border: 3px solid var(--pink-300);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 40px rgba(219, 39, 119, 0.2),
        inset 0 2px 10px rgba(255, 255, 255, 0.8);
      transition: all 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .dhikr-circle:active {
      transform: scale(0.95);
      box-shadow:
        0 5px 20px rgba(219, 39, 119, 0.3),
        inset 0 2px 10px rgba(255, 255, 255, 0.8);
    }

    /* Prayer time card */
    .prayer-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(253,242,248,0.9) 100%);
      border-left: 4px solid var(--pink-500);
    }

    .prayer-active {
      background: linear-gradient(135deg, var(--pink-500) 0%, var(--pink-600) 100%);
      color: white;
      border-left-color: var(--gold);
    }

    /* Arabic text styling */
    .arabic-verse {
      font-family: 'Scheherazade New', 'Amiri', serif;
      font-size: 1.75rem;
      line-height: 2.2;
      color: var(--pink-800);
      text-align: right;
      direction: rtl;
    }

    /* Hide scrollbar but allow scroll */
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Safe areas for mobile */
    .safe-top { padding-top: env(safe-area-inset-top, 20px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(244, 114, 182, 0.2);
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px;
      color: #9ca3af;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--pink-600);
    }

    .nav-item.active .nav-icon {
      transform: scale(1.1);
    }

    .nav-icon {
      font-size: 24px;
      transition: transform 0.3s ease;
    }

    .nav-label {
      font-size: 10px;
      margin-top: 4px;
      font-weight: 500;
    }

    /* Swipe indicator */
    .swipe-indicator {
      width: 40px;
      height: 5px;
      background: var(--pink-300);
      border-radius: 3px;
      margin: 8px auto;
    }

    /* Loading spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--pink-200);
      border-top-color: var(--pink-500);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--pink-800);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 200;
      animation: fadeInUp 0.3s ease;
    }

    /* Decorative elements */
    .star-8 {
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    /* ========================================== */
    /* INCREDIBLE UI ENHANCEMENTS                 */
    /* ========================================== */

    /* Floating Particles */
    @keyframes particle-float {
      0%, 100% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-100px) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes particle-float-reverse {
      0%, 100% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% {
        transform: translateY(100vh) rotate(-720deg);
        opacity: 0;
      }
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
    }

    /* Sparkle burst animation */
    @keyframes sparkle-burst {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(180deg); opacity: 0.8; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }

    .sparkle-particle {
      position: absolute;
      animation: sparkle-burst 0.8s ease-out forwards;
    }

    /* Typewriter Effect */
    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: var(--pink-500); }
    }

    .typewriter-text {
      overflow: hidden;
      white-space: nowrap;
      animation: typewriter 2s steps(30) forwards;
    }

    /* 3D Tilt Card */
    .tilt-card {
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.1s ease-out;
    }

    .tilt-card-inner {
      transform-style: preserve-3d;
      transition: transform 0.3s ease-out;
    }

    .tilt-card:active .tilt-card-inner {
      transform: translateZ(20px);
    }

    /* Enhanced Glass with multiple layers */
    .glass-ultra {
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.7) 50%,
        rgba(253, 242, 248, 0.8) 100%);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 25px 50px -12px rgba(219, 39, 119, 0.15),
        0 12px 24px -8px rgba(219, 39, 119, 0.1),
        0 4px 8px -2px rgba(219, 39, 119, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 1),
        inset 0 -1px 0 rgba(244, 114, 182, 0.1);
    }

    /* Progress Ring */
    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring-circle {
      transition: stroke-dashoffset 0.5s ease-out;
    }

    /* Shimmer overlay */
    .shimmer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%
      );
      background-size: 200% 100%;
      animation: shimmer 3s ease-in-out infinite;
      pointer-events: none;
      border-radius: inherit;
    }

    /* Glow pulse for icons */
    @keyframes icon-glow {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.8));
      }
    }

    .icon-glow {
      animation: icon-glow 2s ease-in-out infinite;
    }

    /* Countdown timer animation */
    @keyframes countdown-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .countdown-active {
      animation: countdown-pulse 1s ease-in-out infinite;
    }

    /* Enhanced Arabic calligraphy */
    .arabic-elegant {
      font-family: 'Scheherazade New', 'Amiri', serif;
      text-shadow:
        0 2px 4px rgba(157, 23, 77, 0.1),
        0 0 40px rgba(244, 114, 182, 0.2);
      letter-spacing: 0.05em;
    }

    /* Streak fire animation */
    @keyframes flame-flicker {
      0%, 100% {
        transform: scaleY(1) scaleX(1);
        filter: brightness(1);
      }
      25% {
        transform: scaleY(1.1) scaleX(0.95);
        filter: brightness(1.1);
      }
      50% {
        transform: scaleY(0.95) scaleX(1.05);
        filter: brightness(0.95);
      }
      75% {
        transform: scaleY(1.05) scaleX(0.98);
        filter: brightness(1.05);
      }
    }

    .flame {
      animation: flame-flicker 0.5s ease-in-out infinite;
    }

    /* Carousel animations */
    @keyframes slide-in-right {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slide-out-left {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(-100%); opacity: 0; }
    }

    /* Mood emoji bounce */
    @keyframes emoji-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.1); }
    }

    .mood-emoji:active {
      animation: emoji-bounce 0.3s ease-out;
    }

    /* Geometric pattern animation */
    @keyframes pattern-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .geometric-pattern {
      animation: pattern-rotate 120s linear infinite;
    }

    /* Spring bounce effect */
    @keyframes spring-bounce {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-spring {
      animation: spring-bounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* Page transitions */
    @keyframes page-enter {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes page-exit {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      to {
        opacity: 0;
        transform: translateY(-20px) scale(0.98);
      }
    }

    .page-transition-enter {
      animation: page-enter 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Multi-layered shadow mixin */
    .shadow-multi {
      box-shadow:
        0 1px 2px rgba(219, 39, 119, 0.05),
        0 2px 4px rgba(219, 39, 119, 0.05),
        0 4px 8px rgba(219, 39, 119, 0.05),
        0 8px 16px rgba(219, 39, 119, 0.05),
        0 16px 32px rgba(219, 39, 119, 0.05),
        0 32px 64px rgba(219, 39, 119, 0.1);
    }

    /* Rainbow gradient animation */
    @keyframes rainbow-shift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(30deg); }
    }

    /* Number counter animation */
    @keyframes count-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .count-animate {
      animation: count-up 0.3s ease-out;
    }

    /* Morphing blob background */
    @keyframes blob-morph {
      0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      25% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
      50% { border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%; }
      75% { border-radius: 60% 40% 60% 30% / 70% 30% 50% 60%; }
    }

    .blob {
      animation: blob-morph 8s ease-in-out infinite;
    }

    /* Verse carousel dots */
    .carousel-dot {
      transition: all 0.3s ease;
    }

    .carousel-dot.active {
      width: 24px;
      border-radius: 4px;
    }

    /* Journal entry card */
    .journal-card {
      background: linear-gradient(145deg,
        rgba(255, 255, 255, 0.95) 0%,
        rgba(253, 242, 248, 0.9) 100%);
      border-left: 4px solid var(--pink-400);
    }

    /* Floating action button */
    .fab {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-500) 0%, var(--pink-600) 100%);
      box-shadow:
        0 6px 20px rgba(219, 39, 119, 0.4),
        0 2px 8px rgba(219, 39, 119, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: all 0.3s ease;
    }

    .fab:active {
      transform: scale(0.9);
    }

    /* Notification badge pulse */
    @keyframes badge-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .badge-pulse {
      animation: badge-pulse 2s ease-in-out infinite;
    }

    /* ========================================== */
    /* PREMIUM APP STORE QUALITY ENHANCEMENTS    */
    /* ========================================== */

    /* Dark Mode / Moon Mode Variables */
    .dark-mode {
      --pink-50: #1a1625;
      --pink-100: #2d2640;
      --pink-200: #3d3555;
      --pink-300: #6b5b8a;
      --pink-400: #9b7bc4;
      --pink-500: #b794d4;
      --pink-600: #d4a5e8;
      --pink-700: #e9c5f5;
      --pink-800: #f5e1fc;
      --pink-900: #fdf2ff;
      --gold: #ffd700;
      --gold-light: #fff4cc;
    }

    .dark-mode body,
    .dark-mode .gradient-bg {
      background: linear-gradient(135deg, #1a1625 0%, #2d2640 25%, #3d3555 50%, #2d2640 75%, #1a1625 100%);
    }

    .dark-mode .glass-card,
    .dark-mode .glass-ultra {
      background: linear-gradient(135deg, rgba(45, 38, 64, 0.9) 0%, rgba(61, 53, 85, 0.8) 100%);
      border-color: rgba(155, 123, 196, 0.3);
    }

    .dark-mode .gradient-text {
      background: linear-gradient(135deg, #d4a5e8 0%, #b794d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dark-mode .bottom-nav {
      background: rgba(26, 22, 37, 0.95);
      border-top-color: rgba(155, 123, 196, 0.2);
    }

    /* Enhanced Navigation with Pill */
    .nav-pill {
      position: absolute;
      bottom: 8px;
      height: 4px;
      background: linear-gradient(90deg, #ec4899, #db2777);
      border-radius: 2px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
    }

    .nav-item-premium {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 16px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-item-premium.active {
      color: #db2777;
    }

    .nav-item-premium.active::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 32px;
      background: linear-gradient(180deg, rgba(236, 72, 153, 0.2) 0%, transparent 100%);
      border-radius: 8px 8px 0 0;
    }

    .nav-item-premium .nav-icon-wrapper {
      position: relative;
      padding: 6px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .nav-item-premium.active .nav-icon-wrapper {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2) 0%, rgba(219, 39, 119, 0.1) 100%);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
    }

    /* Floating Action Button Premium */
    .fab-premium {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899 0%, #db2777 50%, #be185d 100%);
      box-shadow:
        0 8px 32px rgba(219, 39, 119, 0.4),
        0 4px 16px rgba(219, 39, 119, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fab-breathe 3s ease-in-out infinite;
    }

    @keyframes fab-breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 8px 32px rgba(219, 39, 119, 0.4),
          0 4px 16px rgba(219, 39, 119, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow:
          0 12px 40px rgba(219, 39, 119, 0.5),
          0 6px 20px rgba(219, 39, 119, 0.4);
      }
    }

    .fab-premium:active {
      transform: scale(0.92);
    }

    .fab-premium::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.4), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .fab-premium:hover::after {
      opacity: 1;
    }

    /* Share Card Styling */
    .share-card-container {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: fadeIn 0.3s ease;
    }

    .share-card {
      width: 320px;
      padding: 32px;
      background: linear-gradient(145deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
      border-radius: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .share-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ec4899, #d4af37, #ec4899);
    }

    .share-card-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 30-30 30L0 30 30 0zm0 10L10 30l20 20 20-20-20-20z' fill='%23be185d'/%3E%3C/svg%3E");
    }

    /* Crescent Moon Fill Animation for Streaks */
    @keyframes crescent-fill {
      0% { clip-path: inset(100% 0 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }

    .crescent-streak {
      position: relative;
      width: 24px;
      height: 24px;
    }

    .crescent-streak-bg {
      position: absolute;
      inset: 0;
      opacity: 0.3;
    }

    .crescent-streak-fill {
      position: absolute;
      inset: 0;
      animation: crescent-fill 2s ease-out forwards;
    }

    /* Mini Reminder Cards */
    .mini-reminder {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(253, 242, 248, 0.8) 100%);
      border-left: 3px solid;
      border-image: linear-gradient(180deg, #ec4899, #d4af37) 1;
      backdrop-filter: blur(10px);
    }

    /* Parallax Container */
    .parallax-header {
      position: relative;
      transform-style: preserve-3d;
    }

    .parallax-bg {
      position: absolute;
      inset: -20%;
      transform: translateZ(-1px) scale(1.2);
      pointer-events: none;
    }

    /* Voice/Audio Button */
    .audio-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.1) 0%, rgba(219, 39, 119, 0.1) 100%);
      border: 1px solid rgba(236, 72, 153, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .audio-btn:active {
      transform: scale(0.9);
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2) 0%, rgba(219, 39, 119, 0.2) 100%);
    }

    .audio-btn.playing {
      animation: audio-pulse 1s ease-in-out infinite;
    }

    @keyframes audio-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(236, 72, 153, 0); }
    }

    /* Bookmark Animation */
    @keyframes bookmark-save {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .bookmark-saved {
      animation: bookmark-save 0.4s ease-out;
    }

    /* Premium Gradient Border */
    .gradient-border {
      position: relative;
    }

    .gradient-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(135deg, #ec4899, #d4af37, #ec4899);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Inner Glow Effect */
    .inner-glow {
      box-shadow:
        inset 0 0 30px rgba(236, 72, 153, 0.1),
        inset 0 0 60px rgba(236, 72, 153, 0.05);
    }

    /* Ripple Effect for Navigation */
    @keyframes nav-ripple {
      0% {
        transform: scale(0);
        opacity: 0.5;
      }
      100% {
        transform: scale(4);
        opacity: 0;
      }
    }

    .nav-ripple {
      position: absolute;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      animation: nav-ripple 0.6s ease-out forwards;
    }

    /* ========================================== */
    /* WARM & INVITING ONBOARDING                */
    /* ========================================== */

    /* Warm gradient backgrounds */
    .warm-gradient {
      background: linear-gradient(135deg,
        #fff5f7 0%,
        #fce7f3 25%,
        #fdf2f8 50%,
        #fff1f2 75%,
        #fffbeb 100%);
    }

    /* Gentle floating hearts */
    @keyframes heart-float {
      0%, 100% {
        transform: translateY(0) rotate(-5deg) scale(1);
        opacity: 0.6;
      }
      50% {
        transform: translateY(-15px) rotate(5deg) scale(1.1);
        opacity: 0.8;
      }
    }

    .floating-heart {
      animation: heart-float 4s ease-in-out infinite;
    }

    /* Warm embrace effect */
    @keyframes warm-embrace {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-warm-embrace {
      animation: warm-embrace 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Gentle pulse glow */
    @keyframes gentle-glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(244, 114, 182, 0.3),
                    0 0 40px rgba(251, 207, 232, 0.2);
      }
      50% {
        box-shadow: 0 0 30px rgba(244, 114, 182, 0.5),
                    0 0 60px rgba(251, 207, 232, 0.3);
      }
    }

    .gentle-glow {
      animation: gentle-glow 3s ease-in-out infinite;
    }

    /* Text reveal animation */
    @keyframes text-reveal {
      0% {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .text-reveal {
      animation: text-reveal 0.8s ease-out forwards;
    }

    .text-reveal-delay-1 { animation-delay: 0.1s; opacity: 0; }
    .text-reveal-delay-2 { animation-delay: 0.2s; opacity: 0; }
    .text-reveal-delay-3 { animation-delay: 0.3s; opacity: 0; }
    .text-reveal-delay-4 { animation-delay: 0.4s; opacity: 0; }

    /* Celebration confetti */
    @keyframes confetti-fall {
      0% {
        transform: translateY(-100%) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s ease-out forwards;
    }

    /* Warm input focus */
    .warm-input:focus {
      border-color: #f9a8d4;
      box-shadow: 0 0 0 4px rgba(249, 168, 212, 0.3),
                  0 4px 20px rgba(244, 114, 182, 0.2);
    }

    /* Hug animation for icon */
    @keyframes gentle-hug {
      0%, 100% {
        transform: scale(1) rotate(0deg);
      }
      25% {
        transform: scale(1.1) rotate(-3deg);
      }
      75% {
        transform: scale(1.1) rotate(3deg);
      }
    }

    .gentle-hug {
      animation: gentle-hug 2s ease-in-out infinite;
    }

    /* Warm button hover */
    .warm-button {
      background: linear-gradient(135deg, #f9a8d4 0%, #f472b6 50%, #ec4899 100%);
      transition: all 0.3s ease;
    }

    .warm-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.4);
    }

    .warm-button:active {
      transform: translateY(0) scale(0.98);
    }

    /* ============================================
       SPLASH SCREEN ANIMATIONS
       ============================================ */

    @keyframes splash-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes splash-scale-in {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes splash-bismillah {
      0% {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes splash-glow {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(236, 72, 153, 0.8));
      }
    }

    @keyframes splash-exit {
      to {
        opacity: 0;
        transform: scale(1.1);
        filter: blur(10px);
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(0);
        opacity: 0.6;
      }
      100% {
        transform: scale(4);
        opacity: 0;
      }
    }

    .splash-bismillah {
      animation: splash-bismillah 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 splash-glow 2s ease-in-out infinite 1.2s;
    }

    .splash-exit {
      animation: splash-exit 0.6s ease-in-out forwards;
    }

    /* ============================================
       ONBOARDING SWIPE & PROGRESS
       ============================================ */

    .onboarding-container {
      touch-action: pan-y;
      overflow: hidden;
    }

    .onboarding-slide {
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.4s ease;
    }

    .onboarding-slide.swiping {
      transition: none;
    }

    /* Progress dots */
    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(236, 72, 153, 0.3);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-dot.active {
      width: 24px;
      border-radius: 4px;
      background: linear-gradient(135deg, #f472b6, #ec4899);
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
    }

    .progress-dot.completed {
      background: #ec4899;
    }

    /* Slide indicators */
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .progress-dot.active {
      animation: dot-pulse 1.5s ease-in-out infinite;
    }

    /* ============================================
       BOOK STYLES - Hadith Page
       ============================================ */

    /* Book container */
    .book-container {
      perspective: 2000px;
      padding: 0;
    }

    /* Book cover/spine */
    .book-cover {
      background: linear-gradient(135deg,
        #8B4513 0%,
        #A0522D 20%,
        #8B4513 40%,
        #6B3E12 60%,
        #8B4513 80%,
        #A0522D 100%);
      border-radius: 8px 20px 20px 8px;
      box-shadow:
        inset -8px 0 15px rgba(0,0,0,0.3),
        inset 2px 0 3px rgba(255,255,255,0.2),
        0 10px 40px rgba(0,0,0,0.3),
        0 0 60px rgba(139, 69, 19, 0.2);
      position: relative;
      overflow: hidden;
    }

    .book-cover::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 30px;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.4) 0%,
        rgba(0,0,0,0.2) 30%,
        rgba(255,255,255,0.1) 50%,
        rgba(0,0,0,0.2) 70%,
        transparent 100%);
    }

    /* Gold embossed decoration on cover */
    .book-emboss {
      background: linear-gradient(135deg, #D4AF37, #FFD700, #D4AF37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5));
    }

    /* Paper page effect */
    .book-page {
      background: linear-gradient(to right,
        #f8f4e8 0%,
        #faf6eb 2%,
        #fcf9f0 10%,
        #fffef8 50%,
        #fcf9f0 90%,
        #f5f1e4 98%,
        #ede8d8 100%);
      border-radius: 4px 16px 16px 4px;
      position: relative;
      box-shadow:
        inset -2px 0 10px rgba(0,0,0,0.05),
        0 4px 20px rgba(0,0,0,0.1),
        2px 2px 5px rgba(0,0,0,0.05);
    }

    /* Paper texture overlay */
    .book-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      border-radius: inherit;
    }

    /* Page curl effect */
    .page-curl {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg,

      // Parse reference string to get surah and ayah numbers
      // Handles: "Ash-Sharh 94:6", "Quran 21:87", "Al-Baqarah 2:152", "Quran 20:25-26"
      parseReference(ref) {
        if (!ref) return null;

        // Try to extract surah number and ayah from various formats
        let surah = null;
        let ayahStart = null;
        let ayahEnd = null;

        // Format: "Quran 21:87" or "Quran 20:25-26"
        const quranMatch = ref.match(/quran\s+(\d+):(\d+)(?:-(\d+))?/i);
        if (quranMatch) {
          surah = parseInt(quranMatch[1]);
          ayahStart = parseInt(quranMatch[2]);
          ayahEnd = quranMatch[3] ? parseInt(quranMatch[3]) : ayahStart;
          return { surah, ayahStart, ayahEnd };
        }

        // Format: "Surah-Name Chapter:Verse" like "Ash-Sharh 94:6" or "Al-Baqarah 2:152"
        const namedMatch = ref.match(/([a-z\-]+)\s+(\d+):(\d+)(?:-(\d+))?/i);
        if (namedMatch) {
          const name = namedMatch[1].toLowerCase();
          surah = this.surahMap[name] || parseInt(namedMatch[2]);
          ayahStart = parseInt(namedMatch[3]);
          ayahEnd = namedMatch[4] ? parseInt(namedMatch[4]) : ayahStart;
          return { surah, ayahStart, ayahEnd };
        }

        // Format: Just "2:152" or "94:6"
        const simpleMatch = ref.match(/(\d+):(\d+)(?:-(\d+))?/);
        if (simpleMatch) {
          surah = parseInt(simpleMatch[1]);
          ayahStart = parseInt(simpleMatch[2]);
          ayahEnd = simpleMatch[3] ? parseInt(simpleMatch[3]) : ayahStart;
          return { surah, ayahStart, ayahEnd };
        }

        return null;
      },

      // Get audio URL for a single ayah
      async getAyahAudio(surah, ayah) {
        try {
          const res = await fetch(`${this.baseUrl}/ayah/${surah}:${ayah}/${this.reciter}`);
          const data = await res.json();
          if (data.code === 200 && data.data?.audio) {
            return data.data.audio;
          }
        } catch (err) {
          console.error('Failed to fetch ayah audio:', err);
        }
        return null;
      },

      // Get audio URLs for a range of ayahs
      async getAyahRangeAudio(surah, ayahStart, ayahEnd) {
        const urls = [];
        for (let i = ayahStart; i <= ayahEnd; i++) {
          const url = await this.getAyahAudio(surah, i);
          if (url) urls.push(url);
        }
        return urls;
      },

      // Play audio from reference string
      async playFromReference(ref, onStateChange = () => {}) {
        const parsed = this.parseReference(ref);
        if (!parsed) {
          console.error('Could not parse reference:', ref);
          return false;
        }

        // Stop any currently playing audio
        this.stop();

        onStateChange('loading');

        try {
          const { surah, ayahStart, ayahEnd } = parsed;

          if (ayahStart === ayahEnd) {
            // Single ayah
            const audioUrl = await this.getAyahAudio(surah, ayahStart);
            if (audioUrl) {
              this.currentAudio = new Audio(audioUrl);
              this.currentAudio.onended = () => {
                this.isPlaying = false;
                onStateChange('stopped');

              this.currentAudio.onerror = () => {
                this.isPlaying = false;
                onStateChange('error');
              };
              await this.currentAudio.play();
              this.isPlaying = true;
              onStateChange('playing');
              return true;

            const audioUrls = await this.getAyahRangeAudio(surah, ayahStart, ayahEnd);
            if (audioUrls.length > 0) {
              await this.playSequence(audioUrls, onStateChange);
              return true;
            }
          }
        } catch (err) {
          console.error('Failed to play audio:', err);

        onStateChange('error');
        return false;

      async playSequence(urls, onStateChange = () => {}) {
        let currentIndex = 0;

        const playNext = () => {
          if (currentIndex >= urls.length) {
            this.isPlaying = false;
            onStateChange('stopped');
            return;
          }

          this.currentAudio = new Audio(urls[currentIndex]);
          this.currentAudio.onended = () => {
            currentIndex++;
            playNext();
          };
          this.currentAudio.onerror = () => {
            currentIndex++;
            playNext();
          };
          this.currentAudio.play();
        };

        this.isPlaying = true;
        onStateChange('playing');
        playNext();

        if (!words || words.length === 0) return [];

        // Simple estimation: divide duration by word count
        // In reality, longer words take more time, but this is a good approximation
        const avgWordDuration = totalDuration / words.length;

        return words.map((word, index) => ({
          ...word,
          startTime: index * avgWordDuration,
          endTime: (index + 1) * avgWordDuration
        }));
      },

      // Get word at current playback time
      getActiveWordIndex(words, currentTime, totalDuration) {
        if (!words || words.length === 0 || !totalDuration) return -1;

        const avgWordDuration = totalDuration / words.length;
        const index = Math.floor(currentTime / avgWordDuration);

        return Math.min(index, words.length - 1);
      },

      // Load and cache voices

        return new Promise((resolve) => {
          const voices = speechSynthesis.getVoices();
          if (voices.length > 0) {
            this.cachedVoices = voices;
            resolve(voices);

            speechSynthesis.onvoiceschanged = () => {

      // Get best available voice for a language
      getVoice(lang = 'en') {
        const voices = this.cachedVoices.length > 0 ? this.cachedVoices : speechSynthesis.getVoices();

        if (lang === 'ar') {
          // Prefer Arabic voices
          const arabicVoices = voices.filter(v => v.lang.startsWith('ar'));
          if (arabicVoices.length > 0) {
            // Prefer female Arabic voices
            const female = arabicVoices.find(v =>
              v.name.toLowerCase().includes('female') ||
              v.name.includes('Laila') ||
              v.name.includes('Maged') ||
              v.name.includes('Majed')
            );
            return female || arabicVoices[0];
          }
          return null;
        }

        // English voices - prioritize natural/premium voices
        // These are ranked by naturalness based on testing
        const premiumVoices = [
          // iOS/macOS premium voices (very natural)
          'Samantha (Enhanced)', 'Samantha (Premium)', 'Samantha',
          'Ava (Enhanced)', 'Ava (Premium)', 'Ava',
          'Allison (Enhanced)', 'Allison',

          // Google premium voices

          // Android voices
          'English United States',
          'en-US-Wavenet-F',
          'en-US-Neural2-F',
          // Fallback good voices
          'Karen', 'Victoria', 'Fiona', 'Moira',
          'Tessa', 'Veena'
        ];

        // Try to find premium/enhanced voices first
        for (const name of premiumVoices) {
          const voice = voices.find(v => v.name.includes(name));
          if (voice) return voice;
        }

        // Look for any "enhanced", "natural", or "neural" voice
        const enhancedVoice = voices.find(v =>
          v.lang.startsWith('en') && (
            v.name.toLowerCase().includes('enhanced') ||
            v.name.toLowerCase().includes('natural') ||
            v.name.toLowerCase().includes('neural') ||
            v.name.toLowerCase().includes('premium') ||
            v.name.toLowerCase().includes('wavenet')
          )
        );
        if (enhancedVoice) return enhancedVoice;

        // Prefer female English voices (generally sound better for this content)
        const femaleVoice = voices.find(v =>
          v.lang.startsWith('en') && (
            v.name.toLowerCase().includes('female') ||
            v.name.toLowerCase().includes('woman')
          )
        );
        if (femaleVoice) return femaleVoice;

        // Any English voice
        return voices.find(v => v.lang.startsWith('en')) || voices[0];

        if (!this.isSupported()) {

        // Stop any current speech

        this.utterance = new SpeechSynthesisUtterance(text);
        this.utterance.lang = lang === 'ar' ? 'ar-SA' : 'en-US';

        // Optimized settings for more natural speech
        if (lang === 'ar') {
          this.utterance.rate = 0.85;  // Slightly slower for Arabic
          this.utterance.pitch = 1.0;
        } else {
          this.utterance.rate = 0.92;  // Slightly slower than default for clarity
          this.utterance.pitch = 1.02; // Tiny pitch increase for warmth
          this.utterance.volume = 1.0;
        }

        // Set voice
        const setVoiceAndSpeak = () => {
          const voice = this.getVoice(lang);
          if (voice) {
            this.utterance.voice = voice;
            // Log which voice is being used (for debugging)

          speechSynthesis.speak(this.utterance);

        if (this.cachedVoices.length > 0 || speechSynthesis.getVoices().length > 0) {

          onStateChange('speaking');

        try {
          const ctx = this.init();
          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(ctx.destination);

          oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);
          oscillator.type = 'sine';

          // Soft envelope
          gainNode.gain.setValueAtTime(0, ctx.currentTime);
          gainNode.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

          oscillator.start(ctx.currentTime);
          oscillator.stop(ctx.currentTime + duration);
        } catch (e) {
          console.log('Sound not available');
        }

          const ctx = this.init();
          const oscillator = ctx.createOscillator();

          oscillator.connect(filter);
          filter.connect(gainNode);
          gainNode.connect(ctx.destination);

          oscillator.type = 'sawtooth';
          oscillator.frequency.setValueAtTime(150, ctx.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.2);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1000, ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);

          gainNode.gain.setValueAtTime(0.08, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);

      // Fetch curated hadiths for a topic
      async getCuratedHadiths(topic, collection = 'bukhari', limit = 15) {
        const topicData = this.curatedHadiths[topic];
        if (!topicData) return [];

        const hadithNumbers = topicData[collection] || [];
        if (hadithNumbers.length === 0) {
          // Try to find any collection with hadiths for this topic
          for (const [col, numbers] of Object.entries(topicData)) {
            if (numbers.length > 0) {
              collection = col;
              break;
            }
          }
        }

        const numbers = topicData[collection] || [];
        const shuffled = [...numbers].sort(() => Math.random() - 0.5).slice(0, limit);

        const promises = shuffled.map(num => this.getHadith(collection, num));
        const results = await Promise.all(promises);
        return results.filter(h => h !== null);
      },

      // Get all curated hadith numbers for a topic across all collections
      getCuratedCount(topic) {
        const topicData = this.curatedHadiths[topic];
        if (!topicData) return 0;
        return Object.values(topicData).reduce((sum, arr) => sum + arr.length, 0);
      },

      // Fetch a specific hadith
      async getHadith(collection, number) {
        try {
          const key = this.collections[collection]?.key || collection;
          const res = await fetch(`${this.baseUrl}/editions/${key}/${number}.json`);
          if (!res.ok) throw new Error('Hadith not found');
          return await res.json();
        } catch (err) {
          console.error('Failed to fetch hadith:', err);
          return null;
        }
      },

      // Fetch random hadith from a collection
      async getRandomHadith(collection = 'bukhari') {
        const col = this.collections[collection];
        if (!col) return null;
        const randomNum = Math.floor(Math.random() * col.total) + 1;
        return this.getHadith(collection, randomNum);
      },

      // Fetch multiple random hadiths
      async getRandomHadiths(count = 10, collection = 'bukhari') {
        const promises = [];
        const col = this.collections[collection];
        if (!col) return [];

        const usedNums = new Set();
        while (promises.length < count) {
          const num = Math.floor(Math.random() * col.total) + 1;
          if (!usedNums.has(num)) {
            usedNums.add(num);
            promises.push(this.getHadith(collection, num));
          }
        }
        const results = await Promise.all(promises);
        return results.filter(h => h !== null);
      },

      // Fetch hadiths by topic (searches for keywords)
      async getHadithsByTopic(topic, collection = 'bukhari', batchSize = 50) {
        const topicData = this.womenTopics[topic];
        if (!topicData || topicData.keywords.length === 0) {
          return this.getRandomHadiths(10, collection);
        }

        // Check cache first
        const cacheKey = `topic_${topic}_${collection}`;
        const cached = this.getCachedHadiths(cacheKey);
        if (cached && cached.length > 0) return cached;

        // Fetch a larger batch and filter
        const allHadiths = [];
        const col = this.collections[collection];
        const batches = 3; // Fetch 3 batches of 50 to search through

        for (let b = 0; b < batches; b++) {
          const batch = await this.getRandomHadiths(batchSize, collection);
          allHadiths.push(...batch);
        }

        // Filter by keywords
        const keywords = topicData.keywords.map(k => k.toLowerCase());
        const filtered = allHadiths.filter(h => {
          const text = (h?.hadiths?.[0]?.text || '').toLowerCase();
          return keywords.some(kw => text.includes(kw));
        });

        // Cache results
        if (filtered.length > 0) {
          this.cacheHadiths(cacheKey, filtered.slice(0, 20));
        }

        return filtered.length > 0 ? filtered : allHadiths.slice(0, 10);
      },

      // Fetch a range of hadiths
      async getHadithRange(collection, start, end) {
        const promises = [];
        for (let i = start; i <= end; i++) {
          promises.push(this.getHadith(collection, i));
        }
        const results = await Promise.all(promises);
        return results.filter(h => h !== null);
      },

      // Search hadiths by custom query
      async searchHadiths(collection, query, limit = 20) {
        const hadiths = await this.getRandomHadiths(100, collection);
        const lowerQuery = query.toLowerCase();
        return hadiths
          .filter(h => h?.hadiths?.[0]?.text?.toLowerCase().includes(lowerQuery))
          .slice(0, limit);
      },

      // Cache hadiths locally
      cacheHadiths(key, hadiths) {
        try {
          localStorage.setItem(`hadith_cache_${key}`, JSON.stringify({
            timestamp: Date.now(),
            data: hadiths
          }));
        } catch (e) {
          console.warn('Failed to cache hadiths:', e);
        }
      },

      // Get cached hadiths (valid for 24 hours)
      getCachedHadiths(key) {
        try {
          const cached = localStorage.getItem(`hadith_cache_${key}`);
          if (!cached) return null;
          const { timestamp, data } = JSON.parse(cached);
          const isValid = Date.now() - timestamp < 24 * 60 * 60 * 1000;
          return isValid ? data : null;
        } catch (e) {
          return null;
        }
      }
    };

      { id: 20, theme: 'tawakkul', icon: 'shield', arabic: 'وَمَا النَّصْرُ إِلَّا مِنْ عِندِ اللَّهِ', translation: 'And victory is not except from Allah.', reference: 'Al-Anfal 8:10' },
      { id: 21, theme: 'tawakkul', icon: 'shield', arabic: 'إِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ', translation: 'Indeed, Allah does not allow to be lost the reward of those who do good.', reference: 'At-Tawbah 9:120' },
      { id: 22, theme: 'tawakkul', icon: 'shield', arabic: 'وَاللَّهُ يُحِبُّ الْمُتَوَكِّلِينَ', translation: 'And Allah loves those who rely upon Him.', reference: 'Al-Imran 3:159' },
      { id: 23, theme: 'tawakkul', icon: 'shield', arabic: 'أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ', translation: 'Is not Allah sufficient for His servant?', reference: 'Az-Zumar 39:36' },
      { id: 24, theme: 'tawakkul', icon: 'shield', arabic: 'وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ', translation: 'And upon Allah let the believers rely.', reference: 'Al-Imran 3:122' },
      { id: 25, theme: 'tawakkul', icon: 'shield', arabic: 'إِنَّ رَبِّي عَلَىٰ كُلِّ شَيْءٍ حَفِيظٌ', translation: 'Indeed, my Lord is Guardian over all things.', reference: 'Hud 11:57' },
      { id: 26, theme: 'tawakkul', icon: 'shield', arabic: 'وَكَفَىٰ بِاللَّهِ وَكِيلًا', translation: 'And sufficient is Allah as Disposer of affairs.', reference: 'An-Nisa 4:81' },
      { id: 27, theme: 'tawakkul', icon: 'shield', arabic: 'وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا', translation: 'And whoever fears Allah - He will make for him a way out.', reference: 'At-Talaq 65:2' },
      { id: 28, theme: 'tawakkul', icon: 'shield', arabic: 'وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ', translation: 'And will provide for him from where he does not expect.', reference: 'At-Talaq 65:3' },
      { id: 29, theme: 'tawakkul', icon: 'shield', arabic: 'إِنَّ اللَّهَ بَالِغُ أَمْرِهِ', translation: 'Indeed, Allah will accomplish His purpose.', reference: 'At-Talaq 65:3' },
      { id: 30, theme: 'tawakkul', icon: 'shield', arabic: 'قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا', translation: 'Allah has already set for everything a decreed extent.', reference: 'At-Talaq 65:3' },

      // === FORGIVENESS & MERCY (31-45) ===
      { id: 31, theme: 'mercy', icon: 'sparkle', arabic: 'لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ', translation: 'Do not despair of the mercy of Allah.', reference: 'Az-Zumar 39:53' },
      { id: 32, theme: 'mercy', icon: 'sparkle', arabic: 'إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا', translation: 'Indeed, Allah forgives all sins.', reference: 'Az-Zumar 39:53' },
      { id: 33, theme: 'mercy', icon: 'sparkle', arabic: 'وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ', translation: 'And My mercy encompasses all things.', reference: 'Al-Araf 7:156' },
      { id: 34, theme: 'mercy', icon: 'sparkle', arabic: 'إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ', translation: 'Indeed, it is He who is the Forgiving, the Merciful.', reference: 'Az-Zumar 39:53' },
      { id: 35, theme: 'mercy', icon: 'sparkle', arabic: 'وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ', translation: 'And it is He who accepts repentance from His servants.', reference: 'Ash-Shura 42:25' },
      { id: 36, theme: 'mercy', icon: 'sparkle', arabic: 'غَافِرِ الذَّنبِ وَقَابِلِ التَّوْبِ', translation: 'The Forgiver of sin, Acceptor of repentance.', reference: 'Ghafir 40:3' },
      { id: 37, theme: 'mercy', icon: 'sparkle', arabic: 'وَاللَّهُ غَفُورٌ رَّحِيمٌ', translation: 'And Allah is Forgiving and Merciful.', reference: 'Al-Baqarah 2:173' },
      { id: 38, theme: 'mercy', icon: 'sparkle', arabic: 'إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ', translation: 'Indeed, Allah loves those who are constantly repentant.', reference: 'Al-Baqarah 2:222' },
      { id: 39, theme: 'mercy', icon: 'sparkle', arabic: 'وَيُحِبُّ الْمُتَطَهِّرِينَ', translation: 'And loves those who purify themselves.', reference: 'Al-Baqarah 2:222' },
      { id: 40, theme: 'mercy', icon: 'sparkle', arabic: 'نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ', translation: 'Inform My servants that it is I who am the Forgiving, the Merciful.', reference: 'Al-Hijr 15:49' },
      { id: 41, theme: 'mercy', icon: 'sparkle', arabic: 'كَتَبَ رَبُّكُمْ عَلَىٰ نَفْسِهِ الرَّحْمَةَ', translation: 'Your Lord has decreed upon Himself mercy.', reference: 'Al-Anam 6:54' },
      { id: 42, theme: 'mercy', icon: 'sparkle', arabic: 'فَإِنَّ رَبَّكُمْ غَفُورٌ رَّحِيمٌ', translation: 'Indeed, your Lord is Forgiving and Merciful.', reference: 'Al-Anam 6:54' },
      { id: 43, theme: 'mercy', icon: 'sparkle', arabic: 'وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ', translation: 'And ask forgiveness of your Lord and then repent to Him.', reference: 'Hud 11:3' },
      { id: 44, theme: 'mercy', icon: 'sparkle', arabic: 'إِنَّ رَبِّي رَحِيمٌ وَدُودٌ', translation: 'Indeed, my Lord is Merciful and Loving.', reference: 'Hud 11:90' },
      { id: 45, theme: 'mercy', icon: 'sparkle', arabic: 'وَاسْتَغْفِرُوا اللَّهَ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ', translation: 'And seek forgiveness of Allah. Indeed, Allah is Forgiving and Merciful.', reference: 'Al-Muzzammil 73:20' },

      // === PATIENCE & PERSEVERANCE (46-60) ===
      { id: 46, theme: 'sabr', icon: 'moon', arabic: 'يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ', translation: 'O you who believe, seek help through patience and prayer.', reference: 'Al-Baqarah 2:153' },
      { id: 47, theme: 'sabr', icon: 'moon', arabic: 'وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ', translation: 'And be patient, and your patience is not but through Allah.', reference: 'An-Nahl 16:127' },
      { id: 48, theme: 'sabr', icon: 'moon', arabic: 'إِنَّمَا يُوَفَّى الصَّابِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٍ', translation: 'Indeed, the patient will be given their reward without account.', reference: 'Az-Zumar 39:10' },
      { id: 49, theme: 'sabr', icon: 'moon', arabic: 'وَبَشِّرِ الصَّابِرِينَ', translation: 'And give good tidings to the patient.', reference: 'Al-Baqarah 2:155' },
      { id: 50, theme: 'sabr', icon: 'moon', arabic: 'فَاصْبِرْ صَبْرًا جَمِيلًا', translation: 'So be patient with gracious patience.', reference: 'Al-Maarij 70:5' },
      { id: 51, theme: 'sabr', icon: 'moon', arabic: 'فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ', translation: 'So be patient. Indeed, the promise of Allah is truth.', reference: 'Ar-Rum 30:60' },
      { id: 52, theme: 'sabr', icon: 'moon', arabic: 'الَّذِينَ إِذَا أَصَابَتْهُم مُّصِيبَةٌ قَالُوا إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ', translation: 'Who, when disaster strikes them, say, "Indeed we belong to Allah, and indeed to Him we will return."', reference: 'Al-Baqarah 2:156' },
      { id: 53, theme: 'sabr', icon: 'moon', arabic: 'أُولَٰئِكَ عَلَيْهِمْ صَلَوَاتٌ مِّن رَّبِّهِمْ وَرَحْمَةٌ', translation: 'Those are the ones upon whom are blessings from their Lord and mercy.', reference: 'Al-Baqarah 2:157' },
      { id: 54, theme: 'sabr', icon: 'moon', arabic: 'وَأُولَٰئِكَ هُمُ الْمُهْتَدُونَ', translation: 'And it is those who are the rightly guided.', reference: 'Al-Baqarah 2:157' },
      { id: 55, theme: 'sabr', icon: 'moon', arabic: 'وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ', translation: 'And be patient, for indeed, Allah does not allow to be lost the reward of those who do good.', reference: 'Hud 11:115' },
      { id: 56, theme: 'sabr', icon: 'moon', arabic: 'وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا', translation: 'And be patient for the decision of your Lord, for indeed, you are in Our eyes.', reference: 'At-Tur 52:48' },
      { id: 57, theme: 'sabr', icon: 'moon', arabic: 'وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا أَجْرَهُم بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ', translation: 'And We will surely give those who were patient their reward according to the best of what they used to do.', reference: 'An-Nahl 16:96' },
      { id: 58, theme: 'sabr', icon: 'moon', arabic: 'وَاللَّهُ مَعَ الصَّابِرِينَ', translation: 'And Allah is with the patient.', reference: 'Al-Baqarah 2:249' },
      { id: 59, theme: 'sabr', icon: 'moon', arabic: 'إِنَّ اللَّهَ يُحِبُّ الصَّابِرِينَ', translation: 'Indeed, Allah loves the steadfast.', reference: 'Al-Imran 3:146' },
      { id: 60, theme: 'sabr', icon: 'moon', arabic: 'وَلَنَبْلُوَنَّكُم حَتَّىٰ نَعْلَمَ الْمُجَاهِدِينَ مِنكُمْ وَالصَّابِرِينَ', translation: 'And We will surely test you until We make evident those who strive among you and the patient.', reference: 'Muhammad 47:31' },

      // === DUA & SUPPLICATION (61-75) ===
      { id: 61, theme: 'dua', icon: 'hands', arabic: 'ادْعُونِي أَسْتَجِبْ لَكُمْ', translation: 'Call upon Me; I will respond to you.', reference: 'Ghafir 40:60' },
      { id: 62, theme: 'dua', icon: 'hands', arabic: 'وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ', translation: 'And when My servants ask you about Me - indeed I am near.', reference: 'Al-Baqarah 2:186' },
      { id: 63, theme: 'dua', icon: 'hands', arabic: 'أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ', translation: 'I respond to the invocation of the supplicant when he calls upon Me.', reference: 'Al-Baqarah 2:186' },
      { id: 64, theme: 'dua', icon: 'hands', arabic: 'رَبِّ اشْرَحْ لِي صَدْرِي', translation: 'My Lord, expand for me my chest.', reference: 'Ta-Ha 20:25' },
      { id: 65, theme: 'dua', icon: 'hands', arabic: 'وَيَسِّرْ لِي أَمْرِي', translation: 'And ease for me my task.', reference: 'Ta-Ha 20:26' },
      { id: 66, theme: 'dua', icon: 'hands', arabic: 'رَبِّ زِدْنِي عِلْمًا', translation: 'My Lord, increase me in knowledge.', reference: 'Ta-Ha 20:114' },
      { id: 67, theme: 'dua', icon: 'hands', arabic: 'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً', translation: 'Our Lord, give us in this world good and in the Hereafter good.', reference: 'Al-Baqarah 2:201' },
      { id: 68, theme: 'dua', icon: 'hands', arabic: 'وَقِنَا عَذَابَ النَّارِ', translation: 'And protect us from the punishment of the Fire.', reference: 'Al-Baqarah 2:201' },
      { id: 69, theme: 'dua', icon: 'hands', arabic: 'رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا', translation: 'Our Lord, do not impose blame upon us if we forget or make a mistake.', reference: 'Al-Baqarah 2:286' },
      { id: 70, theme: 'dua', icon: 'hands', arabic: 'رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا', translation: 'Our Lord, and lay not upon us a burden like that which You laid upon those before us.', reference: 'Al-Baqarah 2:286' },
      { id: 71, theme: 'dua', icon: 'hands', arabic: 'رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ', translation: 'Our Lord, and burden us not with that which we have no ability to bear.', reference: 'Al-Baqarah 2:286' },
      { id: 72, theme: 'dua', icon: 'hands', arabic: 'وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا', translation: 'And pardon us; and forgive us; and have mercy upon us.', reference: 'Al-Baqarah 2:286' },
      { id: 73, theme: 'dua', icon: 'hands', arabic: 'أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ', translation: 'You are our protector, so give us victory over the disbelieving people.', reference: 'Al-Baqarah 2:286' },
      { id: 74, theme: 'dua', icon: 'hands', arabic: 'رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ', translation: 'Our Lord, grant us from among our wives and offspring comfort to our eyes.', reference: 'Al-Furqan 25:74' },
      { id: 75, theme: 'dua', icon: 'hands', arabic: 'وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا', translation: 'And make us an example for the righteous.', reference: 'Al-Furqan 25:74' },

      // === GRATITUDE (76-90) ===
      { id: 76, theme: 'shukr', icon: 'star', arabic: 'لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ', translation: 'If you are grateful, I will surely increase you.', reference: 'Ibrahim 14:7' },
      { id: 77, theme: 'shukr', icon: 'star', arabic: 'فَاذْكُرُونِي أَذْكُرْكُمْ', translation: 'So remember Me; I will remember you.', reference: 'Al-Baqarah 2:152' },
      { id: 78, theme: 'shukr', icon: 'star', arabic: 'وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ', translation: 'And be grateful to Me and do not deny Me.', reference: 'Al-Baqarah 2:152' },
      { id: 79, theme: 'shukr', icon: 'star', arabic: 'وَمَن شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ', translation: 'And whoever is grateful is grateful for the benefit of himself.', reference: 'Luqman 31:12' },
      { id: 80, theme: 'shukr', icon: 'star', arabic: 'اعْمَلُوا آلَ دَاوُودَ شُكْرًا', translation: 'Work, O family of David, in gratitude.', reference: 'Saba 34:13' },
      { id: 81, theme: 'shukr', icon: 'star', arabic: 'وَقَلِيلٌ مِّنْ عِبَادِيَ الشَّكُورُ', translation: 'And few of My servants are grateful.', reference: 'Saba 34:13' },
      { id: 82, theme: 'shukr', icon: 'star', arabic: 'بَلِ اللَّهَ فَاعْبُدْ وَكُن مِّنَ الشَّاكِرِينَ', translation: 'Rather, worship Allah and be among the grateful.', reference: 'Az-Zumar 39:66' },
      { id: 83, theme: 'shukr', icon: 'star', arabic: 'وَاشْكُرُوا لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ', translation: 'And be grateful to Allah if it is Him that you worship.', reference: 'Al-Baqarah 2:172' },
      { id: 84, theme: 'shukr', icon: 'star', arabic: 'أَنِ اشْكُرْ لِي وَلِوَالِدَيْكَ', translation: 'Be grateful to Me and to your parents.', reference: 'Luqman 31:14' },
      { id: 85, theme: 'shukr', icon: 'star', arabic: 'إِلَيَّ الْمَصِيرُ', translation: 'To Me is the final destination.', reference: 'Luqman 31:14' },
      { id: 86, theme: 'shukr', icon: 'star', arabic: 'وَسَيَجْزِي اللَّهُ الشَّاكِرِينَ', translation: 'And Allah will reward the grateful.', reference: 'Al-Imran 3:144' },
      { id: 87, theme: 'shukr', icon: 'star', arabic: 'لَعَلَّكُمْ تَشْكُرُونَ', translation: 'That perhaps you will be grateful.', reference: 'Al-Baqarah 2:52' },
      { id: 88, theme: 'shukr', icon: 'star', arabic: 'وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ', translation: 'And remember when your Lord proclaimed, "If you are grateful, I will surely increase you."', reference: 'Ibrahim 14:7' },
      { id: 89, theme: 'shukr', icon: 'star', arabic: 'وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِي لَشَدِيدٌ', translation: 'But if you deny, indeed, My punishment is severe.', reference: 'Ibrahim 14:7' },
      { id: 90, theme: 'shukr', icon: 'star', arabic: 'فَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا وَاشْكُرُوا نِعْمَتَ اللَّهِ', translation: 'So eat of what Allah has provided for you, lawful and good, and be grateful for the favor of Allah.', reference: 'An-Nahl 16:114' },

      // === STRENGTH & COURAGE (91-105) ===
      { id: 91, theme: 'strength', icon: 'shield', arabic: 'وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ', translation: 'So do not weaken and do not grieve, and you will be superior.', reference: 'Al-Imran 3:139' },
      { id: 92, theme: 'strength', icon: 'shield', arabic: 'إِن كُنتُم مُّؤْمِنِينَ', translation: 'If you are truly believers.', reference: 'Al-Imran 3:139' },
      { id: 93, theme: 'strength', icon: 'shield', arabic: 'لَا تَخَافُوا وَلَا تَحْزَنُوا', translation: 'Fear not and do not grieve.', reference: 'Fussilat 41:30' },
      { id: 94, theme: 'strength', icon: 'shield', arabic: 'وَأَبْشِرُوا بِالْجَنَّةِ الَّتِي كُنتُمْ تُوعَدُونَ', translation: 'And receive good tidings of Paradise, which you were promised.', reference: 'Fussilat 41:30' },
      { id: 95, theme: 'strength', icon: 'shield', arabic: 'كَم مِّن فِئَةٍ قَلِيلَةٍ غَلَبَتْ فِئَةً كَثِيرَةً بِإِذْنِ اللَّهِ', translation: 'How many a small company has overcome a large company by permission of Allah.', reference: 'Al-Baqarah 2:249' },
      { id: 96, theme: 'strength', icon: 'shield', arabic: 'وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ', translation: 'And despair not of relief from Allah.', reference: 'Yusuf 12:87' },
      { id: 97, theme: 'strength', icon: 'shield', arabic: 'إِنَّهُ لَا يَيْأَسُ مِن رَّوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ', translation: 'Indeed, no one despairs of relief from Allah except the disbelieving people.', reference: 'Yusuf 12:87' },

      useEffect(() => {

      useEffect(() => {

      // Apply settings to DOM
      const applySettings = (s) => {
        const root = document.documentElement;

        // Apply theme colors as CSS variables
        Object.entries(colors).forEach(([shade, value]) => {
          root.style.setProperty(`--theme-${shade}`, value);

        // Apply font size
        const fontSizes = { small: '14px', medium: '16px', large: '18px' };
        root.style.setProperty('--base-font-size', fontSizes[s.fontSize] || '16px');

        // Apply Arabic font

          document.body.classList.remove('dark-mode');

      // Apply settings on initial load
      useEffect(() => {
        applySettings(settings);

      const updateState = (updates) => {
        setState(prev => ({ ...prev, ...updates }));

      const toggleSave = (item) => {

    // Hijri Date Calculator & Display
    const HijriDate = () => {
      const [hijriDate, setHijriDate] = useState({ day: '', month: '', year: '' });

      useEffect(() => {
        // Islamic calendar calculation (simplified approximation)
        const today = new Date();
        const gregorianYear = today.getFullYear();
        const gregorianMonth = today.getMonth();
        const gregorianDay = today.getDate();

        // Julian day number calculation
        const a = Math.floor((14 - (gregorianMonth + 1)) / 12);
        const y = gregorianYear + 4800 - a;
        const m = (gregorianMonth + 1) + 12 * a - 3;
        const jd = gregorianDay + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;

        // Convert to Hijri
        const l = jd - 1948440 + 10632;
        const n = Math.floor((l - 1) / 10631);
        const lPrime = l - 10631 * n + 354;
        const j = Math.floor((10985 - lPrime) / 5316) * Math.floor((50 * lPrime) / 17719) + Math.floor(lPrime / 5670) * Math.floor((43 * lPrime) / 15238);
        const lDoublePrime = lPrime - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
        const hijriMonth = Math.floor((24 * lDoublePrime) / 709);
        const hijriDay = lDoublePrime - Math.floor((709 * hijriMonth) / 24);
        const hijriYear = 30 * n + j - 30;

        const hijriMonths = ['Muharram', 'Safar', 'Rabi al-Awwal', 'Rabi al-Thani', 'Jumada al-Awwal', 'Jumada al-Thani', 'Rajab', 'Sha\'ban', 'Ramadan', 'Shawwal', 'Dhu al-Qi\'dah', 'Dhu al-Hijjah'];

        setHijriDate({
          day: hijriDay,
          month: hijriMonths[hijriMonth - 1] || hijriMonths[0],
          year: hijriYear
        });
      }, []);

      return (
        <div className="flex items-center gap-2 text-pink-600">
          <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
          </svg>
          <span className="text-xs font-medium">{hijriDate.day} {hijriDate.month} {hijriDate.year} AH</span>
        </div>
      );

    // Next Prayer Countdown Timer
    const PrayerCountdown = () => {
      const [timeLeft, setTimeLeft] = useState({ hours: 0, minutes: 0, seconds: 0 });
      const [nextPrayer, setNextPrayer] = useState('');

      useEffect(() => {
        const prayers = [
          { name: 'Fajr', hour: 5, minute: 30 },
          { name: 'Dhuhr', hour: 12, minute: 30 },
          { name: 'Asr', hour: 15, minute: 45 },
          { name: 'Maghrib', hour: 18, minute: 15 },
          { name: 'Isha', hour: 20, minute: 0 }
        ];

        const updateCountdown = () => {
          const now = new Date();
          const currentMinutes = now.getHours() * 60 + now.getMinutes();

          let next = prayers.find(p => p.hour * 60 + p.minute > currentMinutes);
          if (!next) next = prayers[0]; // Next Fajr

          setNextPrayer(next.name);

          let nextTime = new Date();
          nextTime.setHours(next.hour, next.minute, 0, 0);
          if (nextTime <= now) nextTime.setDate(nextTime.getDate() + 1);

          const diff = nextTime - now;
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          setTimeLeft({ hours, minutes, seconds });
        };

        updateCountdown();
        const interval = setInterval(updateCountdown, 1000);
        return () => clearInterval(interval);
      }, []);

      return (
