<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#be185d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Asma أسماء - Your Islamic Companion</title>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Three.js for 3D Tasbeeh -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Beautiful Islamic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&family=Lateef:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink-50: #fdf2f8;
      --pink-100: #fce7f3;
      --pink-200: #fbcfe8;
      --pink-300: #f9a8d4;
      --pink-400: #f472b6;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --pink-700: #be185d;
      --pink-800: #9d174d;
      --pink-900: #831843;
      --gold: #d4af37;
      --gold-light: #f4e4ba;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 25%, #fbcfe8 50%, #fdf2f8 75%, #fff1f2 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Islamic Fonts */
    .font-arabic { font-family: 'Scheherazade New', 'Amiri', serif; }
    .font-ruqaa { font-family: 'Aref Ruqaa', serif; }
    .font-amiri { font-family: 'Amiri', serif; }
    .font-lateef { font-family: 'Lateef', serif; }

    /* Animated Gradient Background */
    .gradient-bg {
      background: linear-gradient(-45deg, #fdf2f8, #fce7f3, #fbcfe8, #fdf2f8, #fff1f2);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 8px 32px rgba(219, 39, 119, 0.1),
        0 2px 8px rgba(219, 39, 119, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .glass-card-pink {
      background: linear-gradient(135deg, rgba(253, 242, 248, 0.9) 0%, rgba(252, 231, 243, 0.8) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow:
        0 8px 32px rgba(219, 39, 119, 0.15),
        0 2px 8px rgba(219, 39, 119, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Feature Cards with Gradient */
    .feature-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(253,242,248,0.8) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 114, 182, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .feature-card:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.2);
    }

    /* Islamic Geometric Pattern Background */
    .islamic-pattern {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23be185d' fill-opacity='1'%3E%3Cpath d='M30 0l30 30-30 30L0 30 30 0zm0 10L10 30l20 20 20-20-20-20z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* Floating Islamic Stars */
    .floating-star {
      position: fixed;
      pointer-events: none;
      opacity: 0.15;
      animation: floatStar 20s ease-in-out infinite;
    }

    @keyframes floatStar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-20px) rotate(90deg); }
      50% { transform: translateY(0) rotate(180deg); }
      75% { transform: translateY(20px) rotate(270deg); }
    }

    /* Crescent Moon */
    .crescent {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      opacity: 0.1;
      pointer-events: none;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(219, 39, 119, 0.3); }
      50% { box-shadow: 0 0 40px rgba(219, 39, 119, 0.5); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out; }
    .animate-scale-in { animation: scaleIn 0.4s ease-out; }
    .animate-slide-in { animation: slideInRight 0.5s ease-out; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-glow { animation: glow 2s ease-in-out infinite; }
    .animate-pulse { animation: pulse 2s ease-in-out infinite; }
    .animate-shimmer { animation: shimmer 2s ease-in-out infinite; }

    /* Staggered animations */
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }

    /* Shimmer effect */
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    /* Touch ripple effect */
    .ripple {
      position: relative;
      overflow: hidden;
    }

    .ripple::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(219, 39, 119, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .ripple:active::after {
      width: 300px;
      height: 300px;
    }

    /* Button styles */
    .btn-primary {
      background: linear-gradient(135deg, var(--pink-500) 0%, var(--pink-600) 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.4);
    }

    /* Icon containers */
    .icon-container {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: transform 0.3s ease;
    }

    .icon-container:active {
      transform: scale(0.9);
    }

    /* Pink gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--pink-600) 0%, var(--pink-800) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Gold accent text */
    .gold-text {
      color: var(--gold);
      text-shadow: 0 1px 2px rgba(212, 175, 55, 0.3);
    }

    /* Decorative borders */
    .ornate-border {
      border: 2px solid transparent;
      background: linear-gradient(white, white) padding-box,
                  linear-gradient(135deg, var(--pink-300), var(--gold-light), var(--pink-300)) border-box;
    }

    /* Dhikr counter special styles */
    .dhikr-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-100) 0%, var(--pink-200) 100%);
      border: 3px solid var(--pink-300);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 40px rgba(219, 39, 119, 0.2),
        inset 0 2px 10px rgba(255, 255, 255, 0.8);
      transition: all 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .dhikr-circle:active {
      transform: scale(0.95);
      box-shadow:
        0 5px 20px rgba(219, 39, 119, 0.3),
        inset 0 2px 10px rgba(255, 255, 255, 0.8);
    }

    /* Prayer time card */
    .prayer-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(253,242,248,0.9) 100%);
      border-left: 4px solid var(--pink-500);
    }

    .prayer-active {
      background: linear-gradient(135deg, var(--pink-500) 0%, var(--pink-600) 100%);
      color: white;
      border-left-color: var(--gold);
    }

    /* Arabic text styling */
    .arabic-verse {
      font-family: 'Scheherazade New', 'Amiri', serif;
      font-size: 1.75rem;
      line-height: 2.2;
      color: var(--pink-800);
      text-align: right;
      direction: rtl;
    }

    /* Hide scrollbar but allow scroll */
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Safe areas for mobile */
    .safe-top { padding-top: env(safe-area-inset-top, 20px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(244, 114, 182, 0.2);
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px;
      color: #9ca3af;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--pink-600);
    }

    .nav-item.active .nav-icon {
      transform: scale(1.1);
    }

    .nav-icon {
      font-size: 24px;
      transition: transform 0.3s ease;
    }

    .nav-label {
      font-size: 10px;
      margin-top: 4px;
      font-weight: 500;
    }

    /* Swipe indicator */
    .swipe-indicator {
      width: 40px;
      height: 5px;
      background: var(--pink-300);
      border-radius: 3px;
      margin: 8px auto;
    }

    /* Loading spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--pink-200);
      border-top-color: var(--pink-500);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--pink-800);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 200;
      animation: fadeInUp 0.3s ease;
    }

    /* Decorative elements */
    .star-8 {
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    /* ========================================== */
    /* INCREDIBLE UI ENHANCEMENTS                 */
    /* ========================================== */

    /* Floating Particles */
    @keyframes particle-float {
      0%, 100% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-100px) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes particle-float-reverse {
      0%, 100% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% {
        transform: translateY(100vh) rotate(-720deg);
        opacity: 0;
      }
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
    }

    /* Sparkle burst animation */
    @keyframes sparkle-burst {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(180deg); opacity: 0.8; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }

    .sparkle-particle {
      position: absolute;
      animation: sparkle-burst 0.8s ease-out forwards;
    }

    /* Typewriter Effect */
    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: var(--pink-500); }
    }

    .typewriter-text {
      overflow: hidden;
      white-space: nowrap;
      animation: typewriter 2s steps(30) forwards;
    }

    /* 3D Tilt Card */
    .tilt-card {
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.1s ease-out;
    }

    .tilt-card-inner {
      transform-style: preserve-3d;
      transition: transform 0.3s ease-out;
    }

    .tilt-card:active .tilt-card-inner {
      transform: translateZ(20px);
    }

    /* Enhanced Glass with multiple layers */
    .glass-ultra {
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.7) 50%,
        rgba(253, 242, 248, 0.8) 100%);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 25px 50px -12px rgba(219, 39, 119, 0.15),
        0 12px 24px -8px rgba(219, 39, 119, 0.1),
        0 4px 8px -2px rgba(219, 39, 119, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 1),
        inset 0 -1px 0 rgba(244, 114, 182, 0.1);
    }

    /* Progress Ring */
    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring-circle {
      transition: stroke-dashoffset 0.5s ease-out;
    }

    /* Shimmer overlay */
    .shimmer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%
      );
      background-size: 200% 100%;
      animation: shimmer 3s ease-in-out infinite;
      pointer-events: none;
      border-radius: inherit;
    }

    /* Glow pulse for icons */
    @keyframes icon-glow {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.8));
      }
    }

    .icon-glow {
      animation: icon-glow 2s ease-in-out infinite;
    }

    /* Countdown timer animation */
    @keyframes countdown-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .countdown-active {
      animation: countdown-pulse 1s ease-in-out infinite;
    }

    /* Enhanced Arabic calligraphy */
    .arabic-elegant {
      font-family: 'Scheherazade New', 'Amiri', serif;
      text-shadow:
        0 2px 4px rgba(157, 23, 77, 0.1),
        0 0 40px rgba(244, 114, 182, 0.2);
      letter-spacing: 0.05em;
    }

    /* Streak fire animation */
    @keyframes flame-flicker {
      0%, 100% {
        transform: scaleY(1) scaleX(1);
        filter: brightness(1);
      }
      25% {
        transform: scaleY(1.1) scaleX(0.95);
        filter: brightness(1.1);
      }
      50% {
        transform: scaleY(0.95) scaleX(1.05);
        filter: brightness(0.95);
      }
      75% {
        transform: scaleY(1.05) scaleX(0.98);
        filter: brightness(1.05);
      }
    }

    .flame {
      animation: flame-flicker 0.5s ease-in-out infinite;
    }

    /* Carousel animations */
    @keyframes slide-in-right {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slide-out-left {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(-100%); opacity: 0; }
    }

    /* Mood emoji bounce */
    @keyframes emoji-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.1); }
    }

    .mood-emoji:active {
      animation: emoji-bounce 0.3s ease-out;
    }

    /* Geometric pattern animation */
    @keyframes pattern-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .geometric-pattern {
      animation: pattern-rotate 120s linear infinite;
    }

    /* Spring bounce effect */
    @keyframes spring-bounce {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-spring {
      animation: spring-bounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* Page transitions */
    @keyframes page-enter {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes page-exit {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      to {
        opacity: 0;
        transform: translateY(-20px) scale(0.98);
      }
    }

    .page-transition-enter {
      animation: page-enter 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Multi-layered shadow mixin */
    .shadow-multi {
      box-shadow:
        0 1px 2px rgba(219, 39, 119, 0.05),
        0 2px 4px rgba(219, 39, 119, 0.05),
        0 4px 8px rgba(219, 39, 119, 0.05),
        0 8px 16px rgba(219, 39, 119, 0.05),
        0 16px 32px rgba(219, 39, 119, 0.05),
        0 32px 64px rgba(219, 39, 119, 0.1);
    }

    /* Rainbow gradient animation */
    @keyframes rainbow-shift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(30deg); }
    }

    /* Number counter animation */
    @keyframes count-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .count-animate {
      animation: count-up 0.3s ease-out;
    }

    /* Morphing blob background */
    @keyframes blob-morph {
      0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      25% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
      50% { border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%; }
      75% { border-radius: 60% 40% 60% 30% / 70% 30% 50% 60%; }
    }

    .blob {
      animation: blob-morph 8s ease-in-out infinite;
    }

    /* Verse carousel dots */
    .carousel-dot {
      transition: all 0.3s ease;
    }

    .carousel-dot.active {
      width: 24px;
      border-radius: 4px;
    }

    /* Journal entry card */
    .journal-card {
      background: linear-gradient(145deg,
        rgba(255, 255, 255, 0.95) 0%,
        rgba(253, 242, 248, 0.9) 100%);
      border-left: 4px solid var(--pink-400);
    }

    /* Floating action button */
    .fab {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-500) 0%, var(--pink-600) 100%);
      box-shadow:
        0 6px 20px rgba(219, 39, 119, 0.4),
        0 2px 8px rgba(219, 39, 119, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: all 0.3s ease;
    }

    .fab:active {
      transform: scale(0.9);
    }

    /* Notification badge pulse */
    @keyframes badge-pulse {

    const HijriDate = () => {
      const [hijriDate, setHijriDate] = useState({ day: '', month: '', year: '' });

      useEffect(() => {
        // Islamic calendar calculation (simplified approximation)
        const today = new Date();
        const gregorianYear = today.getFullYear();
        const gregorianMonth = today.getMonth();
        const gregorianDay = today.getDate();

        // Julian day number calculation
        const a = Math.floor((14 - (gregorianMonth + 1)) / 12);
        const y = gregorianYear + 4800 - a;
        const m = (gregorianMonth + 1) + 12 * a - 3;
        const jd = gregorianDay + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;

        // Convert to Hijri
        const l = jd - 1948440 + 10632;
        const n = Math.floor((l - 1) / 10631);
        const lPrime = l - 10631 * n + 354;
        const j = Math.floor((10985 - lPrime) / 5316) * Math.floor((50 * lPrime) / 17719) + Math.floor(lPrime / 5670) * Math.floor((43 * lPrime) / 15238);
        const lDoublePrime = lPrime - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
        const hijriMonth = Math.floor((24 * lDoublePrime) / 709);
        const hijriDay = lDoublePrime - Math.floor((709 * hijriMonth) / 24);
        const hijriYear = 30 * n + j - 30;

        const hijriMonths = ['Muharram', 'Safar', 'Rabi al-Awwal', 'Rabi al-Thani', 'Jumada al-Awwal', 'Jumada al-Thani', 'Rajab', 'Sha\'ban', 'Ramadan', 'Shawwal', 'Dhu al-Qi\'dah', 'Dhu al-Hijjah'];

        setHijriDate({
          day: hijriDay,
          month: hijriMonths[hijriMonth - 1] || hijriMonths[0],
          year: hijriYear
        });
      }, []);

      return (
        <div className="flex items-center gap-2 text-pink-600">
          <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>

          <span className="text-xs font-medium">{hijriDate.day} {hijriDate.month} {hijriDate.year} AH</span>
        </div>
      );

      const [timeLeft, setTimeLeft] = useState({ hours: 0, minutes: 0, seconds: 0 });
      const [nextPrayer, setNextPrayer] = useState('');

      useEffect(() => {
        const prayers = [

          { name: 'Dhuhr', hour: 12, minute: 30 },
          { name: 'Asr', hour: 15, minute: 45 },
          { name: 'Maghrib', hour: 18, minute: 15 },
          { name: 'Isha', hour: 20, minute: 0 }
        ];

        const updateCountdown = () => {
          const now = new Date();
          const currentMinutes = now.getHours() * 60 + now.getMinutes();

          let next = prayers.find(p => p.hour * 60 + p.minute > currentMinutes);
          if (!next) next = prayers[0]; // Next Fajr

          setNextPrayer(next.name);

          let nextTime = new Date();
          nextTime.setHours(next.hour, next.minute, 0, 0);
          if (nextTime <= now) nextTime.setDate(nextTime.getDate() + 1);

          const diff = nextTime - now;
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          setTimeLeft({ hours, minutes, seconds });
        };

        updateCountdown();
        const interval = setInterval(updateCountdown, 1000);
        return () => clearInterval(interval);

      const [transform, setTransform] = useState('');

        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX || e.touches?.[0]?.clientX;
        const y = e.clientY || e.touches?.[0]?.clientY;
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const rotateX = (y - centerY) / 20;
        const rotateY = (centerX - x) / 20;
        setTransform(`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`);
      }, []);

      const handleLeave = useCallback(() => {
        setTransform('');
      }, []);

      return (
        <div
          ref={cardRef}
          className={`tilt-card ${className}`}
          onMouseMove={handleMove}
          onMouseLeave={handleLeave}
          onTouchMove={handleMove}
          onTouchEnd={handleLeave}
          style={{ transform, transition: 'transform 0.1s ease-out' }}

    // 3D Tasbeeh Component with SVG Fallback
    const Tasbeeh3D = ({ count, target, onTap }) => {
      const containerRef = useRef(null);
      const sceneRef = useRef(null);
      const beadsRef = useRef([]);
      const animatingRef = useRef(false);
      const [isLoaded, setIsLoaded] = useState(false);

      // Beautiful SVG Fallback Tasbeeh
      const SVGTasbeeh = ({ count, target }) => {
        const beadCount = 33;
        const radius = 85;
        const centerX = 120;
        const centerY = 110;

        return (
          <svg viewBox="0 0 240 260" className="w-full h-full">
            <defs>
              {/* Pearl gradient */}
              <radialGradient id="pearlGrad" cx="30%" cy="30%">
                <stop offset="0%" stopColor="#ffffff"/>
                <stop offset="50%" stopColor="#fdf2f8"/>
                <stop offset="100%" stopColor="#f9a8d4"/>
              </radialGradient>
              {/* Counted bead gradient */}
              <radialGradient id="countedGrad" cx="30%" cy="30%">
                <stop offset="0%" stopColor="#f9a8d4"/>
                <stop offset="50%" stopColor="#ec4899"/>
                <stop offset="100%" stopColor="#db2777"/>
              </radialGradient>
              {/* Gold gradient */}
              <radialGradient id="goldGrad" cx="30%" cy="30%">
                <stop offset="0%" stopColor="#fef3c7"/>
                <stop offset="50%" stopColor="#fbbf24"/>
                <stop offset="100%" stopColor="#d97706"/>
              </radialGradient>
              {/* Glow filter */}
              <filter id="beadGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              {/* Shadow */}
              <filter id="tasbeehShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#f9a8d4" floodOpacity="0.4"/>
              </filter>
            </defs>

            {/* Background glow */}
            <circle cx={centerX} cy={centerY} r={radius + 20} fill="url(#countedGrad)" opacity="0.1"/>

            {/* String */}
            <circle cx={centerX} cy={centerY} r={radius} fill="none" stroke="url(#goldGrad)" strokeWidth="3" filter="url(#tasbeehShadow)"/>

            {/* Beads */}
            {[...Array(beadCount)].map((_, i) => {
              const angle = (i / beadCount) * Math.PI * 2 - Math.PI / 2;
              const x = centerX + Math.cos(angle) * radius;
              const y = centerY + Math.sin(angle) * radius;
              const isCounted = i < (count % 33 || (count > 0 && count % 33 === 0 ? 33 : 0));
              const isGold = i % 11 === 10;
              const beadRadius = isCounted ? 10 : 8;

              return (
                <g key={i}>
                  <circle
                    cx={x}
                    cy={y}
                    r={beadRadius}
                    fill={isGold ? "url(#goldGrad)" : isCounted ? "url(#countedGrad)" : "url(#pearlGrad)"}
                    filter={isCounted ? "url(#beadGlow)" : undefined}
                    className={isCounted ? "animate-pulse" : ""}
                  />
                  {/* Highlight */}
                  <circle cx={x - 2} cy={y - 2} r={beadRadius * 0.3} fill="white" opacity="0.6"/>
                </g>
              );
            })}

            {/* Tassel cap */}
            <ellipse cx={centerX} cy={centerY + radius + 12} rx="12" ry="8" fill="url(#goldGrad)"/>
            <rect x={centerX - 10} y={centerY + radius + 8} width="20" height="12" fill="url(#goldGrad)" rx="2"/>

            {/* Tassel threads */}
            {[...Array(8)].map((_, i) => {
              const spread = (i - 3.5) * 3;
              return (
                <line
                  key={i}
                  x1={centerX + spread * 0.3}
                  y1={centerY + radius + 18}
                  x2={centerX + spread}
                  y2={centerY + radius + 55}
                  stroke="#ec4899"
                  strokeWidth="2.5"
                  strokeLinecap="round"
                  opacity={0.8 + (i % 2) * 0.2}
                />
              );
            })}

            {/* Tassel end beads */}
            {[...Array(8)].map((_, i) => {
              const spread = (i - 3.5) * 3;
              return (
                <circle
                  key={i}
                  cx={centerX + spread}
                  cy={centerY + radius + 57}
                  r="3"
                  fill="url(#countedGrad)"
                />
              );

      useEffect(() => {
        if (!containerRef.current || sceneRef.current) return;

        const container = containerRef.current;
        const width = container.clientWidth;
        const height = container.clientHeight;

        // Scene setup
        const scene = new THREE.Scene();
        sceneRef.current = { scene };

        // Camera
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 12);

        // Renderer with better quality
        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: "high-performance"

        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);
        sceneRef.current.renderer = renderer;
        sceneRef.current.camera = camera;

        // Lighting - beautiful pink-tinted lighting
        const ambientLight = new THREE.AmbientLight(0xfce7f3, 0.4);
        scene.add(ambientLight);

        // Main light
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        // Pink accent light
        const pinkLight = new THREE.PointLight(0xec4899, 0.8, 20);
        pinkLight.position.set(-5, 3, 5);
        scene.add(pinkLight);

        // Rim light for glow effect
        const rimLight = new THREE.PointLight(0xfbbf24, 0.5, 15);
        rimLight.position.set(0, -5, 3);
        scene.add(rimLight);

        // Create beads
        const beadCount = 33;
        const radius = 3.5;
        const beadGeometry = new THREE.SphereGeometry(0.35, 32, 32);

        // Beautiful pearl-like material
        const beadMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xfdf2f8,
          metalness: 0.1,
          roughness: 0.2,
          clearcoat: 1.0,
          clearcoatRoughness: 0.1,
          reflectivity: 0.9,
          envMapIntensity: 1,
        });

        // Accent bead material (gold)
        const accentMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xd4af37,
          metalness: 0.8,
          roughness: 0.2,
          clearcoat: 0.5,
          reflectivity: 1,
        });

        // Counted bead material (pink)
        const countedMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xec4899,
          metalness: 0.3,
          roughness: 0.15,
          clearcoat: 1.0,
          clearcoatRoughness: 0.1,
          reflectivity: 0.9,
          emissive: 0xec4899,
          emissiveIntensity: 0.1,
        });

        const beads = [];
        for (let i = 0; i < beadCount; i++) {
          const angle = (i / beadCount) * Math.PI * 2 - Math.PI / 2;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;

          // Every 11th bead is gold accent
          const material = (i % 11 === 10) ? accentMaterial.clone() : beadMaterial.clone();
          const bead = new THREE.Mesh(beadGeometry, material);
          bead.position.set(x, y, 0);
          bead.castShadow = true;
          bead.receiveShadow = true;
          bead.userData = { index: i, originalMaterial: material, angle };
          scene.add(bead);
          beads.push(bead);
        }
        beadsRef.current = beads;
        sceneRef.current.countedMaterial = countedMaterial;

        // String/thread connecting beads
        const stringGeometry = new THREE.TorusGeometry(radius, 0.03, 8, 64);
        const stringMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xd4af37,
          metalness: 0.9,
          roughness: 0.3,

        // Tassel at bottom
        const tasselGroup = new THREE.Group();
        const tasselCapGeometry = new THREE.CylinderGeometry(0.25, 0.35, 0.4, 16);
        const tasselCapMaterial = new THREE.MeshPhysicalMaterial({

        tasselCap.position.set(0, -radius - 0.5, 0);

        // Tassel threads
        for (let i = 0; i < 12; i++) {
          const threadGeometry = new THREE.CylinderGeometry(0.02, 0.015, 1.2, 8);
          const threadMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xec4899,

          const thread = new THREE.Mesh(threadGeometry, threadMaterial);
          const angle = (i / 12) * Math.PI * 2;
          const spread = 0.15;
          thread.position.set(
            Math.cos(angle) * spread,
            -radius - 1.3,
            Math.sin(angle) * spread

          thread.rotation.x = Math.cos(angle) * 0.1;
          thread.rotation.z = Math.sin(angle) * 0.1;
          tasselGroup.add(thread);

        scene.add(tasselGroup);
        sceneRef.current.tasselGroup = tasselGroup;

        // Animation
        let rotationY = 0;
        let targetRotation = 0;
        const animate = () => {
          requestAnimationFrame(animate);

          // Smooth rotation
          rotationY += (targetRotation - rotationY) * 0.08;
          scene.rotation.y = rotationY;

          // Gentle floating animation
          const time = Date.now() * 0.001;
          scene.position.y = Math.sin(time * 0.5) * 0.1;
          tasselGroup.children.forEach((child, i) => {
            if (i > 0) { // Skip cap
              child.rotation.x = Math.sin(time * 2 + i) * 0.05;
              child.rotation.z = Math.cos(time * 2 + i) * 0.05;
            }
          });

          renderer.render(scene, camera);
        };
        animate();

        sceneRef.current.setTargetRotation = (r) => { targetRotation = r; };

        // Mark as loaded after a small delay to ensure smooth transition
        setTimeout(() => setIsLoaded(true), 100);

        // Handle resize
        const handleResize = () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          container.removeChild(renderer.domElement);
          renderer.dispose();

      // Update beads based on count
      useEffect(() => {
        if (!sceneRef.current) return;
        const { countedMaterial } = sceneRef.current;

        beadsRef.current.forEach((bead, i) => {
          if (i < count) {
            bead.material = countedMaterial.clone();
            bead.scale.setScalar(1.15);
          } else {
            bead.material = bead.userData.originalMaterial;
            bead.scale.setScalar(1);
          }
        });

        // Rotate to show progress
        if (sceneRef.current.setTargetRotation) {
          const progress = count / target;
          sceneRef.current.setTargetRotation(progress * Math.PI * 2);
        }
      }, [count, target]);

      const handleClick = () => {

        animatingRef.current = true;

        // Pulse animation on current bead
        if (count < beadsRef.current.length) {
          const bead = beadsRef.current[count];
          const originalScale = 1.15;
          bead.scale.setScalar(1.4);
          setTimeout(() => {
            bead.scale.setScalar(originalScale);
            animatingRef.current = false;
          }, 150);
        } else {
          animatingRef.current = false;
        }

        onTap();
      };

      return (
        <div
          className="w-full h-72 cursor-pointer rounded-3xl overflow-hidden relative"
          style={{ touchAction: 'manipulation' }}
          onClick={handleClick}
        >
          {/* SVG Fallback - shows immediately */}

              <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent animate-shimmer" />

          <div
            ref={containerRef}
            className={`absolute inset-0 transition-opacity duration-700 ${
              isLoaded ? 'opacity-100' : 'opacity-0'
            }`}
          />
        </div>
      );
    };

    const QiblaView = () => {
      const { updateState } = useApp();
      const [qiblaDirection, setQiblaDirection] = useState(null);
      const [deviceHeading, setDeviceHeading] = useState(0);
      const [userLocation, setUserLocation] = useState(null);
      const [error, setError] = useState(null);
      const [permissionState, setPermissionState] = useState('prompt');
      const [distance, setDistance] = useState(null);

      // Kaaba coordinates
      const KAABA_LAT = 21.4225;
      const KAABA_LNG = 39.8262;

      // Calculate bearing to Qibla from user's location
      const calculateQiblaDirection = (lat, lng) => {
        const lat1 = lat * Math.PI / 180;
        const lat2 = KAABA_LAT * Math.PI / 180;
        const deltaLng = (KAABA_LNG - lng) * Math.PI / 180;

        const y = Math.sin(deltaLng) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLng);
        let bearing = Math.atan2(y, x) * 180 / Math.PI;
        bearing = (bearing + 360) % 360;
        return bearing;
      };

      // Calculate distance to Kaaba
      const calculateDistance = (lat, lng) => {
        const R = 6371; // Earth's radius in km
        const lat1 = lat * Math.PI / 180;
        const lat2 = KAABA_LAT * Math.PI / 180;
        const deltaLat = (KAABA_LAT - lat) * Math.PI / 180;
        const deltaLng = (KAABA_LNG - lng) * Math.PI / 180;

        const a = Math.sin(deltaLat/2) * Math.sin(deltaLat/2) +
                  Math.cos(lat1) * Math.cos(lat2) *
                  Math.sin(deltaLng/2) * Math.sin(deltaLng/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return Math.round(R * c);
      };

      // Get user location
      useEffect(() => {
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude } = position.coords;
              setUserLocation({ lat: latitude, lng: longitude });
              setQiblaDirection(calculateQiblaDirection(latitude, longitude));
              setDistance(calculateDistance(latitude, longitude));
            },
            (err) => {
              console.error('Geolocation error:', err);
              // Default to a location for demo purposes
              setUserLocation({ lat: 40.7128, lng: -74.0060 }); // New York
              setQiblaDirection(calculateQiblaDirection(40.7128, -74.0060));
              setDistance(calculateDistance(40.7128, -74.0060));
              setError('Location access needed for accurate Qibla direction');
            }
          );
        } else {
          setError('Geolocation not supported');
        }
      }, []);

      // Handle device orientation
      useEffect(() => {
        const handleOrientation = (event) => {
          let heading;
          if (event.webkitCompassHeading !== undefined) {
            // iOS
            heading = event.webkitCompassHeading;
          } else if (event.alpha !== null) {
            // Android - alpha is compass heading when device is flat
            heading = 360 - event.alpha;
          }
          if (heading !== undefined) {
            setDeviceHeading(heading);
          }
        };

        const requestPermission = async () => {
          if (typeof DeviceOrientationEvent !== 'undefined' &&
              typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
              const response = await DeviceOrientationEvent.requestPermission();
              setPermissionState(response);
              if (response === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, true);
              }
            } catch (err) {
              console.error('Permission error:', err);
            }
          } else {
            // Non-iOS or older devices
            window.addEventListener('deviceorientation', handleOrientation, true);
            setPermissionState('granted');
          }
        };

        requestPermission();

        return () => {
          window.removeEventListener('deviceorientation', handleOrientation, true);
        };
      }, []);

      const needleRotation = qiblaDirection !== null ? qiblaDirection - deviceHeading : 0;

      return (
        <PageWrapper>
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top min-h-screen flex flex-col">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-6 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Qibla Compass</h1>
              <p className="font-ruqaa text-2xl text-pink-400">القِبلة</p>
            </div>

            {/* Main Compass Container */}
            <div className="flex-1 flex flex-col items-center justify-center animate-fade-in-up">
              {/* Compass Outer Ring */}
              <div className="relative">
                {/* Decorative glow */}
                <div className="absolute inset-0 bg-gradient-to-br from-pink-400/30 to-rose-400/30 rounded-full blur-3xl scale-110"></div>

                {/* Compass Background */}
                <div className="relative w-72 h-72 rounded-full bg-gradient-to-br from-white/90 to-pink-50/90 backdrop-blur-xl shadow-2xl shadow-pink-300/50 border-4 border-white/50">
                  {/* Compass Rose - Cardinal Directions */}
                  <div className="absolute inset-4 rounded-full border-2 border-pink-200/50">
                    {/* Cardinal direction markers */}
                    {['N', 'E', 'S', 'W'].map((dir, i) => (
                      <div
                        key={dir}
                        className="absolute w-8 h-8 flex items-center justify-center font-bold text-pink-400"
                        style={{
                          top: i === 0 ? '4px' : i === 2 ? 'auto' : '50%',
                          bottom: i === 2 ? '4px' : 'auto',
                          left: i === 3 ? '4px' : i === 1 ? 'auto' : '50%',
                          right: i === 1 ? '4px' : 'auto',
                          transform: i % 2 === 0 ? 'translateX(-50%)' : 'translateY(-50%)',
                        }}
                      >
                        {dir}
                      </div>
                    ))}

                    {/* Degree markers */}
                    {[...Array(72)].map((_, i) => (
                      <div
                        key={i}
                        className="absolute top-1/2 left-1/2 origin-center"
                        style={{
                          transform: `translate(-50%, -50%) rotate(${i * 5}deg)`,
                          width: '100%',
                          height: '100%'
                        }}
                      >
                        <div
                          className={`absolute top-0 left-1/2 -translate-x-1/2 ${
                            i % 18 === 0 ? 'w-0.5 h-4 bg-pink-400' :
                            i % 6 === 0 ? 'w-0.5 h-3 bg-pink-300' :
                            'w-px h-2 bg-pink-200'

                        />
                      </div>

                    {/* Compass Needle - Points to Qibla */}
                    <div
                      className="absolute inset-0 flex items-center justify-center transition-transform duration-300 ease-out"

                      <svg className="w-full h-full" viewBox="0 0 200 200">
                        <defs>

                            <stop offset="100%" stopColor="#be185d"/>
                          </linearGradient>
                          <linearGradient id="needleShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stopColor="#fce7f3"/>
                            <stop offset="100%" stopColor="#fbcfe8"/>
                          </linearGradient>
                          <filter id="needleGlow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                              <feMergeNode in="coloredBlur"/>
                              <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                          </filter>
                        </defs>
                        {/* North (Qibla) pointing needle */}
                        <path
                          d="M100 20 L108 100 L100 115 L92 100 Z"
                          fill="url(#needleGradient)"
                          filter="url(#needleGlow)"
                        />
                        {/* South needle */}
                        <path
                          d="M100 180 L108 100 L100 85 L92 100 Z"
                          fill="url(#needleShadow)"
                        />
                        {/* Center circle */}
                        <circle cx="100" cy="100" r="12" fill="url(#needleGradient)" stroke="white" strokeWidth="2"/>
                        {/* Kaaba symbol at tip */}
                        <rect x="94" y="24" width="12" height="12" rx="1" fill="#1f2937"/>
                        <ellipse cx="100" cy="30" rx="3" ry="4" fill="none" stroke="#ffd700" strokeWidth="1"/>
                      </svg>
                    </div>
                  </div>

                  {/* Center overlay */}
                  <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div className="w-6 h-6 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 shadow-lg"></div>
                  </div>
                </div>
              </div>

              {/* Qibla Direction Info */}
              <div className="mt-8 text-center space-y-4 animate-fade-in" style={{ animationDelay: '0.3s' }}>
                <div className="glass-card px-6 py-4 rounded-2xl inline-block">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center">
                      <Icon name="kaaba" className="w-6 h-6 text-white" />
                    </div>
                    <div className="text-left">
                      <p className="text-xs text-pink-500 font-medium">Direction to Kaaba</p>
                      <p className="text-2xl font-bold gradient-text">
                        {qiblaDirection !== null ? `${Math.round(qiblaDirection)}°` : '---°'}
                      </p>
                    </div>
                  </div>
                </div>

                {distance && (
                  <div className="glass-card px-6 py-3 rounded-xl">
                    <p className="text-sm text-pink-600">
                      <span className="font-bold">{distance.toLocaleString()}</span> km to Makkah
                    </p>
                  </div>
                )}

                {error && (
                  <div className="px-4 py-2 bg-amber-50 border border-amber-200 rounded-xl">
                    <p className="text-sm text-amber-700">{error}</p>
                  </div>
                )}

                {permissionState === 'prompt' && (
                  <button
                    onClick={() => {
                      if (typeof DeviceOrientationEvent !== 'undefined' &&
                          typeof DeviceOrientationEvent.requestPermission === 'function') {
                        DeviceOrientationEvent.requestPermission();
                      }
                    }}
                    className="px-6 py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-xl font-medium shadow-lg shadow-pink-300/50 active:scale-95 transition-transform"
                  >
                    Enable Compass
                  </button>
                )}
              </div>

              {/* Instructions */}
              <div className="mt-6 text-center text-pink-400 text-sm animate-fade-in" style={{ animationDelay: '0.5s' }}>
                <p>Hold your device flat and rotate</p>
                <p>The needle points to the Qibla</p>
              </div>
            </div>

            {/* Beautiful Kaaba illustration at bottom */}
            <div className="mt-8 text-center animate-fade-in" style={{ animationDelay: '0.6s' }}>
              <div className="inline-block p-4 rounded-2xl bg-gradient-to-br from-pink-50 to-rose-50">
                <p className="font-arabic text-xl text-pink-400 mb-1">وَحَيْثُ مَا كُنتُمْ فَوَلُّوا وُجُوهَكُمْ شَطْرَهُ</p>
                <p className="text-xs text-pink-500">"Turn your faces toward it" - Al-Baqarah 2:144</p>
              </div>
            </div>
          </div>
        </PageWrapper>
      );
    };

    // ============================================
    // BOTTOM NAVIGATION
    // ============================================

    const BottomNav = () => {
      const { state, updateState } = useApp();

      const navItems = [
        { id: 'home', icon: 'home', label: 'Home' },
        { id: 'hadith', icon: 'book', label: 'Hadith' },
        { id: 'dhikr', icon: 'beads', label: 'Dhikr' },
        { id: 'duas', icon: 'hands', label: 'Duas' },
        { id: 'saved', icon: 'heart', label: 'Saved' },
      ];

      return (
        <nav className="bottom-nav">
          <div className="max-w-lg mx-auto flex items-center justify-around py-2">
            {navItems.map((item) => (
              <button
                key={item.id}
                onClick={() => { haptic.light(); updateState({ view: item.id }); }}
                className={`nav-item ${state.view === item.id ? 'active' : ''}`}
              >
                <span className={`nav-icon ${state.view === item.id ? 'scale-110' : ''} transition-transform`}>
                  <Icon name={item.icon} className="w-6 h-6" />
                </span>
                <span className="nav-label">{item.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };

    // ============================================
    // MAIN APP
    // ============================================

    const App = () => {
      const { state } = useApp();

      if (!state.onboardingComplete) {
        return <Onboarding />;
      }

      const renderView = () => {
        switch(state.view) {
          case 'hadith': return <HadithView />;
          case 'duas': return <DuasView />;
          case 'prayer': return <PrayerView />;
          case 'sahabiyat': return <SahabiyatView />;
          case 'dhikr': return <DhikrView />;
          case 'saved': return <SavedView />;
          case 'qibla': return <QiblaView />;
          default: return <HomeScreen />;
        }
      };

      return (
        <>
          {renderView()}
          <BottomNavPremium />
        </>
      );
    };

    // ============================================
    // RENDER
    // ============================================

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
