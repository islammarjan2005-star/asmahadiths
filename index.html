<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#831843">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asma">
  <link rel="manifest" href="data:application/json,{}">
  <title>Asma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --pink-50: #fdf2f8; --pink-100: #fce7f3; --pink-200: #fbcfe8; --pink-300: #f9a8d4;
      --pink-400: #f472b6; --pink-500: #ec4899; --pink-600: #db2777; --pink-700: #be185d;
      --pink-800: #9d174d; --pink-900: #831843; --pink-950: #500724;
      --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { height: -webkit-fill-available; overflow: hidden; }
    body {
      margin: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: linear-gradient(160deg, #fdf2f8 0%, #fce7f3 30%, #fbcfe8 70%, #fdf2f8 100%);
      min-height: 100vh; min-height: -webkit-fill-available;
      overflow: hidden; -webkit-font-smoothing: antialiased; color: var(--pink-900);
    }
    #root { height: 100vh; height: -webkit-fill-available; overflow: hidden; }
    .font-ar { font-family: 'Scheherazade New', 'Amiri', serif; direction: rtl; line-height: 1.9; }
    .font-d { font-family: 'Plus Jakarta Sans'; font-weight: 700; letter-spacing: -0.02em; }

    .bg-mesh {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(251,207,232,0.6) 0%, transparent 50%),
        radial-gradient(ellipse 60% 70% at 80% 20%, rgba(249,168,212,0.5) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 50% 85%, rgba(244,114,182,0.4) 0%, transparent 50%),
        linear-gradient(160deg, #fdf2f8, #fce7f3, #fdf2f8);
    }
    .pattern {
      position: fixed; inset: 0; z-index: -1; opacity: 0.02; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 30-30 30L0 30z' fill='none' stroke='%23831843' stroke-width='1'/%3E%3Ccircle cx='30' cy='30' r='8' fill='none' stroke='%23831843' stroke-width='1'/%3E%3C/svg%3E");
    }
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      animation: orb 25s ease-in-out infinite;
    }
    .orb-1 { width: 350px; height: 350px; background: rgba(244,114,182,0.35); top: -120px; right: -100px; }
    .orb-2 { width: 250px; height: 250px; background: rgba(249,168,212,0.4); bottom: 15%; left: -80px; animation-delay: -10s; }
    @keyframes orb {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(30px,-40px) scale(1.08); }
      66% { transform: translate(-20px,30px) scale(0.95); }
    }

    .glass {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.85);
    }
    .glass-p {
      background: linear-gradient(140deg, rgba(253,242,248,0.92), rgba(252,231,243,0.88));
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(249,168,212,0.3);
    }
    .shadow-c {
      box-shadow: 0 2px 4px rgba(131,24,67,0.02), 0 4px 8px rgba(131,24,67,0.03),
                  0 8px 16px rgba(131,24,67,0.04), 0 16px 32px rgba(131,24,67,0.05);
    }
    .shadow-f {
      box-shadow: 0 10px 25px rgba(131,24,67,0.08), 0 20px 48px rgba(131,24,67,0.1);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes glow { 0%,100% { box-shadow: 0 0 24px rgba(236,72,153,0.35); } 50% { box-shadow: 0 0 48px rgba(236,72,153,0.55); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    .a-fade { animation: fadeIn 0.5s var(--ease-expo) both; }
    .a-slide { animation: slideUp 0.55s var(--ease-expo) both; }
    .a-scale { animation: scaleIn 0.5s var(--ease-expo) both; }
    .a-bounce { animation: bounce 3s ease-in-out infinite; }
    .a-glow { animation: glow 2.5s ease-in-out infinite; }
    .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.16s; } .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.32s; } .d5 { animation-delay: 0.4s; } .d6 { animation-delay: 0.48s; }

    .skeleton {
      background: linear-gradient(90deg, rgba(251,207,232,0.4), rgba(249,168,212,0.6), rgba(251,207,232,0.4));
      background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 16px;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px 28px; border-radius: 50px; font-weight: 600; font-size: 15px;
      border: none; cursor: pointer; transition: all 0.25s var(--ease-expo);
      position: relative; overflow: hidden;
    }
    .btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.25) 0%, transparent 60%);
    }
    .btn-p {
      background: linear-gradient(135deg, var(--pink-500), var(--pink-600));
      color: white; box-shadow: 0 6px 20px rgba(219,39,119,0.4);
    }
    .btn-p:active { transform: scale(0.96); box-shadow: 0 3px 12px rgba(219,39,119,0.5); }
    .btn-s { background: rgba(255,255,255,0.85); color: var(--pink-700); border: 1px solid rgba(244,114,182,0.25); }
    .btn-s:active { transform: scale(0.96); }

    .ib {
      width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center;
      justify-content: center; border: none; cursor: pointer; transition: all 0.2s var(--ease-expo);
    }
    .ib:active { transform: scale(0.88); }

    .input {
      width: 100%; padding: 17px 22px; border-radius: 18px; border: 2px solid transparent;
      background: rgba(255,255,255,0.82); font-size: 16px; font-family: inherit; color: var(--pink-900);
      transition: all 0.3s var(--ease-expo);
    }
    .input::placeholder { color: var(--pink-300); }
    .input:focus { outline: none; border-color: var(--pink-400); background: rgba(255,255,255,0.95); box-shadow: 0 0 0 5px rgba(244,114,182,0.12); }

    .scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }

    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      padding: 0 14px calc(max(var(--safe-bottom), 8px) + 8px) 14px;
    }
    .tab-inner {
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 8px 12px; border-radius: 26px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 -2px 0 rgba(244,114,182,0.08), 0 10px 40px rgba(131,24,67,0.12);
      border: 1px solid rgba(255,255,255,0.85);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 14px; border-radius: 16px; background: transparent;
      border: none; cursor: pointer; color: var(--pink-400); transition: all 0.3s var(--ease-expo);
      position: relative;
    }
    .tab.on { color: var(--pink-600); }
    .tab.on::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 22px; height: 3px;
      background: linear-gradient(90deg, var(--pink-500), var(--pink-400));
      border-radius: 50px;
    }
    .tab-i { font-size: 23px; transition: transform 0.3s var(--ease-spring); }
    .tab.on .tab-i { transform: scale(1.18); }
    .tab-l { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }

    .tg {
      background: linear-gradient(135deg, var(--pink-600), var(--pink-800));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--pink-50), var(--pink-100), var(--pink-200));
      z-index: 1000;
    }
    .splash-logo { font-size: 80px; margin-bottom: 20px; animation: scaleIn 0.7s var(--ease-spring) both; }
    .splash-t { font-size: 48px; animation: slideUp 0.7s var(--ease-expo) 0.15s both; }
    .splash-ar { font-size: 36px; color: var(--pink-400); animation: slideUp 0.7s var(--ease-expo) 0.25s both; }
    .splash-spin {
      width: 44px; height: 44px; margin-top: 40px;
      border: 3px solid var(--pink-200); border-top-color: var(--pink-500);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }

    .toast {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      padding: 14px 26px; border-radius: 50px;
      background: var(--pink-900); color: white;
      font-weight: 600; font-size: 14px;
      box-shadow: 0 10px 40px rgba(131,24,67,0.25);
      z-index: 200; animation: slideUp 0.35s var(--ease-spring);
    }

    .safe-t { padding-top: max(var(--safe-top), 16px); }
    .safe-b { padding-bottom: max(var(--safe-bottom), 16px); }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="pattern"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext, useCallback, useMemo, useRef } = React;

    const haptic = {
      light: () => navigator.vibrate?.(8),
      med: () => navigator.vibrate?.(18),
      heavy: () => navigator.vibrate?.([25,15,25]),
      ok: () => navigator.vibrate?.([10,40,25,40,10]),
    };

    // Data
    const hadithData = [
      { id: 1, icon: '💍', ar: 'لا تُنكَحُ الأيِّمُ حتى تُستأمَرَ', text: 'A woman should not be married until she is consulted, and a virgin should not be married until her permission is sought.', src: 'Sahih al-Bukhari 5136', yes: 'You have the absolute right to accept or reject any marriage proposal.', no: 'Silence from fear is not consent.' },
      { id: 2, icon: '🌸', ar: 'إنَّ هذا أمرٌ كتَبَهُ اللهُ على بناتِ آدمَ', text: 'This is something that Allah has ordained for the daughters of Adam.', src: 'Sahih al-Bukhari 294', yes: 'Menstruation is natural, not shameful. The prayer exemption is mercy.', no: 'You are not spiritually impure. You can still do dhikr and dua.' },
      { id: 3, icon: '✨', ar: 'إنَّ اللهَ لا ينظُرُ إلى صُوَرِكُم', text: 'Allah does not look at your appearance or wealth, but He looks at your hearts and actions.', src: 'Sahih Muslim 2564', yes: 'Your worth is defined by character—not beauty or wealth.', no: 'Self-care is not vanity. Taking care of yourself is also worship.' },
      { id: 4, icon: '🌙', ar: 'إنَّ لِنَفسِكَ عليكَ حقًّا', text: 'Your own self has a right over you.', src: 'Sahih al-Bukhari 1975', yes: 'Rest, boundaries, and self-care are part of faith.', no: 'This is not neglecting duties—burning out is not piety.' },
      { id: 5, icon: '🕊️', ar: 'أبغَضُ الحلالِ إلى اللهِ الطَّلاقُ', text: 'The most disliked of permissible things to Allah is divorce.', src: 'Sunan Abu Dawud 2178', yes: 'Divorce is valid and permissible. Islam does not trap you.', no: 'You are never required to stay in an abusive situation.' },
      { id: 6, icon: '📚', ar: 'طَلَبُ العِلمِ فَريضَةٌ', text: 'Seeking knowledge is an obligation upon every Muslim.', src: 'Sunan Ibn Majah 224', yes: 'Education—religious and worldly—is your Islamic right.', no: 'No one can deny you education based on gender.' },
    ];

    const duasData = [
      { id: 1, cat: 'Morning', icon: '🌅', ar: 'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ', tr: 'Asbahna wa asbahal mulku lillah', en: 'We have reached the morning and the kingdom belongs to Allah.', src: 'Abu Dawud' },
      { id: 2, cat: 'Anxiety', icon: '💜', ar: 'لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ', tr: 'La ilaha illa anta subhanaka', en: 'There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.', src: 'Quran 21:87' },
      { id: 3, cat: 'Guidance', icon: '🌟', ar: 'رَبِّ اشْرَحْ لِي صَدْرِي', tr: 'Rabbish rahli sadri', en: 'My Lord, expand for me my chest and ease for me my task.', src: 'Quran 20:25-26' },
      { id: 4, cat: 'Protection', icon: '🛡️', ar: 'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ', tr: 'Bismillahil-ladhi la yadurru', en: 'In the name of Allah with whose name nothing can harm.', src: 'Tirmidhi' },
      { id: 5, cat: 'Forgiveness', icon: '🤍', ar: 'رَبَّنَا ظَلَمْنَا أَنفُسَنَا', tr: 'Rabbana zalamna anfusana', en: 'Our Lord, we have wronged ourselves, and if You do not forgive us, we will be among the losers.', src: 'Quran 7:23' },
    ];

    const sahabiyat = [
      { id: 1, name: 'Khadijah bint Khuwaylid', ar: 'خديجة بنت خويلد', title: 'Mother of the Believers', grad: 'linear-gradient(135deg,#ec4899,#be185d)', story: 'A successful merchant who proposed to the Prophet ﷺ. The first Muslim. She funded the early Muslim community and supported him through every trial.', legacy: 'The first Muslim. A businesswoman. A leader. The best of women.' },
      { id: 2, name: 'Aisha bint Abi Bakr', ar: 'عائشة بنت أبي بكر', title: 'The Scholar of Islam', grad: 'linear-gradient(135deg,#8b5cf6,#6d28d9)', story: 'She narrated over 2,200 hadith and was consulted by the greatest companions. She corrected scholars and shaped Islamic jurisprudence.', legacy: '"Take half of your religion from this woman." — The Prophet ﷺ' },
      { id: 3, name: 'Nusaybah bint Ka\'b', ar: 'نسيبة بنت كعب', title: 'The Warrior of Uhud', grad: 'linear-gradient(135deg,#f43f5e,#e11d48)', story: 'When others fled at Uhud, she stood firm. She fought to protect the Prophet ﷺ, taking 12 wounds. He said: "Wherever I turned, I saw her fighting for me."', legacy: 'Women can be warriors, protectors, and heroes.' },
      { id: 4, name: 'Fatimah al-Fihri', ar: 'فاطمة الفهري', title: 'Founder of First University', grad: 'linear-gradient(135deg,#f59e0b,#d97706)', story: 'She used her inheritance to found al-Qarawiyyin in 859 CE—the world\'s oldest existing university.', legacy: 'A woman built the world\'s first university.' },
    ];

    const dhikrList = [
      { ar: 'سُبْحَانَ اللَّهِ', la: 'SubhanAllah', m: 'Glory be to Allah', n: 33 },
      { ar: 'الْحَمْدُ لِلَّهِ', la: 'Alhamdulillah', m: 'Praise be to Allah', n: 33 },
      { ar: 'اللَّهُ أَكْبَرُ', la: 'Allahu Akbar', m: 'Allah is Greatest', n: 34 },
      { ar: 'لَا إِلَٰهَ إِلَّا اللَّهُ', la: 'La ilaha illallah', m: 'None worthy of worship but Allah', n: 100 },
      { ar: 'أَسْتَغْفِرُ اللَّهَ', la: 'Astaghfirullah', m: 'I seek Allah\'s forgiveness', n: 100 },
    ];

    // Context
    const Ctx = createContext();
    const Provider = ({ children }) => {
      const [state, setState] = useState(() => {
        try { const s = localStorage.getItem('asma-v3'); return s ? JSON.parse(s) : { done: false, name: '', saved: [] }; }
        catch { return { done: false, name: '', saved: [] }; }
      });
      const [view, setView] = useState('splash');
      const [toast, setToast] = useState(null);
      useEffect(() => { localStorage.setItem('asma-v3', JSON.stringify(state)); }, [state]);
      const showToast = useCallback((m) => { setToast(m); setTimeout(() => setToast(null), 2200); }, []);
      const toggle = useCallback((item, type) => {
        haptic.light();
        setState(p => {
          const k = `${type}-${item.id}`;
          const has = p.saved.some(s => s.k === k);
          showToast(has ? 'Removed' : 'Saved ♡');
          return { ...p, saved: has ? p.saved.filter(s => s.k !== k) : [...p.saved, { ...item, k, type }] };
        });
      }, [showToast]);
      const isSaved = useCallback((id, type) => state.saved.some(s => s.k === `${type}-${id}`), [state.saved]);
      return <Ctx.Provider value={{ state, setState, view, setView, toast, showToast, toggle, isSaved }}>{children}</Ctx.Provider>;
    };
    const useApp = () => useContext(Ctx);

    // Icons
    const I = {
      back: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>,
      heart: (f) => <svg width="22" height="22" fill={f?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
      chev: <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>,
      eye: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
      ref: <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
    };

    // Splash
    const Splash = () => {
      const { state, setView } = useApp();
      useEffect(() => { const t = setTimeout(() => setView(state.done ? 'home' : 'onboard'), 1800); return () => clearTimeout(t); }, [state.done, setView]);
      return (
        <div className="splash">
          <div className="splash-logo a-bounce">🌸</div>
          <h1 className="splash-t font-d tg">Asma</h1>
          <p className="splash-ar font-ar">أسماء</p>
          <div className="splash-spin"></div>
        </div>
      );
    };

    // Onboard
    const Onboard = () => {
      const { setState, setView } = useApp();
      const [step, setStep] = useState(0);
      const [name, setName] = useState('');
      const steps = [
        { icon: '🌸', t: 'Welcome to Asma', s: 'Your beautiful Islamic companion' },
        { icon: '📖', t: 'Authentic Sources', s: 'Verified hadith with context and meaning' },
        { icon: '💜', t: 'Your Safe Space', s: 'Private. Secure. Just for you.' },
      ];
      const finish = () => { haptic.ok(); setState(p => ({ ...p, done: true, name: name || 'Sister' })); setView('home'); };
      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: 24 }} className="safe-t safe-b">
          <div style={{ maxWidth: 380, margin: '0 auto', width: '100%' }}>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginBottom: 48 }}>
              {steps.map((_, i) => <div key={i} style={{ height: 4, borderRadius: 2, background: i <= step ? 'var(--pink-500)' : 'var(--pink-200)', width: i === step ? 32 : 14, transition: 'all 0.4s var(--ease-expo)' }} />)}
            </div>
            <div key={step} className="a-scale" style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 80, marginBottom: 24 }} className="a-bounce">{steps[step].icon}</div>
              <h1 className="tg font-d" style={{ fontSize: 32, marginBottom: 8 }}>{steps[step].t}</h1>
              <p style={{ color: 'var(--pink-500)', fontSize: 16, marginBottom: 48 }}>{steps[step].s}</p>
              {step === 2 && <input type="text" placeholder="What should we call you?" value={name} onChange={e => setName(e.target.value)} className="input a-slide" style={{ marginBottom: 32, textAlign: 'center' }} />}
            </div>

    // Prayer
    const Prayer = () => {
      const { setView } = useApp();
      const [times, setTimes] = useState(null);
      const [load, setLoad] = useState(true);
      const prayers = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
      const icons = { Fajr: '🌅', Sunrise: '☀️', Dhuhr: '🌤️', Asr: '⛅', Maghrib: '🌇', Isha: '🌙' };
      useEffect(() => {
        navigator.geolocation?.getCurrentPosition(
          p => fetch(`https://api.aladhan.com/v1/timings?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&method=2`).then(r => r.json()).then(d => { setTimes(d.data.timings); setLoad(false); }).catch(() => setLoad(false)),

            </div>
          </div>
        </div>
      );
    };

    // Saved
    const Saved = () => {
      const { state, setView, toggle } = useApp();
      return (
        <div className="scroll a-fade" style={{ height: '100vh' }}>
          <Hdr t="Saved" ar="المحفوظات" back={() => setView('home')} />
          <div style={{ padding: '0 20px 130px', maxWidth: 480, margin: '0 auto' }}>
            {state.saved.length === 0 ? <div className="glass shadow-c a-scale" style={{ padding: '60px 24px', borderRadius: 24, textAlign: 'center' }}><p style={{ fontSize: 56, marginBottom: 16 }}>💖</p><h3 className="font-d" style={{ color: 'var(--pink-800)', marginBottom: 8 }}>No saved items yet</h3><p style={{ color: 'var(--pink-500)', fontSize: 14 }}>Tap the heart icon to save hadith and duas</p></div>
            : <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              {state.saved.map((x, i) => (
                <div key={x.k} className={`glass shadow-c a-slide d${i + 1}`} style={{ borderRadius: 18, padding: 20 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--pink-500)', textTransform: 'uppercase', background: 'var(--pink-100)', padding: '4px 10px', borderRadius: 50 }}>{x.type}</span>
                    <button onClick={() => toggle(x, x.type)} style={{ background: 'none', border: 'none', color: 'var(--pink-500)', cursor: 'pointer', padding: 4 }}>{I.heart(true)}</button>
                  </div>
                  {x.ar && <p className="font-ar" style={{ fontSize: 22, color: 'var(--pink-800)', marginBottom: 12 }}>{x.ar}</p>}
                  <p style={{ color: 'var(--pink-700)', lineHeight: 1.6, margin: 0 }}>{x.text || x.en}</p>
                  {x.src && <p style={{ fontSize: 12, color: 'var(--pink-500)', marginTop: 8 }}>{x.src}</p>}
                </div>
              ))}
            </div>}
          </div>
        </div>
      );
    };

    // TabBar
    const TabBar = () => {
      const { view, setView } = useApp();
      const tabs = [{ id: 'home', i: '🏠', l: 'Home' }, { id: 'hadith', i: '📖', l: 'Hadith' }, { id: 'dhikr', i: '📿', l: 'Dhikr' }, { id: 'duas', i: '🤲', l: 'Duas' }, { id: 'saved', i: '💖', l: 'Saved' }];
      return <nav className="tab-bar"><div className="tab-inner">{tabs.map(t => <button key={t.id} onClick={() => { haptic.light(); setView(t.id); }} className={`tab ${view === t.id ? 'on' : ''}`}><span className="tab-i">{t.i}</span><span className="tab-l">{t.l}</span></button>)}</div></nav>;
    };

    // Toast
    const Toast = ({ m }) => m ? <div className="toast">{m}</div> : null;

    // App
    const App = () => {
      const { view, toast } = useApp();
      const render = () => {
        switch (view) {
          case 'splash': return <Splash />;
          case 'onboard': return <Onboard />;
          case 'hadith': return <Hadith />;
          case 'duas': return <Duas />;
          case 'prayer': return <Prayer />;
          case 'sahabiyat': return <Sahabiyat />;
          case 'dhikr': return <Dhikr />;
          case 'saved': return <Saved />;
          default: return <Home />;
        }
      };
      return <>{render()}{!['splash', 'onboard'].includes(view) && <TabBar />}<Toast m={toast} /></>;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Provider><App /></Provider>);
  </script>
</body>
</html>
