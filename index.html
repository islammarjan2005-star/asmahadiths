<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#be185d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Asma أسماء - Your Islamic Companion</title>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Beautiful Islamic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&family=Lateef:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink-50: #fdf2f8;
      --pink-100: #fce7f3;
      --pink-200: #fbcfe8;
      --pink-300: #f9a8d4;
      --pink-400: #f472b6;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --pink-700: #be185d;
      --pink-800: #9d174d;
      --pink-900: #831843;
      --gold: #d4af37;
      --gold-light: #f4e4ba;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 25%, #fbcfe8 50%, #fdf2f8 75%, #fff1f2 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Islamic Fonts */
    .font-arabic { font-family: 'Scheherazade New', 'Amiri', serif; }
    .font-ruqaa { font-family: 'Aref Ruqaa', serif; }
    .font-amiri { font-family: 'Amiri', serif; }
    .font-lateef { font-family: 'Lateef', serif; }

    /* Animated Gradient Background */
    .gradient-bg {
      background: linear-gradient(-45deg, #fdf2f8, #fce7f3, #fbcfe8, #fdf2f8, #fff1f2);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 8px 32px rgba(219, 39, 119, 0.1),
        0 2px 8px rgba(219, 39, 119, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .glass-card-pink {
      background: linear-gradient(135deg, rgba(253, 242, 248, 0.9) 0%, rgba(252, 231, 243, 0.8) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow:
        0 8px 32px rgba(219, 39, 119, 0.15),
        0 2px 8px rgba(219, 39, 119, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Feature Cards with Gradient */
    .feature-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(253,242,248,0.8) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 114, 182, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .feature-card:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.2);
    }

    /* Islamic Geometric Pattern Background */
    .islamic-pattern {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23be185d' fill-opacity='1'%3E%3Cpath d='M30 0l30 30-30 30L0 30 30 0zm0 10L10 30l20 20 20-20-20-20z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* Floating Islamic Stars */
    .floating-star {
      position: fixed;
      pointer-events: none;
      opacity: 0.15;
      animation: floatStar 20s ease-in-out infinite;
    }

    @keyframes floatStar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-20px) rotate(90deg); }
      50% { transform: translateY(0) rotate(180deg); }
      75% { transform: translateY(20px) rotate(270deg); }
    }

    /* Crescent Moon */
    .crescent {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      opacity: 0.1;
      pointer-events: none;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(219, 39, 119, 0.3); }
      50% { box-shadow: 0 0 40px rgba(219, 39, 119, 0.5); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out; }
    .animate-scale-in { animation: scaleIn 0.4s ease-out; }
    .animate-slide-in { animation: slideInRight 0.5s ease-out; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-glow { animation: glow 2s ease-in-out infinite; }
    .animate-pulse { animation: pulse 2s ease-in-out infinite; }

    /* Staggered animations */
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }

    /* Shimmer effect */
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    /* Touch ripple effect */
    .ripple {
      position: relative;
      overflow: hidden;
    }

    .ripple::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(219, 39, 119, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .ripple:active::after {
      width: 300px;
      height: 300px;
    }

    /* Button styles */
    .btn-primary {
      background: linear-gradient(135deg, var(--pink-500) 0%, var(--pink-600) 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.4);
    }

    /* Icon containers */
    .icon-container {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: transform 0.3s ease;
    }

    .icon-container:active {
      transform: scale(0.9);
    }

    /* Pink gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--pink-600) 0%, var(--pink-800) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Gold accent text */
    .gold-text {
      color: var(--gold);
      text-shadow: 0 1px 2px rgba(212, 175, 55, 0.3);
    }

    /* Decorative borders */
    .ornate-border {
      border: 2px solid transparent;
      background: linear-gradient(white, white) padding-box,
                  linear-gradient(135deg, var(--pink-300), var(--gold-light), var(--pink-300)) border-box;
    }

    /* Dhikr counter special styles */
    .dhikr-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-100) 0%, var(--pink-200) 100%);
      border: 3px solid var(--pink-300);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 40px rgba(219, 39, 119, 0.2),
        inset 0 2px 10px rgba(255, 255, 255, 0.8);
      transition: all 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .dhikr-circle:active {
      transform: scale(0.95);
      box-shadow:
        0 5px 20px rgba(219, 39, 119, 0.3),
        inset 0 2px 10px rgba(255, 255, 255, 0.8);
    }

    /* Prayer time card */
    .prayer-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(253,242,248,0.9) 100%);
      border-left: 4px solid var(--pink-500);
    }

    .prayer-active {
      background: linear-gradient(135deg, var(--pink-500) 0%, var(--pink-600) 100%);
      color: white;
      border-left-color: var(--gold);
    }

    /* Arabic text styling */
    .arabic-verse {
      font-family: 'Scheherazade New', 'Amiri', serif;
      font-size: 1.75rem;
      line-height: 2.2;
      color: var(--pink-800);
      text-align: right;
      direction: rtl;
    }

    /* Hide scrollbar but allow scroll */
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Safe areas for mobile */
    .safe-top { padding-top: env(safe-area-inset-top, 20px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(244, 114, 182, 0.2);
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px;
      color: #9ca3af;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--pink-600);
    }

    .nav-item.active .nav-icon {
      transform: scale(1.1);
    }

    .nav-icon {
      font-size: 24px;
      transition: transform 0.3s ease;
    }

    .nav-label {
      font-size: 10px;
      margin-top: 4px;
      font-weight: 500;
    }

    /* Swipe indicator */
    .swipe-indicator {
      width: 40px;
      height: 5px;
      background: var(--pink-300);
      border-radius: 3px;
      margin: 8px auto;
    }

    /* Loading spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--pink-200);
      border-top-color: var(--pink-500);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--pink-800);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 200;
      animation: fadeInUp 0.3s ease;
    }

    /* Decorative elements */
    .star-8 {
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
  </style>
</head>

          view: 'home',
          savedItems: [],
          dhikrCounts: {},
          journalEntries: [],
          onboardingComplete: false,
          userName: '',
        };

      useEffect(() => {

      }, [state]);

      const updateState = (updates) => {
        setState(prev => ({ ...prev, ...updates }));

      const toggleSave = (item) => {
        haptic.light();
        setState(prev => {
          const exists = prev.savedItems.find(s => s.id === item.id && s.type === item.type);
          return {
            ...prev,
            savedItems: exists
              ? prev.savedItems.filter(s => !(s.id === item.id && s.type === item.type))
              : [...prev.savedItems, item]
          };
        });
      };

      const isSaved = (id, type) => {
        return state.savedItems.some(s => s.id === id && s.type === type);
      };

      return (
        <AppContext.Provider value={{ state, updateState, toggleSave, isSaved }}>

                <div
                  key={dua.id}
                  className={`glass-card rounded-3xl overflow-hidden animate-fade-in-up`}
                  style={{ animationDelay: `${i * 0.1}s`, animationFillMode: 'both' }}
                >
                  <button
                    onClick={() => { haptic.light(); setExpanded(expanded === dua.id ? null : dua.id); }}
                    className={`w-full p-6 text-left bg-gradient-to-r ${dua.color}`}
                  >
                    <div className="flex items-center justify-between mb-4">
                      <div className="flex items-center gap-3">
                        <span className="text-2xl">{dua.icon}</span>
                        <span className="text-sm font-semibold text-pink-700 uppercase tracking-wide">
                          {dua.category}
                        </span>
                      </div>
                      <button
                        onClick={(e) => { e.stopPropagation(); toggleSave({ ...dua, type: 'dua' }); }}
                        className={`w-8 h-8 rounded-full flex items-center justify-center ${
                          isSaved(dua.id, 'dua') ? 'bg-pink-500 text-white' : 'bg-white/50 text-pink-400'
                        }`}
                      >
                        <svg className="w-4 h-4" fill={isSaved(dua.id, 'dua') ? 'currentColor' : 'none'} viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                      </button>
                    </div>

                    <p className="font-arabic text-2xl text-pink-900 text-right leading-loose mb-4">
                      {dua.arabic}
                    </p>

                    <p className="text-pink-800 italic leading-relaxed">
                      "{dua.translation}"
                    </p>
                  </button>

                  {expanded === dua.id && (
                    <div className="p-6 pt-0 bg-white/50 animate-fade-in">
                      <div className="pt-4 border-t border-pink-200/50 space-y-3">
                        <div>
                          <p className="text-xs font-semibold text-pink-500 uppercase mb-1">Transliteration</p>
                          <p className="text-pink-700">{dua.transliteration}</p>
                        </div>
                        <div>
                          <p className="text-xs font-semibold text-pink-500 uppercase mb-1">Source</p>
                          <p className="text-pink-700">{dua.source}</p>
                        </div>
                        <div className="p-3 rounded-xl bg-pink-100/50">
                          <p className="text-sm text-pink-700">💫 {dua.benefit}</p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </PageWrapper>
      );
    };

    // ============================================
    // PRAYER TIMES VIEW
    // ============================================

    const PrayerView = () => {
      const { updateState } = useApp();
      const [times, setTimes] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const prayers = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
      const prayerIcons = {
        Fajr: '🌅',
        Sunrise: '☀️',
        Dhuhr: '🌤️',
        Asr: '⛅',
        Maghrib: '🌇',
        Isha: '🌙'
      };

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              fetch(`https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=2`)
                .then(res => res.json())
                .then(data => {
                  setTimes(data.data.timings);
                  setLoading(false);
                })
                .catch(() => {
                  setError('Unable to fetch prayer times');
                  setLoading(false);
                });
            },
            () => {
              setError('Please enable location access');
              setLoading(false);
            }
          );
        } else {
          setError('Location not supported');
          setLoading(false);
        }
      }, []);

      // Determine current/next prayer
      const getCurrentPrayer = () => {
        if (!times) return null;
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        for (let i = prayers.length - 1; i >= 0; i--) {
          const [h, m] = times[prayers[i]].split(':').map(Number);
          if (currentMinutes >= h * 60 + m) return prayers[i];
        }
        return prayers[prayers.length - 1];
      };

      const currentPrayer = getCurrentPrayer();

      return (
        <PageWrapper>
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-8 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Prayer Times</h1>
              <p className="font-ruqaa text-2xl text-pink-400">أوقات الصلاة</p>
              <p className="text-sm text-pink-500 mt-2">
                {new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}
              </p>
            </div>

            {loading ? (
              <div className="flex flex-col items-center justify-center py-20">
                <div className="spinner mb-4"></div>
                <p className="text-pink-500">Finding your location...</p>
              </div>
            ) : error ? (
              <div className="glass-card p-8 rounded-3xl text-center">
                <p className="text-4xl mb-4">📍</p>
                <p className="text-pink-700 mb-2">{error}</p>
                <p className="text-sm text-pink-500">Enable location to see accurate prayer times</p>
              </div>
            ) : (
              <div className="space-y-3">
                {prayers.map((prayer, i) => (
                  <div
                    key={prayer}
                    className={`p-5 rounded-2xl flex items-center justify-between animate-fade-in-up ${
                      currentPrayer === prayer
                        ? 'bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-lg shadow-pink-200'
                        : 'glass-card'
                    }`}
                    style={{ animationDelay: `${i * 0.1}s`, animationFillMode: 'both' }}
                  >
                    <div className="flex items-center gap-4">
                      <span className="text-2xl">{prayerIcons[prayer]}</span>
                      <div>
                        <p className={`font-semibold ${currentPrayer === prayer ? 'text-white' : 'text-pink-800'}`}>
                          {prayer}
                        </p>
                        {currentPrayer === prayer && (
                          <p className="text-xs text-pink-100">Current prayer</p>
                        )}
                      </div>
                    </div>
                    <p className={`text-xl font-semibold ${currentPrayer === prayer ? 'text-white' : 'text-pink-600'}`}>
                      {times[prayer]}
                    </p>
                  </div>
                ))}
              </div>
            )}

            {/* Hijri Date */}
            {times && (
              <div className="mt-8 text-center animate-fade-in" style={{ animationDelay: '0.6s' }}>
                <p className="font-arabic text-xl text-pink-400">اللهم بارك لنا في أوقاتنا</p>
                <p className="text-sm text-pink-500 mt-2">O Allah, bless us in our time</p>
              </div>
            )}
          </div>
        </PageWrapper>
      );
    };

    // ============================================
    // SAHABIYAT VIEW
    // ============================================

    const SahabiyatView = () => {
      const { updateState } = useApp();
      const [selected, setSelected] = useState(null);

      if (selected) {
        return (
          <PageWrapper>
            <div className="p-5 pt-8 max-w-lg mx-auto safe-top animate-fade-in">
              <BackButton onClick={() => setSelected(null)} />

              {/* Hero Section */}
              <div className={`rounded-3xl p-8 mb-6 bg-gradient-to-br ${selected.color} text-white`}>
                <p className="font-ruqaa text-3xl mb-2 opacity-90">{selected.nameArabic}</p>
                <h1 className="text-2xl font-bold mb-2">{selected.name}</h1>
                <p className="text-white/80">{selected.title}</p>
                <p className="text-sm text-white/60 mt-1">{selected.years}</p>
              </div>

              {/* Story */}
              <div className="glass-card p-6 rounded-3xl mb-4">
                <h3 className="font-semibold text-pink-800 mb-3">Her Story</h3>
                <p className="text-pink-700 leading-relaxed">{selected.story}</p>
              </div>

              {/* Qualities */}
              <div className="glass-card p-6 rounded-3xl mb-4">
                <h3 className="font-semibold text-pink-800 mb-3">Known For</h3>
                <div className="flex flex-wrap gap-2">
                  {selected.qualities.map((q, i) => (
                    <span key={i} className="px-3 py-1.5 bg-pink-100 text-pink-700 rounded-full text-sm">
                      {q}
                    </span>
                  ))}
                </div>
              </div>

              {/* Lesson */}
              <div className="glass-card-pink p-6 rounded-3xl">
                <h3 className="font-semibold text-pink-800 mb-3">✨ Lesson</h3>
                <p className="text-pink-700 leading-relaxed">{selected.lesson}</p>
              </div>
            </div>
          </PageWrapper>
        );
      }

      return (
        <PageWrapper>
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-8 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Sahabiyat</h1>
              <p className="font-ruqaa text-2xl text-pink-400">الصحابيات</p>
              <p className="text-sm text-pink-500 mt-2">Inspiring women of Islamic history</p>
            </div>

            <div className="space-y-4">
              {sahabiyatData.map((woman, i) => (
                <button
                  key={woman.id}
                  onClick={() => { haptic.light(); setSelected(woman); }}
                  className={`w-full rounded-3xl p-6 text-left bg-gradient-to-br ${woman.color} text-white active:scale-[0.98] transition-transform animate-fade-in-up shadow-lg`}
                  style={{ animationDelay: `${i * 0.1}s`, animationFillMode: 'both' }}
                >
                  <p className="font-ruqaa text-2xl opacity-80 mb-1">{woman.nameArabic}</p>
                  <h3 className="text-xl font-bold mb-1">{woman.name}</h3>
                  <p className="text-white/80 text-sm mb-3">{woman.title}</p>
                  <p className="text-white/70 text-sm line-clamp-2">{woman.summary}</p>
                  <div className="flex items-center gap-2 mt-4 text-white/60 text-sm">
                    <span>Read her story</span>
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                    </svg>
                  </div>
                </button>
              ))}
            </div>
          </div>
        </PageWrapper>
      );
    };

    // ============================================
    // DHIKR COUNTER
    // ============================================

    const DhikrView = () => {
      const { state, updateState } = useApp();
      const [currentDhikr, setCurrentDhikr] = useState(0);
      const [count, setCount] = useState(0);
      const [showComplete, setShowComplete] = useState(false);

      const dhikr = dhikrList[currentDhikr];
      const progress = Math.min((count / dhikr.target) * 100, 100);

      const handleTap = () => {
        haptic.light();
        if (count < dhikr.target) {
          setCount(c => c + 1);
        }
        if (count + 1 >= dhikr.target) {
          haptic.success();
          setShowComplete(true);
          setTimeout(() => setShowComplete(false), 2000);
        }
      };

      const handleNext = () => {
        haptic.medium();
        setCurrentDhikr((c) => (c + 1) % dhikrList.length);
        setCount(0);
      };

      const handleReset = () => {
        haptic.light();
        setCount(0);
      };

      return (
        <PageWrapper className="flex flex-col">
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top flex-1 flex flex-col">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-8 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Dhikr Counter</h1>
              <p className="font-ruqaa text-2xl text-pink-400">التسبيح</p>
            </div>

            {/* Dhikr Selector */}
            <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-4 mb-8">
              {dhikrList.map((d, i) => (
                <button
                  key={i}
                  onClick={() => { haptic.light(); setCurrentDhikr(i); setCount(0); }}
                  className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all ${
                    currentDhikr === i
                      ? 'bg-pink-500 text-white shadow-lg shadow-pink-200'
                      : 'bg-white/70 text-pink-600'
                  }`}
                >
                  {d.transliteration}
                </button>
              ))}
            </div>

            {/* Main Counter */}
            <div className="flex-1 flex flex-col items-center justify-center">
              <p className="font-arabic text-3xl text-pink-700 mb-4 animate-fade-in">{dhikr.arabic}</p>
              <p className="text-pink-500 mb-2">{dhikr.transliteration}</p>
              <p className="text-sm text-pink-400 mb-8">{dhikr.meaning}</p>

              {/* Counter Circle */}
              <div className="relative mb-8">
                {/* Progress Ring */}
                <svg className="absolute inset-0 w-52 h-52 -rotate-90">
                  <circle
                    cx="104"
                    cy="104"
                    r="96"
                    stroke="#fce7f3"
                    strokeWidth="8"
                    fill="none"
                  />
                  <circle
                    cx="104"
                    cy="104"
                    r="96"
                    stroke="url(#gradient)"
                    strokeWidth="8"
                    fill="none"
                    strokeLinecap="round"
                    strokeDasharray={`${progress * 6.03} 603`}
                    className="transition-all duration-150"
                  />
                  <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stopColor="#ec4899" />
                      <stop offset="100%" stopColor="#be185d" />
                    </linearGradient>
                  </defs>
                </svg>

                {/* Tap Area */}
                <button
                  onClick={handleTap}
                  className={`dhikr-circle ${count >= dhikr.target ? 'animate-pulse' : ''}`}
                  style={{ width: '208px', height: '208px' }}
                >
                  <span className="text-5xl font-bold gradient-text">{count}</span>
                  <span className="text-pink-400 text-sm mt-1">/ {dhikr.target}</span>
                </button>
              </div>

              {/* Controls */}
              <div className="flex gap-4">
                <button
                  onClick={handleReset}
                  className="w-12 h-12 rounded-full bg-white/70 flex items-center justify-center text-pink-400 active:scale-90 transition-transform"
                >
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                </button>
                <button
                  onClick={handleNext}
                  className="px-6 py-3 rounded-full bg-pink-500 text-white font-medium active:scale-95 transition-transform shadow-lg shadow-pink-200"
                >
                  Next Dhikr
                </button>
              </div>
            </div>

            {/* Completion Toast */}
            <Toast message="✨ Completed! MashaAllah!" show={showComplete} />
          </div>
        </PageWrapper>
      );
    };

    // ============================================
    // SAVED VIEW
    // ============================================

    const SavedView = () => {
      const { state, updateState, toggleSave } = useApp();

      return (
        <PageWrapper>
          <div className="p-5 pt-8 max-w-lg mx-auto safe-top">
            <BackButton onClick={() => updateState({ view: 'home' })} label="Home" />

            <div className="text-center mb-8 animate-fade-in">
              <h1 className="text-3xl font-bold gradient-text mb-2">Saved Items</h1>
              <p className="font-ruqaa text-2xl text-pink-400">المحفوظات</p>
            </div>

            {state.savedItems?.length === 0 ? (
              <div className="glass-card p-12 rounded-3xl text-center animate-fade-in">
                <p className="text-5xl mb-4">💖</p>
                <h3 className="text-lg font-semibold text-pink-800 mb-2">No saved items yet</h3>
                <p className="text-pink-500">Tap the heart icon on hadith or duas to save them here</p>
              </div>
            ) : (
              <div className="space-y-4">
                {state.savedItems.map((item, i) => (
                  <div
                    key={`${item.type}-${item.id}`}
                    className="glass-card p-5 rounded-2xl animate-fade-in-up"
                    style={{ animationDelay: `${i * 0.1}s` }}
                  >
                    <div className="flex items-start justify-between mb-3">
                      <span className="px-2 py-1 bg-pink-100 text-pink-600 rounded-full text-xs font-medium uppercase">
                        {item.type}
                      </span>
                      <button
                        onClick={() => toggleSave(item)}
                        className="text-pink-500"
                      >
                        <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                          <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                      </button>
                    </div>
                    {item.arabic && (
                      <p className="font-arabic text-xl text-pink-800 text-right mb-3">{item.arabic}</p>
                    )}
                    <p className="text-pink-700 leading-relaxed">
                      {item.text || item.translation}
                    </p>
                    {item.source && (
                      <p className="text-xs text-pink-500 mt-2">{item.source}</p>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </PageWrapper>
      );
    };

    // ============================================
    // BOTTOM NAVIGATION
    // ============================================

    const BottomNav = () => {
      const { state, updateState } = useApp();

      const navItems = [
        { id: 'home', icon: '🏠', label: 'Home' },
        { id: 'hadith', icon: '📖', label: 'Hadith' },
        { id: 'dhikr', icon: '📿', label: 'Dhikr' },
        { id: 'duas', icon: '🤲', label: 'Duas' },
        { id: 'saved', icon: '💖', label: 'Saved' },
      ];

      return (
        <nav className="bottom-nav">
          <div className="max-w-lg mx-auto flex items-center justify-around py-2">
            {navItems.map((item) => (
              <button
                key={item.id}
                onClick={() => { haptic.light(); updateState({ view: item.id }); }}
                className={`nav-item ${state.view === item.id ? 'active' : ''}`}
              >
                <span className={`nav-icon ${state.view === item.id ? 'scale-110' : ''} transition-transform`}>
                  {item.icon}
                </span>
                <span className="nav-label">{item.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };

    // ============================================
    // MAIN APP
    // ============================================

    const App = () => {
      const { state } = useApp();

      if (!state.onboardingComplete) {
        return <Onboarding />;
      }

      const renderView = () => {
        switch(state.view) {
          case 'hadith': return <HadithView />;
          case 'duas': return <DuasView />;
          case 'prayer': return <PrayerView />;
          case 'sahabiyat': return <SahabiyatView />;
          case 'dhikr': return <DhikrView />;
          case 'saved': return <SavedView />;
          default: return <HomeScreen />;
        }
      };

      return (
        <>
          {renderView()}
          <BottomNav />
        </>
      );
    };

    // ============================================
    // RENDER
    // ============================================

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
